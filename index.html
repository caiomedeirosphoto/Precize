<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Precize</title>
<meta name="description" content="Precize, finanças mais simples. Lance entradas e saídas, veja para onde foi o dinheiro e planeje o mês.">
<meta name="theme-color" content="#0A0C0B" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F2F4F3" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Precize">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<script src="firebase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  --g:.45;
  --bg:#F2F2F7; --card:#FFFFFF; --card-2:#F7F7FA;
  --fill:rgba(118,118,128,.12); --fill-2:rgba(120,120,128,.20);
  --sep:rgba(60,60,67,.15);
  --label:#000; --label-2:rgba(60,60,67,.62); --label-3:rgba(60,60,67,.30);
  --tint:#007AFF; --tint-2:#3395FF; --tint-soft:rgba(0,122,255,.12);
  --green:#34C759; --green-t:#248A3D; --red:#FF3B30; --red-t:#D70015; --orange:#FF9500; --orange-t:#C93400;
  --glass-base:#FFFFFF; --spec:.9; --edge:rgba(0,0,0,.10); --thumb:#FFFFFF;
  --glass-shadow:0 12px 32px rgba(0,0,0,.10),0 2px 8px rgba(0,0,0,.05);
  --sheet-base:#F4F4F8;
  --amb-a:rgba(0,122,255,.20); --amb-b:rgba(175,82,222,.16); --amb-c:rgba(255,149,0,.14);
  --spring:cubic-bezier(.32,.72,0,1); --bounce:cubic-bezier(.34,1.5,.64,1); --soft:cubic-bezier(.25,.8,.25,1);
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI',Roboto,system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Roboto,system-ui,sans-serif;
  --rounded:ui-rounded,'SF Pro Rounded',-apple-system,BlinkMacSystemFont,'Inter',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000; --card:#1C1C1E; --card-2:#232325;
    --fill:rgba(118,118,128,.24); --fill-2:rgba(120,120,128,.34); --sep:rgba(84,84,88,.55);
    --label:#FFF; --label-2:rgba(235,235,245,.62); --label-3:rgba(235,235,245,.30);
    --tint:#0A84FF; --tint-2:#4AA3FF; --tint-soft:rgba(10,132,255,.22);
    --green:#30D158; --green-t:#30D158; --red:#FF453A; --red-t:#FF6961; --orange:#FF9F0A; --orange-t:#FF9F0A;
    --glass-base:#2C2C2F; --spec:.34; --edge:rgba(0,0,0,.6); --thumb:#8A8A8F;
    --glass-shadow:0 12px 32px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.3);
    --sheet-base:#1C1C1E;
    --amb-a:rgba(10,132,255,.30); --amb-b:rgba(191,90,242,.22); --amb-c:rgba(255,159,10,.14);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000; --card:#1C1C1E; --card-2:#232325;
  --fill:rgba(118,118,128,.24); --fill-2:rgba(120,120,128,.34); --sep:rgba(84,84,88,.55);
  --label:#FFF; --label-2:rgba(235,235,245,.62); --label-3:rgba(235,235,245,.30);
  --tint:#0A84FF; --tint-2:#4AA3FF; --tint-soft:rgba(10,132,255,.22);
  --green:#30D158; --green-t:#30D158; --red:#FF453A; --red-t:#FF6961; --orange:#FF9F0A; --orange-t:#FF9F0A;
  --glass-base:#2C2C2F; --spec:.34; --edge:rgba(0,0,0,.6); --thumb:#8A8A8F;
  --glass-shadow:0 12px 32px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.3);
  --sheet-base:#1C1C1E;
  --amb-a:rgba(10,132,255,.30); --amb-b:rgba(191,90,242,.22); --amb-c:rgba(255,159,10,.14);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.35;letter-spacing:-.012em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;transition:background .45s var(--spring);overflow-x:hidden}
body.sheet-open{background:#000}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--tint) 55%,transparent);outline-offset:2px;border-radius:12px}
h1,h2,h3{margin:0}
svg{display:block;flex:none}
.rnd{font-family:var(--rounded);font-variant-numeric:tabular-nums}
.l2{color:var(--label-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

/* ================= vidro ================= */
.glass{
  position:relative;isolation:isolate;
  background:color-mix(in srgb,var(--glass-base) calc(22% + 62% * var(--g)),transparent);
  -webkit-backdrop-filter:blur(calc(8px + 18px * var(--g))) saturate(185%) brightness(1.04);
  backdrop-filter:blur(calc(8px + 18px * var(--g))) saturate(185%) brightness(1.04);
  box-shadow:
    inset 0 1px .5px rgba(255,255,255,var(--spec)),
    inset 0 -1px 1px rgba(255,255,255,calc(var(--spec) * .28)),
    0 0 0 .6px var(--edge),
    var(--glass-shadow);
}
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;z-index:1;
  background:linear-gradient(150deg,rgba(255,255,255,calc(var(--spec) * 1.05)),rgba(255,255,255,.12) 30%,rgba(255,255,255,0) 52%,rgba(255,255,255,.08) 72%,rgba(255,255,255,calc(var(--spec) * .7)));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
}
.glass::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
  background:radial-gradient(140% 70% at 30% -10%,rgba(255,255,255,calc(var(--spec) * .38)),transparent 58%),
             radial-gradient(160px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,calc(var(--spec) * .55 * var(--press,0))),transparent 70%);
  transition:opacity .3s ease;
}
.glass>*{position:relative;z-index:2}
.press{transition:transform .35s var(--bounce),filter .3s ease}
.press.pressed{transform:scale(1.045);--press:1;filter:brightness(1.05)}
.press.pressed.sm-press{transform:scale(1.08)}

/* ================= casca ================= */
.app{min-height:100vh;position:relative;background:var(--bg);transition:transform .55s var(--spring),filter .55s var(--spring),border-radius .55s var(--spring)}
body.sheet-open.deep .app{transform:scale(.94);filter:brightness(.75);border-radius:18px;overflow:hidden}
.ambient{position:absolute;left:0;right:0;top:0;height:560px;pointer-events:none;overflow:hidden;z-index:0;
  -webkit-mask:linear-gradient(#000 40%,transparent);mask:linear-gradient(#000 40%,transparent)}
.ambient i{position:absolute;border-radius:50%;filter:blur(60px)}
.ambient i:nth-child(1){width:360px;height:360px;left:-80px;top:-60px;background:var(--amb-a);animation:drift1 18s ease-in-out infinite alternate}
.ambient i:nth-child(2){width:300px;height:300px;right:-60px;top:40px;background:var(--amb-b);animation:drift2 22s ease-in-out infinite alternate}
.ambient i:nth-child(3){width:260px;height:260px;left:30%;top:220px;background:var(--amb-c);animation:drift1 26s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(40px,30px) scale(1.08)}}
@keyframes drift2{to{transform:translate(-50px,40px) scale(.94)}}
.side{display:none}
.main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:44px 16px 128px}

.navbar{
  position:fixed;left:0;right:0;top:0;z-index:40;height:calc(46px + env(safe-area-inset-top,0px));
  padding-top:env(safe-area-inset-top,0px);display:flex;align-items:center;justify-content:center;
  transition:background .3s ease,box-shadow .3s ease;
}
.navbar::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity .3s ease;
  bottom:-18px;background:color-mix(in srgb,var(--bg) calc(72% + 20% * var(--g)),transparent);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  -webkit-mask:linear-gradient(#000 62%,transparent);mask:linear-gradient(#000 62%,transparent)}
.navbar.scrolled::before{opacity:1}
.nb-title{position:relative;font-size:17px;font-weight:600;opacity:0;transform:translateY(6px);transition:opacity .25s ease,transform .35s var(--spring)}
.navbar.scrolled .nb-title{opacity:1;transform:none}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 4px 14px}
.large-title{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:-.024em;line-height:1.15}
.head-sub{font-size:15px;color:var(--label-2);margin-top:2px}

.tabbar{
  position:fixed;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:40;
  height:64px;border-radius:32px;display:grid;grid-template-columns:repeat(5,1fr);padding:4px;
  max-width:520px;margin:0 auto;transition:transform .55s var(--spring),filter .55s var(--spring);
}
body.sheet-open.deep .tabbar{transform:scale(.94) translateY(8px);filter:brightness(.75)}
.tabbar .lens{position:absolute;z-index:1;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/5);border-radius:28px;
  background:color-mix(in srgb,var(--label) 9%,transparent);
  box-shadow:inset 0 1px .5px rgba(255,255,255,calc(var(--spec)*.6));
  transform:translateX(calc(var(--ti,0) * 100%));transition:transform .55s var(--spring),scale .22s var(--soft)}
.tabbar.moving .lens{scale:1.16 .9}
.tabbar button{position:relative;z-index:2;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--label);font-size:10.5px;font-weight:600;letter-spacing:0;border-radius:28px}
.tabbar button svg{transition:transform .35s var(--bounce)}
.tabbar button[aria-current="page"]{color:var(--tint)}
.tabbar button:active svg{transform:scale(.84)}

/* ================= conteúdo ================= */
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px}
.caption{font-size:13px;font-weight:600;color:var(--label-2)}
.plain{border:0;background:transparent;color:var(--tint);font-size:17px;padding:4px 0}
.plain:active{opacity:.45}
.sec-h{font-size:13px;color:var(--label-2);padding:0 16px 7px;margin-top:24px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.sec-h b{font-family:var(--display);font-size:22px;font-weight:700;color:var(--label);letter-spacing:-.02em}
.sec-f{font-size:13px;color:var(--label-2);padding:7px 16px 0;line-height:1.38}
.group{background:var(--card);border-radius:22px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 16px;position:relative;width:100%;border:0;background:transparent;text-align:left;color:inherit}
.cell+.cell::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);height:1px;background:var(--sep);transform:scaleY(.5);transform-origin:0 0}
.cell.icon-row{--inset:58px}
button.cell{transition:background .15s ease}
button.cell:active{background:var(--fill)}
.cell .grow{flex:1;min-width:0}
.cell .t{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .s{font-size:14px;color:var(--label-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.cell .v{font-size:17px;color:var(--label-2);white-space:nowrap}
.cell .chev{color:var(--label-3)}
.cell input.inl,.cell select.inl{border:0;background:transparent;text-align:right;color:var(--label-2);font-size:17px;padding:4px 0;width:44%;min-width:90px;outline:none}
.cell input.inl:focus{color:var(--tint)}
.cell select.inl{appearance:none;-webkit-appearance:none;cursor:pointer;direction:rtl}
.cell input.inl-left{border:0;background:transparent;font-size:17px;padding:4px 0;flex:1;min-width:0;outline:none;color:var(--label)}
.cell.destructive{justify-content:center;color:var(--red-t)}
.cell.action{color:var(--tint)}
input[data-bud]::placeholder{color:var(--tint);opacity:.85}

.sq{display:grid;place-items:center;flex:none;color:#fff;width:30px;height:30px;border-radius:8px;position:relative;overflow:hidden}
.sq::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 48%);box-shadow:inset 0 1px .5px rgba(255,255,255,.5),inset 0 0 0 .5px rgba(0,0,0,.08)}
.sq svg,.sq b{position:relative;z-index:1}
.sq.lg{width:40px;height:40px;border-radius:12px}
.sq.xl{width:54px;height:54px;border-radius:16px}
.sq b{font-size:15px;font-weight:700}

/* segmentado com gota de vidro */
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n,2),1fr);background:var(--fill);border-radius:100px;padding:3px;height:38px;margin-bottom:14px}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n,2));border-radius:100px;background:var(--thumb);
  box-shadow:0 3px 10px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.06),inset 0 1px .5px rgba(255,255,255,.9);
  transform:translateX(calc(var(--i,0) * 100%));transition:transform .45s var(--spring),scale .2s var(--soft)}
.seg.moving .thumb{scale:1.12 .92}
.seg button{position:relative;z-index:1;border:0;background:transparent;font-size:14.5px;font-weight:500;border-radius:100px;transition:color .2s}
.seg button[aria-pressed="true"]{font-weight:600}
.seg.danger button[aria-pressed="true"][data-v="out"]{color:var(--red-t)}
.seg.danger button[aria-pressed="true"][data-v="in"]{color:var(--green-t)}

.caps{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:2px 16px 6px}
.caps::-webkit-scrollbar{display:none}
.cap{flex:none;border:0;background:var(--fill);color:var(--label);border-radius:100px;padding:8px 15px;font-size:15px;font-weight:500;transition:background .25s ease,color .25s ease,transform .3s var(--bounce)}
.cap:active{transform:scale(.93)}
.cap[aria-pressed="true"]{background:var(--label);color:var(--bg)}

.btn{border:0;height:52px;border-radius:100px;padding:0 22px;background:var(--tint);color:#fff;font-size:17px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;
  box-shadow:inset 0 1px .5px rgba(255,255,255,.45),0 8px 22px color-mix(in srgb,var(--tint) 32%,transparent);transition:transform .35s var(--bounce),background .35s ease,box-shadow .35s ease}
.btn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%)}
.btn:active{transform:scale(.96)}
.btn.full{width:100%}
.btn.done{background:var(--green);box-shadow:inset 0 1px .5px rgba(255,255,255,.45),0 8px 22px color-mix(in srgb,var(--green) 35%,transparent)}
.btn.tinted{background:var(--tint-soft);color:var(--tint);box-shadow:none}
.btn.tinted::after,.btn.gray::after,.btn.red::after{display:none}
.btn.gray{background:var(--fill);color:var(--label);box-shadow:none}
.btn.red{background:rgba(255,59,48,.13);color:var(--red-t);box-shadow:none}
.btn.sm{height:32px;padding:0 14px;font-size:15px}
.btn.md{height:42px;font-size:16px}
.gbtn{border:0;border-radius:100px;height:40px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:var(--label)}
.gbtn.icon{width:40px;padding:0;justify-content:center}

/* switch com gota de vidro */
.switch{position:relative;width:62px;height:30px;flex:none;display:inline-block}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--fill-2);transition:background .3s ease}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:38px;height:26px;border-radius:99px;background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.06);transition:transform .45s var(--bounce),width .3s var(--soft),background .25s ease}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:active+span::after{width:44px;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.switch input:checked:active+span::after{transform:translateX(14px)}
.switch input:focus-visible+span{outline:3px solid color-mix(in srgb,var(--tint) 55%,transparent);outline-offset:2px}

/* slider com lente de vidro */
.gsl{position:relative;height:40px;touch-action:pan-y}
.gsl .tr{position:absolute;left:0;right:0;top:18px;height:5px;border-radius:9px;background:var(--fill-2);overflow:hidden}
.gsl .fi{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p,.5) * 100%);background:var(--tint);border-radius:9px}
.gsl .th{position:absolute;top:8px;left:calc(var(--p,.5) * (100% - 40px));width:40px;height:25px;border-radius:100px;background:#fff;z-index:1;pointer-events:none;
  box-shadow:0 1px 4px rgba(0,0,0,.14),0 6px 14px rgba(0,0,0,.10),inset 0 1px .5px rgba(255,255,255,1);
  transition:transform .35s var(--bounce),background .25s ease,box-shadow .25s ease}
.gsl.drag .th{transform:scale(1.5,1.4);background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(1px) saturate(200%) brightness(1.1);backdrop-filter:blur(1px) saturate(200%) brightness(1.1);
  box-shadow:inset 0 1px .5px rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.35),0 0 0 .6px rgba(0,0,0,.14),0 8px 20px rgba(0,0,0,.14)}
.gsl input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:2}
.gsl:focus-within .th{box-shadow:0 0 0 3px color-mix(in srgb,var(--tint) 45%,transparent),0 6px 14px rgba(0,0,0,.10)}

.search{display:flex;align-items:center;gap:7px;border-radius:100px;height:44px;padding:0 14px;color:var(--label-2);margin-bottom:12px}
.search input{border:0;background:transparent;flex:1;font-size:17px;outline:none;color:var(--label);min-width:0}
.search input::placeholder{color:var(--label-2)}

/* ================= lançar ================= */
.composer{border-radius:32px;padding:16px 16px 16px;margin-bottom:8px}
.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:8px 0 12px}
.amount span{font-family:var(--rounded);font-size:30px;font-weight:600;color:var(--label-2)}
.amount input{border:0;background:transparent;font-family:var(--rounded);font-size:62px;font-weight:700;letter-spacing:-.025em;width:2.6ch;max-width:82%;padding:0;outline:none;color:var(--label);font-variant-numeric:tabular-nums;transition:transform .45s var(--spring),opacity .3s ease}
.amount input::placeholder{color:var(--label-3)}
.amount.sent input{animation:sent .55s var(--spring)}
@keyframes sent{0%{transform:none;opacity:1}45%{transform:translateY(-26px) scale(.9);opacity:0}46%{transform:translateY(16px);opacity:0}100%{transform:none;opacity:1}}
.desc{width:100%;border:0;border-radius:18px;background:color-mix(in srgb,var(--card) 70%,transparent);padding:13px 16px;font-size:17px;outline:none;box-shadow:inset 0 0 0 .5px var(--sep)}
.desc:focus{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--tint) 60%,transparent)}
.catrow{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 2px;padding:6px 14px 4px;scroll-snap-type:x proximity}
.catrow::-webkit-scrollbar{display:none}
.catbtn{flex:none;width:72px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--label);padding:4px 0;line-height:1.15;text-align:center;scroll-snap-align:start}
.catbtn .sq{transition:transform .4s var(--bounce),box-shadow .3s ease}
.catbtn[aria-pressed="true"] .sq{box-shadow:0 0 0 3px var(--bg),0 0 0 5.5px var(--tint);transform:scale(.92)}
.catbtn:active .sq{transform:scale(.84)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 14px}
.ghost{position:fixed;z-index:70;pointer-events:none;font-family:var(--rounded);font-weight:700;letter-spacing:-.025em;color:var(--label);white-space:nowrap;font-variant-numeric:tabular-nums}
.opt{height:40px;border:0;border-radius:100px;padding:0 13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;font-size:15px;font-weight:500;color:var(--label);background:color-mix(in srgb,var(--card) 72%,transparent);box-shadow:inset 0 0 0 .5px var(--sep);transition:transform .35s var(--bounce),background .25s ease,color .25s ease;position:relative}
.opt:active{transform:scale(.93)}
.opt.on{background:var(--tint-soft);color:var(--tint);box-shadow:none}
.opt.warn{background:rgba(255,149,0,.15);color:var(--orange-t);box-shadow:none}
.opt select,.opt input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;-webkit-appearance:none;appearance:none}
.hist-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 4px 12px}
.hist-h b{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em}
.mpill{display:inline-flex;align-items:center;border-radius:100px;height:40px;padding:0 4px}
.mpill button{border:0;background:transparent;height:34px;border-radius:100px;display:inline-flex;align-items:center;justify-content:center;color:var(--label)}
.mpill .ch{width:32px;color:var(--tint)}
.mpill .lb{padding:0 6px;font-size:15px;font-weight:600}
.strip{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:22px;padding:13px 4px;margin-bottom:6px}
.strip div{text-align:center;position:relative;min-width:0;padding:0 6px}
.strip div+div::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:1px;background:var(--sep)}
.strip span{display:block;font-size:12px;font-weight:600;color:var(--label-2)}
.strip b{display:block;font-family:var(--rounded);font-size:19px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.day-h{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--label-2);padding:0 16px 7px;margin-top:20px}
.amt{font-size:17px;font-weight:500;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.amt.in{color:var(--green-t)}
.amt small{display:block;font-size:12px;font-weight:600;color:var(--orange-t)}

/* linhas com gesto de deslizar */
.sw{position:relative;overflow:hidden}
.sw+.sw::before{content:"";position:absolute;top:0;right:0;left:68px;height:1px;background:var(--sep);transform:scaleY(.5);transform-origin:0 0;z-index:3}
.sw-acts{position:absolute;top:0;bottom:0;right:0;display:flex;z-index:0}
.sw-acts button{border:0;color:#fff;font-size:13px;font-weight:600;width:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.sw-acts .a-pay{background:var(--green)} .sw-acts .a-del{background:var(--red);transition:flex-grow .3s var(--spring)}
.sw-acts button{transition:width .3s var(--spring)}
.sw.full .sw-acts{left:0}
.sw.full .sw-acts .a-del{flex:1;align-items:flex-end;padding-right:22px}
.sw.full .sw-acts .a-pay{width:0;overflow:hidden;padding:0}
.sw-row{position:relative;z-index:1;background:var(--card);touch-action:pan-y;transition:transform .45s var(--spring)}
.sw-row.dragging{transition:none}
.sw-row .cell::before{display:none}
.sw.new{animation:rowIn .6s var(--spring) both}
@keyframes rowIn{from{opacity:0;transform:translateY(-10px) scale(.98);max-height:0}to{opacity:1;transform:none;max-height:90px}}
.sw.flash .sw-row{animation:flash 1.6s ease}
@keyframes flash{0%,30%{background:color-mix(in srgb,var(--tint) 14%,var(--card))}100%{background:var(--card)}}
.sw.leaving{animation:rowOut .38s var(--spring) forwards}
@keyframes rowOut{to{opacity:0;max-height:0;transform:translateX(-30px)}}

/* ================= resumo ================= */
.period{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.period .pl{font-size:17px;font-weight:600}
.hero{padding:18px}
.hero-num{font-family:var(--rounded);font-size:clamp(40px,12vw,54px);font-weight:700;letter-spacing:-.025em;line-height:1.05;margin:4px 0 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hero-num.neg{color:var(--red-t)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:100px;padding:5px 11px 5px 8px;font-size:13px;font-weight:600}
.pill.up{background:rgba(52,199,89,.14);color:var(--green-t)} .pill.down{background:rgba(255,59,48,.12);color:var(--red-t)} .pill.flat{background:var(--fill);color:var(--label-2)}
.rings-card{background:#0B0B0C;color:#fff;border-radius:26px;padding:18px;margin-bottom:12px;display:grid;grid-template-columns:136px 1fr;gap:18px;align-items:center}
:root[data-theme="dark"] .rings-card{background:#1C1C1E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rings-card{background:#1C1C1E}}
.rings-card .rc-t{font-size:15px;font-weight:600;color:rgba(255,255,255,.6);grid-column:1/-1;margin-bottom:-6px}
.ring-legend{display:flex;flex-direction:column;gap:11px;min-width:0}
.rl-lab{font-size:13px;font-weight:600}
.rl-val{font-family:var(--rounded);font-size:22px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.rl-val small{font-size:14px;font-weight:600;color:rgba(255,255,255,.55);margin-left:3px}
.rings circle{transition:stroke-dashoffset 1.2s var(--spring)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.mini{background:var(--card);border-radius:22px;padding:14px;min-width:0}
.mini .mi-h{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600}
.mini .mi-v{font-family:var(--rounded);font-size:26px;font-weight:700;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.mini .mi-s{font-size:13px;color:var(--label-2);margin-top:2px}
.stor{display:flex;height:12px;border-radius:5px;overflow:hidden;gap:2px;background:var(--fill);margin:4px 0 10px}
.stor i{display:block;height:100%;border-radius:2px;transition:flex-grow .8s var(--spring)}
.bar{height:6px;border-radius:99px;background:var(--fill);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:99px;width:0;transition:width .9s var(--spring)}
.cal{width:40px;height:40px;border-radius:10px;background:var(--card);box-shadow:inset 0 0 0 1px var(--sep);overflow:hidden;flex:none;display:flex;flex-direction:column;align-items:center}
.cal i{display:block;width:100%;background:var(--red);color:#fff;font-style:normal;font-size:9px;font-weight:700;text-align:center;line-height:13px}
.cal b{font-family:var(--rounded);font-size:19px;font-weight:600;line-height:26px}
.check{width:34px;height:34px;border:0;background:transparent;color:var(--label-3);display:grid;place-items:center;border-radius:50%;transition:color .2s,transform .3s var(--bounce);flex:none}
.check:active{transform:scale(.82);color:var(--green)}
.empty{text-align:center;padding:26px 16px;color:var(--label-2);font-size:15px}
.empty b{display:block;color:var(--label);font-size:17px;font-weight:600;margin-bottom:3px}
.empty .sq{margin:0 auto 10px}
.chart{display:block;width:100%;height:auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:22px;padding:14px 4px;margin-bottom:6px}
.stats div{text-align:center;padding:0 6px;position:relative;min-width:0}
.stats div+div::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;background:var(--sep)}
.stats span{display:block;font-size:12px;color:var(--label-2);font-weight:600}
.stats b{display:block;font-family:var(--rounded);font-size:19px;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}

/* ================= precificar ================= */
.price{position:sticky;top:calc(54px + env(safe-area-inset-top,0px));z-index:20;border-radius:28px;padding:14px 18px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.price .pv{font-family:var(--rounded);font-size:40px;font-weight:700;color:var(--tint);line-height:1;letter-spacing:-.025em;white-space:nowrap;font-variant-numeric:tabular-nums}
.price .ps{text-align:right;font-size:13px;color:var(--label-2);line-height:1.5}
.price .ps b{font-family:var(--rounded);font-size:17px;color:var(--label);font-weight:600}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.type{border:0;background:var(--card);border-radius:20px;padding:13px 6px 11px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px;font-weight:600;line-height:1.2;text-align:center;box-shadow:0 0 0 2px transparent;transition:box-shadow .3s ease,transform .35s var(--bounce)}
.type:active{transform:scale(.95)}
.type[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--tint)}
.tipkit{display:flex;gap:12px;background:var(--card);border-radius:22px;padding:14px 16px;margin-top:12px}
.tipkit .tk-i{color:var(--orange)}
.tipkit b{display:block;font-size:15px;font-weight:600;margin-bottom:2px}
.tipkit p{margin:0;font-size:15px;color:var(--label-2);line-height:1.38}
.slrow{padding:12px 16px 6px;position:relative}
.slrow+.slrow::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep);transform:scaleY(.5)}
.slrow .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.slrow label{font-size:17px}
.slrow output{font-family:var(--rounded);font-size:17px;font-weight:600;color:var(--tint);white-space:nowrap;font-variant-numeric:tabular-nums}
.slrow .hint{font-size:13px;color:var(--label-2);margin:-2px 0 4px}
.kv{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;position:relative;font-size:17px}
.kv+.kv::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep);transform:scaleY(.5)}
.kv span{display:flex;align-items:center;gap:9px;min-width:0}
.kv b{font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.kv.total b{font-family:var(--rounded);font-size:22px;font-weight:700;color:var(--tint)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.range{position:relative;height:30px;margin:6px 0 2px}
.range .r-track{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:99px;background:var(--fill)}
.range .r-ok{position:absolute;top:12px;height:6px;border-radius:99px;background:var(--green)}
.range .r-you{position:absolute;top:5px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px var(--tint),0 3px 8px rgba(0,0,0,.2);transition:left .7s var(--spring)}
.range-l{display:flex;justify-content:space-between;font-size:13px;color:var(--label-2)}
.minus{width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;border:0;display:grid;place-items:center;flex:none;padding:0}
.plus-g{width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
.mring{flex:none}
.mring circle{transition:stroke-dashoffset 1.1s var(--spring)}

/* ================= folha flutuante ================= */
.sheet-wrap{position:fixed;inset:0;z-index:60;visibility:hidden}
.sheet-wrap.on{visibility:visible}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.22);opacity:0;transition:opacity .45s var(--spring)}
.sheet-wrap.on .sheet-bg{opacity:1}
.sheet{
  position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));top:calc(env(safe-area-inset-top,0px) + 14px);
  border-radius:36px;display:flex;flex-direction:column;
  background:color-mix(in srgb,var(--sheet-base) calc(80% + 16% * var(--g)),transparent);
  -webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);
  box-shadow:inset 0 1px .5px rgba(255,255,255,var(--spec)),0 0 0 .6px var(--edge),0 24px 60px rgba(0,0,0,.28);
  transform:translateY(calc(100% + 40px));transition:transform .6s var(--spring)
}
.sheet.small{top:auto;max-height:84vh}
.sheet-wrap.on .sheet{transform:translateY(0)}
.sheet.dragging{transition:none}
.sh-bar{flex:none;padding:8px 12px 0;touch-action:none}
.grab{width:38px;height:5px;border-radius:99px;background:var(--label-3);margin:0 auto 6px}
.sh-nav{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;height:48px}
.sh-nav h3{font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-nav .gbtn.go{background:var(--tint);color:#fff;box-shadow:inset 0 1px .5px rgba(255,255,255,.45)}
.sh-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.sheet .group,.sheet .cap:not([aria-pressed="true"]){background:color-mix(in srgb,var(--card) 88%,transparent)}

/* ilha dinâmica */
.island{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:90;transform:translateX(-50%) scale(.6);opacity:0;
  background:#000;color:#fff;border-radius:24px;height:42px;width:126px;display:flex;align-items:center;overflow:hidden;
  box-shadow:0 12px 34px rgba(0,0,0,.28);transition:width .55s var(--spring),opacity .25s ease,transform .55s var(--bounce);pointer-events:none}
.island.on{opacity:1;transform:translateX(-50%) scale(1);pointer-events:auto}
.island .in{display:flex;align-items:center;gap:10px;padding:0 8px 0 11px;white-space:nowrap;opacity:0;transition:opacity .25s ease .14s;font-size:15px;font-weight:600}
.island.on .in{opacity:1}
.island .ok{color:#30D158}
.island button{border:0;background:rgba(255,255,255,.16);color:#fff;font-size:14px;font-weight:600;border-radius:100px;height:30px;padding:0 13px}

.panel{display:none}
.panel.on{display:block;animation:panelIn .5s var(--spring) both}
@keyframes panelIn{from{opacity:0;transform:translateY(12px) scale(.985);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}

/* ================= telas grandes ================= */
@media (min-width:1024px){
  .navbar,.tabbar{display:none}
  .app{display:grid;grid-template-columns:270px 1fr}
  .side{display:flex;flex-direction:column;position:sticky;top:10px;height:calc(100vh - 20px);margin:10px 0 10px 10px;padding:18px 12px;border-radius:26px;z-index:5}
  .side .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-size:15px;font-weight:700}
  .side-nav{display:flex;flex-direction:column;gap:3px;position:relative}
  .side-nav button{border:0;background:transparent;display:flex;align-items:center;gap:11px;height:38px;padding:0 12px;border-radius:13px;font-size:15px;font-weight:500;color:var(--label);text-align:left;transition:background .2s ease}
  .side-nav button svg{color:var(--tint)}
  .side-nav button:hover{background:var(--fill)}
  .side-nav button[aria-current="page"]{background:var(--tint);color:#fff;box-shadow:inset 0 1px .5px rgba(255,255,255,.4)}
  .side-nav button[aria-current="page"] svg{color:#fff}
  .side-foot{margin-top:auto;padding:0 10px;font-size:12px;color:var(--label-2);display:flex;align-items:center;gap:6px}
  .side-foot i{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .side-foot.saving i{background:var(--orange)} .side-foot.err i{background:var(--red)}
  .main{max-width:1120px;width:100%;padding:30px 40px 60px}
  .lanc{display:grid;grid-template-columns:400px 1fr;gap:24px;align-items:start}
  .lanc>*{min-width:0}
  .lanc .composer{position:sticky;top:24px}
  .lanc .hist-h{margin-top:4px}
  .cols{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;align-items:start}
  .cols>*{min-width:0}
  .overview{display:grid;grid-template-columns:1fr 1fr;gap:12px;grid-template-areas:"hero rings" "duo rings";margin-bottom:12px}
  .overview>*{margin-bottom:0 !important}
  #rHero{grid-area:hero} #rRings{grid-area:rings;align-content:center} #rDuo{grid-area:duo}
  .rings-card{grid-template-columns:180px 1fr;gap:26px;padding:22px 24px}
  .rings-card .rl-val{font-size:26px}
  .calc{display:grid;grid-template-columns:1fr 390px;gap:20px;align-items:start}
  .calc>*{min-width:0}
  .price{top:18px}
  .sheet{left:50%;right:auto;top:50%;bottom:auto;width:560px;max-height:86vh;transform:translate(-50%,-46%) scale(.94);opacity:0;transition:transform .45s var(--spring),opacity .25s ease}
  .sheet-wrap.on .sheet{transform:translate(-50%,-50%);opacity:1}
  .grab{display:none}
  body.sheet-open{background:var(--bg)}
  body.sheet-open.deep .app{transform:none;filter:none;border-radius:0;overflow:visible}
  .island{top:18px}
  .ambient{height:700px}
}
@media (max-width:1023px){ .desk{display:none !important} }
@media (max-width:370px){ .rings-card{grid-template-columns:112px 1fr;gap:12px} .types{grid-template-columns:repeat(2,1fr)} .amount input{font-size:52px} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-delay:0s !important;transition-duration:.01ms !important;transition-delay:0s !important}
  .ambient i{animation:none}
}
@media (prefers-reduced-transparency:reduce){ :root{--g:1} }

/* =====================================================================
   REFINO: paleta contida, material de vidro único, luz do cursor
   ===================================================================== */
@property --hov{syntax:'<number>';inherits:false;initial-value:0}
:root{
  --g:.5;
  --label-2:rgba(60,60,67,.68); --label-3:rgba(60,60,67,.36);
  --panel:rgba(255,255,255,.76); --panel-2:rgba(255,255,255,.96);
  --panel-rim:rgba(255,255,255,.95); --panel-line:rgba(0,0,0,.055);
  --panel-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.055);
  --row-bg:#FCFCFD;
  --chip:rgba(0,0,0,.045); --chip-hover:rgba(0,0,0,.075);
  --hover-fill:rgba(0,0,0,.04);
  --glow:rgba(0,122,255,.10);
  --amb-a:rgba(0,122,255,.13); --amb-b:rgba(88,86,214,.07); --amb-c:transparent;
  --thumb:#FFFFFF; --thumb-rim:rgba(255,255,255,1);
  --ease-out:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --label-2:rgba(235,235,245,.72); --label-3:rgba(235,235,245,.40);
    --panel:rgba(46,46,50,.58); --panel-2:rgba(88,88,94,.46);
    --panel-rim:rgba(255,255,255,.10); --panel-line:rgba(255,255,255,.06);
    --panel-shadow:0 1px 2px rgba(0,0,0,.3),0 14px 36px rgba(0,0,0,.38);
    --row-bg:#1B1B1D;
    --chip:rgba(255,255,255,.07); --chip-hover:rgba(255,255,255,.12);
    --hover-fill:rgba(255,255,255,.055);
    --glow:rgba(255,255,255,.13);
    --amb-a:rgba(10,132,255,.22); --amb-b:rgba(94,92,230,.10); --amb-c:transparent;
    --thumb:rgba(255,255,255,.20); --thumb-rim:rgba(255,255,255,.28);
  }
}
:root[data-theme="dark"]{
  --label-2:rgba(235,235,245,.72); --label-3:rgba(235,235,245,.40);
  --panel:rgba(46,46,50,.58); --panel-2:rgba(88,88,94,.46);
  --panel-rim:rgba(255,255,255,.10); --panel-line:rgba(255,255,255,.06);
  --panel-shadow:0 1px 2px rgba(0,0,0,.3),0 14px 36px rgba(0,0,0,.38);
  --row-bg:#1B1B1D;
  --chip:rgba(255,255,255,.07); --chip-hover:rgba(255,255,255,.12);
  --hover-fill:rgba(255,255,255,.055);
  --glow:rgba(255,255,255,.13);
  --amb-a:rgba(10,132,255,.22); --amb-b:rgba(94,92,230,.10); --amb-c:transparent;
  --thumb:rgba(255,255,255,.20); --thumb-rim:rgba(255,255,255,.28);
}

/* fundo: uma luz só, discreta */
.ambient i:nth-child(1){width:520px;height:420px;left:-140px;top:-160px}
.ambient i:nth-child(2){width:380px;height:320px;right:-120px;top:-60px}
.ambient i:nth-child(3){display:none}

/* material único, o mesmo da barra lateral */
.group,.card,.strip,.stats,.mini,.tipkit,.type{
  background:var(--panel);
  -webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);
  box-shadow:inset 0 1px 0 var(--panel-rim),inset 0 0 0 .5px var(--panel-line),var(--panel-shadow);
}
#list .group{background:var(--row-bg);-webkit-backdrop-filter:none;backdrop-filter:none}
.sw-row{background:var(--row-bg)}
@keyframes flash{0%,30%{background:color-mix(in srgb,var(--tint) 12%,var(--row-bg))}100%{background:var(--row-bg)}}

/* tipografia com menos grito */
.sec-h b,.hist-h b{font-size:20px;font-weight:600;letter-spacing:-.018em}
.large-title{font-weight:700}
.caption,.strip span,.stats span{font-weight:500;letter-spacing:0}
.strip b,.stats b{font-weight:600;color:var(--label)}
.strip b.pos{color:var(--green-t)} .strip b.neg{color:var(--red-t)}
.head-sub{font-weight:500}

/* ícones tingidos, sem cor chapada */
.sq{background:color-mix(in srgb,var(--c,#8E8E93) 15%,transparent);color:var(--c,#8E8E93)}
.sq::after{background:none;box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--c,#8E8E93) 24%,transparent)}
:root[data-theme="dark"] .sq{background:color-mix(in srgb,var(--c,#8E8E93) 22%,transparent);color:color-mix(in srgb,var(--c,#8E8E93) 72%,#fff)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sq{background:color-mix(in srgb,var(--c,#8E8E93) 22%,transparent);color:color-mix(in srgb,var(--c,#8E8E93) 72%,#fff)}}
.sq.brand{background:linear-gradient(160deg,#48484C,#0E0E10);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.sq.brand::after{background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 50%);box-shadow:inset 0 1px .5px rgba(255,255,255,.4)}

/* seletor de categoria: neutro, só a escolhida ganha cor */
.catrow{-webkit-mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent);padding:6px 18px 6px;gap:4px}
.catbtn{width:70px;gap:7px;color:var(--label-2);font-weight:500;font-size:11.5px}
.catbtn .cc{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--label-2);
  background-image:radial-gradient(60px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--glow) calc(var(--hov) * 100%),transparent),transparent 70%);
  transition:transform .45s var(--bounce),background-color .3s ease,color .3s ease,box-shadow .35s ease}
.catbtn .cc b{font-size:17px;font-weight:600}
.catbtn{transition:--hov .3s ease,color .25s ease}
.catbtn:hover .cc{transform:translateY(-2px);background-color:var(--chip-hover);color:var(--label)}
.catbtn:active .cc{transform:scale(.9)}
.catbtn[aria-pressed="true"]{color:var(--label);font-weight:600}
.catbtn[aria-pressed="true"] .cc{background-color:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);transform:none;
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 60%,transparent),0 6px 18px color-mix(in srgb,var(--c) 22%,transparent)}
:root[data-theme="dark"] .catbtn[aria-pressed="true"] .cc{color:color-mix(in srgb,var(--c) 75%,#fff);background-color:color-mix(in srgb,var(--c) 26%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .catbtn[aria-pressed="true"] .cc{color:color-mix(in srgb,var(--c) 75%,#fff);background-color:color-mix(in srgb,var(--c) 26%,transparent)}}

/* segmentado: texto sempre legível, gota de vidro */
.seg{background:var(--chip)}
.seg .thumb{background:var(--thumb);box-shadow:inset 0 1px .5px var(--thumb-rim),0 0 0 .5px var(--panel-line),0 4px 12px rgba(0,0,0,.12)}
.seg button{color:var(--label-2);font-weight:500;transition:color .25s ease,--hov .3s ease}
.seg button:hover{color:var(--label)}
.seg button[aria-pressed="true"]{color:var(--label);font-weight:600}
.seg.danger button[aria-pressed="true"]{color:var(--label) !important}

/* chips e filtros calmos */
.cap{background:transparent;color:var(--label-2);font-weight:600;
  background-image:radial-gradient(90px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--glow) calc(var(--hov) * 100%),transparent),transparent 70%);
  transition:--hov .3s ease,background-color .25s ease,color .25s ease,box-shadow .3s ease,transform .35s var(--bounce)}
.cap:hover{background-color:var(--hover-fill);color:var(--label)}
.cap[aria-pressed="true"]{background-color:var(--panel-2);color:var(--label);box-shadow:inset 0 1px 0 var(--panel-rim),0 0 0 .5px var(--panel-line),0 2px 8px rgba(0,0,0,.08)}
.sheet .cap:not([aria-pressed="true"]){background-color:transparent}
.opt,.opt.on,.opt.warn{background-color:var(--chip);color:var(--label);font-weight:600;box-shadow:none;
  background-image:radial-gradient(120px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--glow) calc(var(--hov) * 100%),transparent),transparent 70%);
  transition:--hov .3s ease,background-color .25s ease,transform .35s var(--bounce)}
.opt:hover{background-color:var(--chip-hover)}
.opt svg{color:var(--label-2)}
.opt.on svg{color:var(--label)}
.opt.warn svg{color:var(--orange)}
.opt.warn{color:var(--orange-t)}

/* campos */
.desc{background:var(--chip);box-shadow:none;transition:box-shadow .25s ease,background-color .25s ease}
.desc:hover{background:var(--chip-hover)}
.desc:focus{background:var(--panel-2);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--tint) 55%,transparent),0 0 0 4px color-mix(in srgb,var(--tint) 12%,transparent)}
.desc::placeholder,.search input::placeholder{color:var(--label-2)}
.amount span{color:var(--label-2);font-weight:500}
.amount input{font-weight:700}
.amount input::placeholder{color:var(--label-3)}
.composer{padding:18px}
.search{background-image:radial-gradient(160px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--glow) calc(var(--hov) * 100%),transparent),transparent 70%);transition:--hov .3s ease,box-shadow .3s ease}
.search:focus-within{box-shadow:inset 0 1px .5px rgba(255,255,255,var(--spec)),0 0 0 .6px var(--edge),0 0 0 4px color-mix(in srgb,var(--tint) 14%,transparent),var(--glass-shadow)}

/* botão principal com brilho que segue o cursor */
.btn{background:radial-gradient(200px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,calc(var(--hov) * .26)),transparent 65%),linear-gradient(180deg,color-mix(in srgb,var(--tint) 88%,#fff),var(--tint));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32),0 1px 2px rgba(0,0,0,.12),0 6px 16px color-mix(in srgb,var(--tint) 26%,transparent);
  transition:--hov .3s ease,transform .4s var(--bounce),box-shadow .35s ease,filter .3s ease;font-weight:600}
.btn::after{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 50%)}
.btn:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 4px rgba(0,0,0,.12),0 12px 30px color-mix(in srgb,var(--tint) 38%,transparent)}
.btn:active{transform:scale(.97);filter:brightness(.96)}
.btn.done{background:linear-gradient(180deg,color-mix(in srgb,var(--green) 88%,#fff),var(--green));box-shadow:inset 0 1px 0 rgba(255,255,255,.32),0 6px 16px color-mix(in srgb,var(--green) 28%,transparent)}
.btn.tinted,.btn.gray,.btn.red{background-image:radial-gradient(140px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--glow) calc(var(--hov) * 100%),transparent),transparent 70%)}
.btn.tinted{background-color:var(--tint-soft)} .btn.gray{background-color:var(--chip)} .btn.red{background-color:rgba(255,59,48,.13)}
.btn.tinted:hover,.btn.gray:hover,.btn.red:hover{box-shadow:none;filter:brightness(1.04)}

/* botões de vidro e navegação */
.gbtn,.mpill button,.check,.side-nav button,.tabbar button{
  background-image:radial-gradient(90px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--glow) calc(var(--hov) * 100%),transparent),transparent 70%);
  transition:--hov .3s ease,transform .35s var(--bounce),background-color .25s ease,color .25s ease}
.gbtn:hover,.mpill button:hover{background-color:var(--hover-fill)}
.mpill{padding:0 3px}
.mpill .lb{min-width:92px}
.side-nav button:hover{background-color:var(--hover-fill)}
.side-nav button[aria-current="page"]{background-color:var(--tint);background-image:radial-gradient(160px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,calc(var(--hov) * .22)),transparent 70%),linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 14px color-mix(in srgb,var(--tint) 30%,transparent)}
.tabbar button{color:var(--label-2)}
.tabbar button[aria-current="page"]{color:var(--tint)}

/* linhas */
button.cell,.sw-row .cell{background-image:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--glow) calc(var(--hov) * 70%),transparent),transparent 70%);transition:--hov .3s ease,background-color .2s ease}
button.cell:hover,.sw-row .cell:hover{background-color:var(--hover-fill)}
.cell .chev{transition:transform .35s var(--ease-out),opacity .25s ease,color .25s ease}
@media (hover:hover){ .sw-row .cell .chev{opacity:0;transform:translateX(-4px)} .sw-row .cell:hover .chev{opacity:1;transform:none} .swipe-hint{display:none} }
.cell:hover .chev{color:var(--label-2)}
.check:hover{color:var(--green)}
.sw.st{animation:rowFade .55s var(--ease-out) both}
@keyframes rowFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sw.new{animation:rowIn .7s var(--ease-out) both}
@keyframes rowIn{from{opacity:0;transform:translateY(-8px) scale(.985)}to{opacity:1;transform:none}}

/* cartões de tipo e blocos interativos */
.type{background-image:radial-gradient(140px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--glow) calc(var(--hov) * 100%),transparent),transparent 70%);
  transition:--hov .3s ease,transform .45s var(--bounce),box-shadow .35s ease}
.type:hover{transform:translateY(-3px)}
.type[aria-pressed="true"]{box-shadow:inset 0 1px 0 var(--panel-rim),0 0 0 2px var(--tint),0 10px 26px color-mix(in srgb,var(--tint) 18%,transparent)}
.mini,.stats,.strip{transition:transform .45s var(--ease-out)}

/* vidro flutuante: brilho do toque também no hover */
.glass::after{background:radial-gradient(140% 70% at 30% -10%,rgba(255,255,255,calc(var(--spec) * .34)),transparent 58%)}
.press.pressed{transform:scale(1.035)}

/* painéis entram com mais suavidade */
.panel.on{animation:panelIn .55s var(--ease-out) both}
@keyframes panelIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.island{transition:width .6s var(--spring),opacity .3s ease,transform .6s var(--bounce)}

/* foco refinado */
:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--tint) 50%,transparent) !important}
input:focus-visible,select:focus-visible{box-shadow:none !important}

@media (min-width:1024px){
  .lanc{grid-template-columns:420px 1fr;gap:28px}
  .main{padding-top:34px}
}
:root[data-theme="dark"] .rings-card{background:var(--panel);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);box-shadow:inset 0 1px 0 var(--panel-rim),inset 0 0 0 .5px var(--panel-line),var(--panel-shadow)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rings-card{background:var(--panel);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);box-shadow:inset 0 1px 0 var(--panel-rim),inset 0 0 0 .5px var(--panel-line),var(--panel-shadow)}}
.rings-card{box-shadow:0 14px 36px rgba(0,0,0,.18)}
@media (min-width:1024px){ #rMode,#planSeg{max-width:380px} }

/* =====================================================================
   JANELAS CENTRAIS, SELETORES EM LISTA, BOTÃO VERDE, ÍCONE
   ===================================================================== */
.cell .seg{margin-bottom:0}
.brand-ic{display:block;width:40px;height:40px;border-radius:11px;box-shadow:0 6px 16px rgba(0,0,0,.28),0 1px 2px rgba(0,0,0,.2);flex:none;overflow:hidden}
.brand-ic svg{display:block}

/* fundo das janelas: escurece e desfoca */
.pop-wrap{position:fixed;inset:0;z-index:85;visibility:hidden;display:flex;align-items:center;justify-content:center;padding:18px}
.pop-wrap.on{visibility:visible}
.pop-bg,.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,0);-webkit-backdrop-filter:blur(0px);backdrop-filter:blur(0px);transition:background .45s var(--ease-out),-webkit-backdrop-filter .45s var(--ease-out),backdrop-filter .45s var(--ease-out),opacity .45s var(--ease-out);opacity:1}
.pop-wrap.on .pop-bg,.sheet-wrap.on .sheet-bg{background:rgba(0,0,0,.34);-webkit-backdrop-filter:blur(7px) saturate(120%);backdrop-filter:blur(7px) saturate(120%)}
.pop{
  position:relative;width:min(420px,100%);max-height:min(640px,calc(100vh - 60px));display:flex;flex-direction:column;border-radius:30px;overflow:hidden;
  background:color-mix(in srgb,var(--sheet-base) calc(82% + 14% * var(--g)),transparent);
  -webkit-backdrop-filter:blur(34px) saturate(190%);backdrop-filter:blur(34px) saturate(190%);
  box-shadow:inset 0 1px 0 var(--panel-rim),0 0 0 .6px var(--edge),0 30px 80px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.18);
  transform:translateY(14px) scale(.94);opacity:0;transition:transform .5s var(--spring),opacity .3s var(--ease-out)}
.pop-wrap.on .pop{transform:none;opacity:1}
.pop-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 14px 6px 22px;flex:none}
.pop-h h3{font-size:19px;font-weight:700;letter-spacing:-.02em}
.pop-h .gbtn{background-color:var(--chip)}
.pop-b{overflow-y:auto;overscroll-behavior:contain;padding:8px 14px 16px;-webkit-overflow-scrolling:touch}
.pop .group{background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:inset 0 0 0 .5px var(--panel-line)}
.pk-list{border-radius:20px}
.pk{min-height:50px}
.pk.sel .t{font-weight:600}
.pk-ck{color:var(--tint);display:grid;place-items:center}
.pk.fut .t{color:var(--label-2)}
.pk-search{background:var(--chip);border-radius:14px;height:40px;margin:0 0 12px;box-shadow:none}
.pk-search:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--tint) 22%,transparent)}
.pk-empty{text-align:center;color:var(--label-2);font-size:15px;padding:24px 0}
.pk-foot{display:block;margin:12px auto 0;font-size:15px}
.pk-month{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.pk-month b{font-size:17px;font-weight:600}
.pk-month .gbtn{background-color:var(--chip)}
.pk-quick{display:flex;gap:6px;margin:0 0 12px}
.pk-quick .cap{flex:1;background-color:var(--chip);color:var(--label);text-align:center}
.pk-quick .cap[aria-pressed="true"]{background-color:var(--tint);color:#fff;box-shadow:none}
.dayrow{--inset:66px}
.dayrow .dnum{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--chip);font-family:var(--rounded);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;transition:background-color .25s ease,color .25s ease}
.dayrow.wknd .dnum{color:var(--label-2)}
.dayrow.sel .dnum{background:var(--tint);color:#fff}
.dayrow:hover .dnum{background-color:var(--chip-hover)}
.dayrow.sel:hover .dnum{background:var(--tint)}
.pill-today{font-size:12.5px;font-weight:600;line-height:1;padding:6px 10px;border-radius:100px;background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green-t);flex:none}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mcell{position:relative;border:0;border-radius:18px;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background-color:var(--chip);color:var(--label);
  background-image:radial-gradient(90px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--glow) calc(var(--hov) * 100%),transparent),transparent 70%);
  transition:--hov .3s ease,transform .4s var(--bounce),background-color .25s ease}
.mcell b{font-size:16px;font-weight:600}
.mcell small{font-size:12px;color:var(--label-2)}
.mcell:hover{background-color:var(--chip-hover);transform:translateY(-2px)}
.mcell:active{transform:scale(.95)}
.mcell.on{background-color:var(--tint);color:#fff}
.mcell.on small{color:rgba(255,255,255,.8)}
.mdot{position:absolute;top:8px;right:10px;width:6px;height:6px;border-radius:50%;background:var(--green)}

/* seletor de categoria no formulário */
.catpick{width:100%;display:flex;align-items:center;gap:12px;border:0;border-radius:18px;padding:10px 12px 10px 12px;margin:12px 0 0;text-align:left;color:var(--label);background-color:var(--chip);
  background-image:radial-gradient(220px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--glow) calc(var(--hov) * 100%),transparent),transparent 70%);
  transition:--hov .3s ease,background-color .25s ease,transform .4s var(--bounce)}
.catpick:hover{background-color:var(--chip-hover)}
.catpick:active{transform:scale(.98)}
.catpick .sq{width:36px;height:36px;border-radius:11px}
.cp-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.cp-t small{font-size:12px;font-weight:500;color:var(--label-2)}
.cp-t b{font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-ch{color:var(--label-3);transition:transform .35s var(--ease-out),color .25s ease}
.catpick:hover .cp-ch{transform:translateX(2px);color:var(--label-2)}
.opt .dd{color:var(--label-3);margin-left:-1px}
.opt{position:relative}

/* botão de adicionar em verde, com texto legível */
.btn.green{background:radial-gradient(200px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,calc(var(--hov) * .24)),transparent 65%),linear-gradient(180deg,#3BCB66,#1F9D48);
  text-shadow:0 1px 1px rgba(0,60,20,.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34),0 1px 2px rgba(0,0,0,.14),0 6px 16px rgba(40,170,80,.28)}
.btn.green:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.42),0 2px 4px rgba(0,0,0,.14),0 12px 30px rgba(40,170,80,.42)}
.btn.green.done{background:linear-gradient(180deg,#48D873,#26AD52)}

/* folhas pequenas também no centro, com o fundo desfocado */
.sheet.small{top:50%;bottom:auto;left:50%;right:auto;width:min(440px,calc(100vw - 28px));max-height:min(640px,calc(100vh - 60px));border-radius:30px;
  transform:translate(-50%,-44%) scale(.94);opacity:0;transition:transform .5s var(--spring),opacity .3s var(--ease-out)}
.sheet-wrap.on .sheet.small{transform:translate(-50%,-50%);opacity:1}
.sheet.small .grab{display:none}
@media (min-width:1024px){
  .sheet,.sheet.small{top:50%;bottom:auto;left:50%;right:auto}
  .sheet.small{width:440px}
}

[hidden]{display:none !important}
.pop-top{flex:none;padding:6px 14px 4px;border-bottom:.5px solid var(--sep)}
.pop-top .pk-quick{margin-bottom:10px}
.pop-b{position:relative}


/* =====================================================================
   GAVETAS, DESEMPENHO E ACABAMENTO
   ===================================================================== */
/* desempenho: vidro de verdade só no que flutua */
.group,.card,.strip,.stats,.mini,.tipkit,.type{-webkit-backdrop-filter:none;backdrop-filter:none}
:root{--panel:rgba(255,255,255,.86)}
:root[data-theme="dark"]{--panel:rgba(40,40,44,.74)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(40,40,44,.74)}}
.rings-card{-webkit-backdrop-filter:none !important;backdrop-filter:none !important}
.ambient{height:640px;background:
  radial-gradient(520px 380px at 8% -6%,var(--amb-a),transparent 70%),
  radial-gradient(420px 320px at 96% 2%,var(--amb-b),transparent 70%)}
.ambient i{display:none}
section.day{content-visibility:auto;contain-intrinsic-size:auto 220px}

/* busca e seletor de mês: vidro leve, sem desfoque */
.search{background-color:var(--panel);box-shadow:inset 0 1px 0 var(--panel-rim),inset 0 0 0 .5px var(--panel-line),0 1px 2px rgba(0,0,0,.04)}
.mpill{background-color:var(--panel);box-shadow:inset 0 1px 0 var(--panel-rim),inset 0 0 0 .5px var(--panel-line),0 1px 2px rgba(0,0,0,.05)}

/* marca */
.side .brand{align-items:center;gap:11px;padding:4px 6px 20px}
.brand-t{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-t b{font-size:15px;font-weight:700;letter-spacing:-.015em}
.brand-t small{font-size:12.5px;font-weight:500;color:var(--label-2)}

/* gavetas: abrem embaixo do botão, com a altura animada */
.drawer{display:grid;grid-template-rows:0fr;opacity:0;margin:0;transition:grid-template-rows .5s var(--spring),opacity .28s var(--ease-out),margin .5s var(--spring);pointer-events:none}
.drawer.open{grid-template-rows:1fr;opacity:1;margin:10px 0 2px;pointer-events:auto}
.dr-in{overflow:hidden;min-height:0}
.dr-box{border-radius:22px;background:var(--chip);padding:10px;transform:translateY(-6px) scale(.985);transform-origin:top center;transition:transform .5s var(--spring)}
.drawer.open .dr-box{transform:none}
.drawer.in-group{margin:0}
.drawer.in-group.open{margin:0}
.drawer.in-group .dr-box{border-radius:0;background:transparent;padding:4px 12px 12px}
.dr-search{background:var(--panel-2);border-radius:14px;height:40px;margin:0 0 8px;box-shadow:inset 0 0 0 .5px var(--panel-line)}
.dr-search:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--tint) 22%,transparent)}
.dr-list{max-height:min(300px,46vh);overflow-y:auto;overscroll-behavior:contain;border-radius:16px;background:var(--panel-2);box-shadow:inset 0 0 0 .5px var(--panel-line);scrollbar-width:thin}
.dr-list .cell{min-height:46px;padding:8px 12px}
.dr-list .cell+.cell::before{left:52px}
.dr-list .dayrow{--inset:60px}
.dr-list .dayrow+.dayrow::before{left:60px}
.dr-foot{display:block;margin:8px auto 0;font-size:15px}
.drawer .pk-month{margin:2px 0 8px}
.drawer .pk-month .gbtn{background-color:var(--panel-2);width:36px;height:36px}
.drawer .pk-quick .cap{background-color:var(--panel-2)}
.drawer .pk-quick .cap[aria-pressed="true"]{background-color:var(--tint);color:#fff}
.dr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mchip{border:0;border-radius:16px;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:13.5px;font-weight:600;color:var(--label);background-color:var(--panel-2);box-shadow:inset 0 0 0 .5px var(--panel-line);
  background-image:radial-gradient(90px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--glow) calc(var(--hov) * 100%),transparent),transparent 70%);
  transition:--hov .3s ease,transform .4s var(--bounce),background-color .25s ease,color .25s ease,box-shadow .3s ease}
.mchip svg{color:var(--label-2)}
.mchip:hover{transform:translateY(-2px)}
.mchip:active{transform:scale(.95)}
.mchip.sel{background-color:var(--tint-soft);color:var(--tint);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--tint) 55%,transparent)}
.mchip.sel svg{color:var(--tint)}
/* botão que abriu a gaveta fica marcado e a setinha vira */
.opt[aria-expanded="true"],.catpick[aria-expanded="true"]{background-color:var(--tint-soft);color:var(--tint)}
.opt[aria-expanded="true"] svg,.opt[aria-expanded="true"] .dd{color:var(--tint)}
.opt .dd,.cp-ch svg,.drow .chev svg{transition:transform .4s var(--spring)}
.opt[aria-expanded="true"] .dd{transform:rotate(180deg)}
.cp-ch svg{transform:rotate(90deg)}
.catpick[aria-expanded="true"] .cp-ch svg{transform:rotate(-90deg)}
.catpick[aria-expanded="true"] .cp-t small{color:color-mix(in srgb,var(--tint) 70%,transparent)}
.drow[aria-expanded="true"] .v{color:var(--tint)}
.drow[aria-expanded="true"] .chev svg{transform:rotate(90deg)}
.drow .chev svg{transform:none}
.dr-list{position:relative}
@media (min-width:1024px){ .lanc .composer:has(.drawer.open){position:relative;top:auto} }


/* =====================================================================
   FOLHA, BARRAS DE ROLAGEM, BARRA LATERAL E LEGENDAS
   ===================================================================== */
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-button{display:none;width:0;height:0}
::-webkit-scrollbar-thumb{background-color:color-mix(in srgb,var(--label) 22%,transparent);border-radius:12px;border:4px solid transparent;background-clip:content-box;min-height:40px}
::-webkit-scrollbar-thumb:hover{background-color:color-mix(in srgb,var(--label) 38%,transparent)}
::-webkit-scrollbar-corner{background:transparent}
@supports not selector(::-webkit-scrollbar){ *{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--label) 26%,transparent) transparent} }
.dr-list{scrollbar-width:auto}
.sheet,.pop{overflow:hidden}
.sh-body{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:1024px){
  .sheet{max-height:calc(100vh - 40px)}
  .sheet .amount{padding:2px 0 10px}
  .sheet .amount input{font-size:50px !important}
  .sheet .sec-h{margin-top:16px}
}
.group>.drawer+.cell::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);height:1px;background:var(--sep);transform:scaleY(.5);transform-origin:0 0}
.group>.drawer.open+.cell::before{left:0}
.drawer.in-group.open{border-top:.5px solid var(--sep)}

.side-nav{position:relative}
.side-nav .side-sel{position:absolute;left:0;right:0;top:0;height:var(--sh,38px);transform:translateY(var(--sy,0px));border-radius:13px;z-index:0;
  background:linear-gradient(180deg,color-mix(in srgb,var(--tint) 90%,#fff),var(--tint));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 14px color-mix(in srgb,var(--tint) 28%,transparent)}
.side-nav.ready .side-sel{transition:transform .55s var(--spring),height .3s var(--ease-out)}
.side-nav button,.side-nav button[aria-current="page"]{position:relative;z-index:1;background-color:transparent;background-image:none;box-shadow:none;transition:background-color .2s ease,color .25s ease}
.side-nav button svg{transition:transform .35s var(--bounce),color .25s ease}
.side-nav button:not([aria-current="page"]):hover{background-color:var(--hover-fill)}
.side-nav button:not([aria-current="page"]):hover svg{transform:scale(1.08)}
.side-nav button[aria-current="page"]{color:#fff}
.side-nav button:active{transform:none}
.side-tg{margin-left:auto;flex:none;width:32px;height:32px;border:0;border-radius:10px;background:transparent;color:var(--label-2);display:grid;place-items:center;transition:background-color .2s ease,color .2s ease}
.side-tg:hover{background-color:var(--hover-fill);color:var(--label)}
.side-open{display:none}
@media (min-width:1024px){
  .app{grid-template-columns:270px minmax(0,1fr)}
  body.side-anim .app{transition:grid-template-columns .6s var(--spring)}
  .side{width:260px;will-change:transform}
  body.side-anim .side{transition:transform .6s var(--spring),opacity .4s var(--ease-out)}
  body.side-closed .app{grid-template-columns:0px minmax(0,1fr)}
  body.side-closed .side{transform:translateX(calc(-100% - 24px));opacity:0;pointer-events:none}
  .side-open{display:grid;place-items:center;position:fixed;top:30px;left:22px;z-index:30;width:44px;height:44px;border-radius:50%;border:0;color:var(--label);
    opacity:0;transform:translateX(-14px) scale(.88);pointer-events:none;transition:opacity .3s var(--ease-out),transform .55s var(--spring)}
  body.side-closed .side-open{opacity:1;transform:none;pointer-events:auto;transition-delay:.15s}
  .side-open:hover{transform:scale(1.06)}
  body.side-anim .main{transition:padding .6s var(--spring)}
  body.side-closed .main{padding-left:96px}
}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--label-2);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px}
.legend i.dash{width:14px;height:0;border-top:2px dashed var(--orange);border-radius:0}
.side .brand{gap:10px;padding:4px 4px 20px 6px}
.brand-t b{font-size:14px;white-space:nowrap;letter-spacing:-.02em}
.brand-t small{font-size:12px;white-space:nowrap}
@media (min-width:1024px){ .main{margin-left:auto;margin-right:auto} }

.cap-x{display:inline-flex;align-items:center;gap:6px;background-color:var(--tint-soft) !important;color:var(--tint) !important;box-shadow:none !important}
.cap-x span{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:color-mix(in srgb,var(--tint) 18%,transparent)}
button.cell.icon-row .chev{margin-left:-4px}
.r-hist-h{scroll-margin-top:70px}


/* =====================================================================
   RITMO DAS ANIMAÇÕES: rápidas, suaves e só com transform e opacidade
   ===================================================================== */
:root{--ease-out:cubic-bezier(.22,1,.36,1);--ease-io:cubic-bezier(.65,0,.35,1);--pop-ease:cubic-bezier(.34,1.32,.64,1)}
body{transition:background .35s var(--ease-out)}
.panel.on{animation:panelIn .34s var(--ease-out) both}
@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.seg .thumb{transition:transform .34s var(--ease-out),scale .16s var(--ease-out);will-change:transform}
.tabbar .lens{transition:transform .38s var(--ease-out),scale .16s var(--ease-out);will-change:transform}
.side-nav.ready .side-sel{transition:transform .4s var(--ease-out),height .25s var(--ease-out)}

/* folhas e janelas: o fundo escurece por opacidade, o desfoque fica parado (animar desfoque engasga) */
.pop-bg,.sheet-bg{background:rgba(0,0,0,.34);-webkit-backdrop-filter:blur(7px) saturate(120%);backdrop-filter:blur(7px) saturate(120%);opacity:0;transition:opacity .28s var(--ease-out)}
.pop-wrap.on .pop-bg,.sheet-wrap.on .sheet-bg{opacity:1}
.sheet{transition:transform .42s cubic-bezier(.32,.72,0,1);will-change:transform}
.pop{transition:transform .32s var(--pop-ease),opacity .18s var(--ease-out)}
.sheet.small{transition:transform .32s var(--pop-ease),opacity .18s var(--ease-out)}
body.sheet-open.deep .app{transform:scale(.96);filter:none}
.app{transition:transform .42s cubic-bezier(.32,.72,0,1),border-radius .42s var(--ease-out)}
body.sheet-open .app{will-change:transform}
body.sheet-open.deep .navbar,body.sheet-open.deep .tabbar{filter:none}
body.sheet-open.deep .tabbar{transform:translateY(8px) scale(.96)}

/* gavetas mais ágeis */
.drawer{transition:grid-template-rows .34s var(--ease-out),opacity .2s var(--ease-out),margin .34s var(--ease-out)}
.dr-box{transition:transform .34s var(--ease-out)}

/* aviso no topo */
.island{transition:width .4s var(--ease-out),opacity .18s var(--ease-out),transform .42s var(--pop-ease)}
.island .in{transition:opacity .18s ease .1s}

/* conteúdo que entra */
.rings circle,.mring circle{transition:stroke-dashoffset .85s var(--ease-out)}
.bar i{transition:width .6s var(--ease-out)}
.stor i{transition:flex-grow .6s var(--ease-out)}
.sw.st{animation:rowFade .36s var(--ease-out) both}
@keyframes rowFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sw.new{animation:rowIn .45s var(--ease-out) both}
@keyframes rowIn{from{opacity:0;transform:translateY(-6px) scale(.99)}to{opacity:1;transform:none}}
.sw.leaving{animation:rowOut .3s var(--ease-out) forwards}
@keyframes rowOut{to{opacity:0;transform:translateX(-24px)}}
.sw-row{transition:transform .36s var(--ease-out)}

/* toques e botões: resposta imediata, retorno com mola curta */
.btn{transition:--hov .25s ease,transform .28s var(--pop-ease),box-shadow .3s ease,filter .2s ease}
.btn:active,.opt:active,.cap:active,.catpick:active,.mchip:active,.type:active,.mcell:active{transition-duration:.08s}
.switch span::after{transition:transform .34s var(--pop-ease),width .22s var(--ease-out),background .2s ease}
.opt,.cap,.mchip,.catpick,.type,.mcell,.catbtn .cc{transition-duration:.25s}

/* barra lateral: só transform e opacidade */
@media (min-width:1024px){
  body.side-anim .app,body.side-anim .main{transition:none}
  body.side-anim .side{transition:transform .42s var(--ease-out),opacity .28s var(--ease-out)}
  .side-open{transition:opacity .22s var(--ease-out),transform .4s var(--pop-ease)}
  body.side-closed .side-open{transition-delay:.1s}
}

/* =====================================================================
   COMPUTADOR: tela mais aproveitada, sem encostar nas bordas
   ===================================================================== */
@media (min-width:1024px){
  .main{max-width:1440px;padding:30px 48px 64px}
  body.side-closed .main{padding-left:104px}
  .lanc{grid-template-columns:440px minmax(0,1fr);gap:32px}
  .calc{grid-template-columns:minmax(0,1fr) 420px;gap:24px}
  .cols{gap:18px}
}
@media (min-width:1680px){ .main{padding-left:64px;padding-right:64px} .lanc{grid-template-columns:460px minmax(0,1fr)} }

/* =====================================================================
   CELULAR: mais compacto, alvos maiores, barra acima do teclado
   ===================================================================== */
.kbbar{display:none}
@media (max-width:1023px){
  .main{padding-left:14px;padding-right:14px}
  .head{padding:4px 4px 12px}
  .large-title{font-size:32px}
  .composer{padding:14px;border-radius:28px}
  .amount{padding:2px 0 8px}
  .amount input{font-size:56px}
  .opt{height:44px;font-size:15.5px}
  .cap{padding:9px 15px}
  .catpick{padding:9px 12px}
  .hist-h{margin:22px 4px 10px}
  .dr-list{max-height:min(320px,42vh)}
  .tabbar{transition:transform .3s var(--ease-out),opacity .2s var(--ease-out)}
  body.kb-open .tabbar{transform:translateY(calc(100% + 30px));opacity:0;pointer-events:none}
  .kbbar{display:flex;align-items:center;gap:12px;position:fixed;left:10px;right:10px;bottom:calc(var(--kb,0px) + 8px);z-index:45;
    padding:7px 7px 7px 16px;border-radius:26px;opacity:0;transform:translateY(14px);pointer-events:none;
    transition:opacity .18s var(--ease-out),transform .3s var(--ease-out),bottom .12s linear}
  body.kb-open .kbbar{opacity:1;transform:none;pointer-events:auto}
  .kb-sum{flex:1;min-width:0;line-height:1.2}
  .kb-sum b{display:block;font-family:var(--rounded);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
  .kb-sum small{display:block;font-size:12.5px;color:var(--label-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kbbar .btn{height:44px;padding:0 18px;font-size:16px;flex:none}
  .island{top:calc(env(safe-area-inset-top,0px) + 8px)}
}
@media (hover:none){ .btn:hover,.type:hover,.mchip:hover,.mcell:hover,.catbtn:hover .cc{transform:none} }
@media (max-width:1023px){ .kbbar{background:color-mix(in srgb,var(--sheet-base) 92%,transparent);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%)} }


/* =====================================================================
   CABEÇALHO: pílula do dia, olho e ajustes
   ===================================================================== */
.head{align-items:flex-start}
.head-l{min-width:0}
.head-tools{display:flex;align-items:center;gap:8px;margin-top:8px;flex:none}
.hbtn{width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;color:var(--label);background-color:var(--panel);
  box-shadow:inset 0 1px 0 var(--panel-rim),inset 0 0 0 .5px var(--panel-line),0 1px 2px rgba(0,0,0,.05);
  background-image:radial-gradient(60px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--glow) calc(var(--hov) * 100%),transparent),transparent 70%);
  transition:--hov .25s ease,transform .28s var(--pop-ease),color .2s ease}
.hbtn:active{transform:scale(.9);transition-duration:.08s}
.hbtn[aria-pressed="true"],.hbtn[aria-current="page"]{color:var(--tint)}
.hbtn.mob{display:none}
.bpill{height:40px;border-radius:100px;border:0;display:inline-flex;align-items:center;gap:8px;padding:0 14px 0 9px;color:var(--label);background-color:var(--panel);
  box-shadow:inset 0 1px 0 var(--panel-rim),inset 0 0 0 .5px var(--panel-line),0 1px 2px rgba(0,0,0,.05);
  background-image:radial-gradient(80px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--glow) calc(var(--hov) * 100%),transparent),transparent 70%);
  transition:--hov .25s ease,transform .28s var(--pop-ease);animation:bpIn .35s var(--ease-out) both}
.bpill:active{transform:scale(.95);transition-duration:.08s}
@keyframes bpIn{from{opacity:0;transform:translateY(-4px) scale(.96)}to{opacity:1;transform:none}}
.bpill svg{color:var(--label)}
.bp-t{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05}
.bp-t small{font-size:11px;font-weight:600;color:var(--label-2);letter-spacing:.01em}
.bp-t b{font-family:var(--rounded);font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bpill.warn .bp-t b{color:var(--orange-t)}
.bpill.over .bp-t b{color:var(--red-t)}
.bp-hero{text-align:center;padding:4px 0 16px}
.bp-big{font-family:var(--rounded);font-size:40px;font-weight:700;letter-spacing:-.02em;color:var(--green-t);font-variant-numeric:tabular-nums}
.bp-big.over{color:var(--red-t)}
.bp-cap{font-size:14px;color:var(--label-2);margin-top:2px}
@media (max-width:1023px){
  .hbtn.mob{display:grid}
  .head-tools{margin-top:6px;gap:6px}
  .hbtn{width:38px;height:38px}
  .bpill{height:38px;padding:0 12px 0 8px}
}

/* barra de abas com quatro itens no celular */
.tabbar{grid-template-columns:repeat(4,1fr)}
.tabbar .lens{width:calc((100% - 8px)/4)}
.tabbar.no-sel .lens{opacity:0;transition:opacity .2s ease}

/* sugestões embaixo da descrição */
.sugs{display:none;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;margin:8px 0 0;padding:1px 0 2px;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent)}
.sugs::-webkit-scrollbar{display:none}
.sugs.on{display:flex;animation:sugIn .25s var(--ease-out) both}
@keyframes sugIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.sug-l{flex:none;font-size:12px;font-weight:600;color:var(--label-3);padding:0 2px 0 4px}
.sug{flex:none;border:0;height:34px;border-radius:100px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--label);white-space:nowrap;
  background-color:var(--panel-2);box-shadow:inset 0 0 0 .5px var(--panel-line);
  background-image:radial-gradient(70px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--glow) calc(var(--hov) * 100%),transparent),transparent 70%);
  transition:--hov .25s ease,transform .25s var(--pop-ease)}
.sug small{font-size:12.5px;font-weight:500;color:var(--label-2)}
.sug:active{transform:scale(.94);transition-duration:.08s}
.composer .catpick{margin-top:10px}

/* cartão da semana */
.wcard{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border-radius:22px;padding:14px 10px 12px 16px;margin:0 0 6px;
  box-shadow:inset 0 1px 0 var(--panel-rim),inset 0 0 0 .5px var(--panel-line),var(--panel-shadow);animation:bpIn .35s var(--ease-out) both}
.wcard .wc-i{color:var(--tint);margin-top:1px}
.wcard b{font-size:15px;font-weight:600}
.wcard .wc-s{display:block;font-size:12.5px;color:var(--label-2);margin-top:1px}
.wcard p{margin:6px 0 4px;font-size:14.5px;color:var(--label-2);line-height:1.4}
.wcard p b{font-size:14.5px;color:var(--label)}
.wcard .gbtn{width:32px;height:32px;background-color:var(--chip);flex:none}
@media (min-width:1024px){ #weekCard .wcard{margin-bottom:0} }

/* modo discreto */
.amt,.strip b,.stats b,.hero-num,.mi-v,.rl-val,.kv b,.pv,.ps b,.day-h span:last-child,.bp-v,.goal-n,.wc-v,.bp-big,.kb-sum b,.sug small,#plan .s,.mring+.grow .s{transition:filter .22s var(--ease-out)}
body.private .amt,body.private .strip b,body.private .stats b,body.private .hero-num,body.private .mi-v,body.private .rl-val,body.private .kv b,body.private .pv,body.private .ps b,
body.private .day-h span:last-child,body.private .bp-v,body.private .goal-n,body.private .wc-v,body.private .bp-big,body.private .sug small,body.private #plan .s,body.private .kb-sum b{filter:blur(7px);-webkit-user-select:none;user-select:none}
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:center}
.head-l{display:contents}
.head .large-title{grid-column:1;grid-row:1;min-width:0}
.head .head-sub{grid-column:1 / -1;grid-row:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sw .amt.out{color:var(--red-t)}


/* =====================================================================
   REVISÃO MOBILE
