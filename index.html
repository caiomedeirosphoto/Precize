   ===================================================================== */
/* anéis: legenda em linhas, ocupa a largura toda */
.rings-card{grid-template-columns:auto minmax(0,1fr)}
.rings-card .rc-t{margin-bottom:-4px;color:rgba(255,255,255,.62)}
.ring-legend{gap:0}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:.5px solid rgba(255,255,255,.12)}
.rrow:first-child{padding-top:2px}
.rrow:last-child{border-bottom:0;padding-bottom:2px}
.rr-l{display:flex;align-items:flex-start;gap:9px;min-width:0}
.rr-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none}
.rrow .rl-lab{font-size:14px;font-weight:600;color:#fff}
.rr-sub{font-size:12.5px;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .rl-val{font-size:21px;flex:none;text-align:right}
.rrow .rl-val small{font-size:14px;margin-left:1px}
@media (max-width:420px){ .rings-card{gap:14px;padding:16px} .rrow .rl-val{font-size:19px} .rr-sub{font-size:12px} }

/* barra do preço: vidro com um véu leve atrás dos textos */
.price{background-image:linear-gradient(180deg,rgba(0,0,0,.40),rgba(0,0,0,.30))}
.price .pv,.price .ps{text-shadow:0 1px 10px rgba(0,0,0,.28)}
:root[data-theme="light"] .price{background-image:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.38))}
@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]) .price{background-image:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.38))} }
:root[data-theme="light"] .price .pv,:root[data-theme="light"] .price .ps{text-shadow:none}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .price{background-image:linear-gradient(180deg,rgba(0,0,0,.40),rgba(0,0,0,.30))} :root:not([data-theme="light"]) .price .pv,:root:not([data-theme="light"]) .price .ps{text-shadow:0 1px 10px rgba(0,0,0,.28)} }
@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]) .price .pv,:root:not([data-theme="dark"]) .price .ps{text-shadow:none} }

/* controle deslizante mais leve: sem desfoque no arrasto, só forma e sombra */
.gsl input{pointer-events:none}
.gsl{cursor:pointer;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.gsl .th{will-change:left,transform;transition:transform .22s cubic-bezier(.34,1.4,.64,1),background-color .18s ease,box-shadow .18s ease}
.gsl.drag .th{transform:scale(1.35,1.28);background:rgba(255,255,255,.92);-webkit-backdrop-filter:none;backdrop-filter:none;
  box-shadow:inset 0 1px .5px #fff,0 0 0 .5px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.18)}
.gsl .fi{will-change:width}

/* botão de limite no estilo dos botões de cápsula do iOS */
.capbtn{flex:none;display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 13px;border:0;border-radius:100px;font-size:14.5px;font-weight:600;
  color:var(--tint);background-color:var(--tint-soft);
  background-image:radial-gradient(60px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--glow) calc(var(--hov) * 100%),transparent),transparent 70%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18);transition:--hov .25s ease,transform .25s var(--pop-ease),filter .2s ease}
.capbtn:active{transform:scale(.93);transition-duration:.08s;filter:brightness(.95)}
.capbtn.val{color:var(--label);background-color:var(--chip);padding:0 10px 0 13px}
.capbtn.val svg{color:var(--label-3)}
.lim-row{align-items:center;min-height:62px}
.lim-row .grow{min-width:0}
.lim-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}
.lim-top .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lim-row .bar{height:6px;margin:0}
.lim-sub{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-size:13px;color:var(--label-2);font-variant-numeric:tabular-nums}
.lim-sub .warn{color:var(--orange-t);font-weight:600}
.lim-sub .neg{color:var(--red-t);font-weight:600}
/* editor do limite */
.lim-ic{margin:6px auto 4px;display:grid}
.lim-amt{padding:6px 0 4px}
.lim-info{text-align:center;font-size:14px;color:var(--label-2);line-height:1.5}
.lim-info b{color:var(--label);font-weight:600}
.lim-sugs{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:14px}
.lim-sugs .sug{height:36px;padding:0 16px;font-size:15px}
body.private .lim-sub,body.private .capbtn.val,body.private .lim-info b,body.private .rr-sub,body.private .rl-val{filter:blur(7px)}

.unitwrap{display:inline-flex;align-items:baseline;gap:4px;justify-content:flex-end}
.unitwrap .unit{font-size:15px;color:var(--label-3);font-weight:500}
.unitwrap .inl{text-align:right}


/* =====================================================================
   LOGIN (app instalado)
   ===================================================================== */
.login{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 22px calc(env(safe-area-inset-bottom,0px) + 24px);
  background:radial-gradient(520px 380px at 12% -8%,var(--amb-a),transparent 70%),radial-gradient(420px 320px at 96% 4%,var(--amb-b),transparent 70%),var(--bg);
  opacity:0;transition:opacity .3s var(--ease-out);overflow-y:auto}
.login.on{opacity:1}
body.login-open{overflow:hidden}
body.login-open .tabbar,body.login-open .kbbar{display:none}
.lg-wrap{width:min(380px,100%);text-align:center;transform:translateY(12px) scale(.98);transition:transform .45s var(--ease-out)}
.login.on .lg-wrap{transform:none}
.lg-ic{display:inline-block;width:84px;height:84px;border-radius:22px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.28),0 2px 6px rgba(0,0,0,.18)}
.lg-ic svg{display:block}
.lg-t{font-size:28px;font-weight:800;letter-spacing:-.025em;margin-top:18px}
.lg-s{font-size:17px;color:var(--label-2);margin:2px 0 26px}
.lg-wrap .seg{margin-bottom:14px}
.lg-fields{text-align:left;margin-bottom:14px}
.lg-fields .cell{min-height:52px}
.lg-fields input{width:100%;border:0;background:transparent;font:inherit;font-size:17px;color:var(--label);outline:none}
.lg-fields input::placeholder{color:var(--label-3)}
#lgGo{height:52px;font-size:17px}
#lgGo:disabled{opacity:.6}
.lg-forgot{display:block;margin:14px auto 0;font-size:15px}
.lg-err{min-height:20px;margin-top:14px;font-size:14.5px;color:var(--red-t);line-height:1.4}
.lg-foot{margin-top:18px;font-size:13px;color:var(--label-3);line-height:1.45}
.acct{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}


/* =====================================================================
   TOPO NO iPHONE, MARCA, VOLTAR E FLUIDEZ
   ===================================================================== */
/* o fundo vai até atrás do relógio: o espaço do topo sai da página e vai para o conteúdo */
:root{padding-top:0;padding-bottom:0}
.main{padding-top:calc(44px + env(safe-area-inset-top,0px));padding-bottom:calc(128px + env(safe-area-inset-bottom,0px))}
@media (max-width:1023px){ .main{padding-top:calc(6px + env(safe-area-inset-top,0px))} }
/* borda de cima: o que passa atrás do relógio fica desfocado, como nos apps do iOS */
.edge-top{position:fixed;left:0;right:0;top:0;height:calc(env(safe-area-inset-top,0px) + 14px);z-index:39;pointer-events:none;
  background:linear-gradient(color-mix(in srgb,var(--bg) 55%,transparent),transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  -webkit-mask:linear-gradient(#000 60%,transparent);mask:linear-gradient(#000 60%,transparent);transition:opacity .25s ease}
body.scrolled .edge-top{opacity:0}
@media (min-width:1024px){ .edge-top{display:none} }
/* no tema claro, com o app instalado, o relógio fica branco: um véu suave garante leitura */
@media (display-mode:standalone) and (prefers-color-scheme:light){ :root:not([data-theme="dark"]) .edge-top{background:linear-gradient(rgba(0,0,0,.22),transparent)} }
@media (display-mode:standalone){ :root[data-theme="light"] .edge-top{background:linear-gradient(rgba(0,0,0,.22),transparent)} }

/* marca acima do título (celular) */
.head{grid-template-rows:auto auto auto}
.brandrow,.hback{grid-column:1 / -1;grid-row:1}
.head .large-title{grid-row:2}
.head-tools{grid-row:2}
.head .head-sub{grid-row:3}
.brandrow{display:flex;align-items:center;gap:9px;min-height:36px;margin:0 0 4px}
.br-ic{display:block;width:28px;height:28px;border-radius:8px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.22);flex:none}
.br-ic svg{display:block}
.br-t{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--label)}
.brandrow[hidden],.hback[hidden],.nb-back[hidden]{display:none !important}
@media (min-width:1024px){ .brandrow,.hback{display:none !important} }
/* voltar no estilo do iOS */
.hback,.nb-back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--tint);font:inherit;font-size:17px;font-weight:400;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hback{justify-self:start;min-height:36px;margin:0 0 4px -4px;padding:0 10px 0 4px;border-radius:10px;transition:opacity .15s ease}
.hback:active,.nb-back:active{opacity:.45}
.nb-back{position:absolute;left:8px;bottom:0;height:46px;padding:0 10px 0 6px;opacity:0;transition:opacity .2s ease;z-index:2}
.navbar.scrolled .nb-back{opacity:1}

/* toque sem atraso e sem zoom por duplo toque */
button,a,label,input,select,textarea,.cell,.opt,.cap,.catpick,.mchip,.sug{touch-action:manipulation}
.gsl{touch-action:pan-y}
/* camadas de composição só enquanto precisa */
.gsl .th{will-change:auto}
.gsl.drag .th{will-change:left,transform}

/* quem preferir menos transparência (ou aparelho que sofre) ganha fundos sólidos, mais leves de desenhar */
@media (prefers-reduced-transparency:reduce){
  .glass,.tabbar,.navbar::before,.edge-top,.kbbar,.pop,.sheet,.pop-bg,.sheet-bg{-webkit-backdrop-filter:none !important;backdrop-filter:none !important}
  .glass,.tabbar,.kbbar{background:var(--card) !important}
}
html.lite .glass,html.lite .tabbar,html.lite .kbbar,html.lite .pop,html.lite .sheet{-webkit-backdrop-filter:blur(10px) saturate(150%) !important;backdrop-filter:blur(10px) saturate(150%) !important}
html.lite .navbar::before,html.lite .edge-top{-webkit-backdrop-filter:blur(8px) !important;backdrop-filter:blur(8px) !important}
html.lite .pop-bg,html.lite .sheet-bg{-webkit-backdrop-filter:none !important;backdrop-filter:none !important;background:rgba(0,0,0,.42)}
/* a barra compacta só recebe toque quando está visível */
.navbar{pointer-events:none}
.nb-back{pointer-events:none}
.navbar.scrolled .nb-back{pointer-events:auto}


/* =====================================================================
   MONTSERRAT, MENUS FLUIDOS E CONTA
   ===================================================================== */
input,textarea,select,button{font-family:inherit}

/* folhas: sem encolher o app por trás (redesenhar todo o vidro a cada quadro pesava no iPhone) */
body.sheet-open.deep .app,body.sheet-open.deep .tabbar{transform:none !important;filter:none !important;border-radius:0 !important}
.app{transition:none}

/* gavetas antigas ficam desligadas: agora os seletores abrem em menus flutuantes */
.drawer{display:none !important}

/* menu flutuante que nasce do botão */
.fm-scrim{position:fixed;inset:0;z-index:88;display:none;-webkit-tap-highlight-color:transparent}
.fm-scrim.on{display:block}
.fmenu{position:fixed;z-index:89;left:0;top:0;display:flex;flex-direction:column;border-radius:24px;overflow:hidden;
  background:color-mix(in srgb,var(--card) 92%,transparent);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  box-shadow:0 22px 60px rgba(0,0,0,.30),0 4px 14px rgba(0,0,0,.12),inset 0 0 0 .5px var(--sep);
  opacity:0;transform:scale(.86);visibility:hidden;pointer-events:none;
  transition:opacity .16s ease,transform .22s cubic-bezier(.4,0,.6,1),visibility 0s linear .22s}
.fmenu.on{opacity:1;transform:none;visibility:visible;pointer-events:auto;will-change:transform,opacity;
  transition:opacity .18s ease,transform .38s cubic-bezier(.25,1.25,.4,1),visibility 0s}
.fmenu .dr-box{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:transparent;border-radius:0;padding:10px;transform:none;transition:none}
.fmenu .dr-list{flex:1 1 auto;min-height:0;max-height:none;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:transparent;box-shadow:none;border-radius:14px}
.fmenu .dr-list .cell{min-height:48px}
.fmenu .dr-search{flex:none;background:var(--chip)}
.fmenu .pk-month,.fmenu .pk-quick,.fmenu .dr-foot,.fmenu .pk-empty{flex:none}
.fmenu .fm-met{padding:12px}
.fmenu .dr-grid{grid-template-columns:repeat(3,1fr)}
@media (prefers-reduced-motion:reduce){ .fmenu,.fmenu.on{transition:opacity .12s ease;transform:none} }
html.lite .fmenu{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--card)}

/* avatar */
.av{position:relative;display:inline-grid;place-items:center;width:var(--s);height:var(--s);border-radius:50%;overflow:hidden;flex:none;
  background:linear-gradient(145deg,#2FD889,#0A8F55);color:#fff;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av b{font-size:calc(var(--s) * .4);font-weight:700;letter-spacing:-.02em;line-height:1}
.av-e svg{opacity:.95}
.hbtn.me{padding:0;overflow:visible;background:none;box-shadow:none}
.hbtn.me .av{box-shadow:0 2px 8px rgba(0,0,0,.18),inset 0 0 0 .5px rgba(255,255,255,.2)}
.hbtn.me:active .av{transform:scale(.92)}
.hbtn.me .av{transition:transform .2s var(--pop-ease)}
.hbtn.me[hidden]{display:none}
/* perfil no rodapé da barra lateral (computador) */
.side-me{display:none}
@media (min-width:1024px){
  .side-me{display:flex;align-items:center;gap:10px;width:calc(100% - 20px);margin:auto 10px 6px;padding:8px 10px;border:0;border-radius:16px;background:transparent;color:var(--label);font:inherit;text-align:left;cursor:pointer;transition:background-color .2s ease}
  .side-me:hover,.side-me.on{background:var(--chip)}
  .side-me .sm-t{flex:1;min-width:0;display:flex;flex-direction:column}
  .side-me b{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side-me small{font-size:12.5px;color:var(--label-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side-me svg{color:var(--label-3);flex:none}
  .hbtn.me{display:none}
}

/* página da conta */
.me-head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 0 8px}
.me-av{position:relative;border:0;background:none;padding:0;cursor:pointer;border-radius:50%}
.me-av .av{box-shadow:0 10px 30px rgba(0,0,0,.20)}
.me-av:active .av{transform:scale(.96)}
.me-av .av{transition:transform .25s var(--pop-ease)}
.me-cam{position:absolute;right:0;bottom:2px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:#fff;box-shadow:0 0 0 3px var(--bg),0 4px 10px rgba(0,0,0,.2)}
.me-name{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:14px}
.me-add{margin-top:14px;border:0;background:none;color:var(--tint);font:inherit;font-size:19px;font-weight:600;cursor:pointer}
.me-mail{font-size:15px;color:var(--label-2);margin-top:3px}
.me-ok,.me-warn{display:inline-flex;align-items:center;gap:6px;margin-top:10px;height:28px;padding:0 12px;border-radius:100px;font:inherit;font-size:13px;font-weight:600;border:0}
.me-ok{color:var(--green-t);background:color-mix(in srgb,var(--green) 14%,transparent)}
.me-warn{color:var(--orange-t);background:color-mix(in srgb,var(--orange) 16%,transparent);cursor:pointer}
.me-foot{text-align:center;font-size:12.5px;color:var(--label-3);margin:26px 0 8px;line-height:1.5}
.v.acct{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v.sub{font-size:14px}
.me-prev{display:flex;justify-content:center;margin:6px 0 18px}
.sh-p{font-size:15px;color:var(--label-2);line-height:1.45;margin:2px 4px 14px}
.sh-p b{color:var(--label)}
.sh-note{font-size:13px;color:var(--label-3);line-height:1.45;margin:10px 4px 0}
.sh-err{min-height:18px;font-size:14px;color:var(--red-t);margin:10px 4px 0;line-height:1.4}
.sh-ic{display:flex;justify-content:center;margin:4px 0 12px}
.sheet .group input[type=email],.sheet .group input[type=password],.sheet .group input[type=text]{width:100%;border:0;background:transparent;font:inherit;font-size:17px;color:var(--label);outline:none}
body.private .me-mail,body.private .v.acct{filter:none}
/* recorte da foto */
.crop{display:flex;flex-direction:column;align-items:stretch;gap:14px;padding:4px 2px}
.crop-stage{position:relative;width:min(260px,70vw);aspect-ratio:1;margin:0 auto;border-radius:50%;overflow:hidden;background:var(--chip);touch-action:none;cursor:grab;
  box-shadow:0 0 0 4px color-mix(in srgb,var(--tint) 30%,transparent),0 14px 40px rgba(0,0,0,.25)}
.crop-stage:active{cursor:grabbing}
.crop-img{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;max-width:none;pointer-events:none}

.cell.two .t{display:flex;flex-direction:column;gap:1px}
.cell.two .t small{font-size:13px;color:var(--label-2);font-weight:400}
.cell.two{min-height:58px}


/* =====================================================================
   MEU PERFIL, BARRA LATERAL E RECORTE DE FOTO
   ===================================================================== */
/* perfil fixo no rodapé da barra lateral */
@media (min-width:1024px){
  .side-me{margin:auto 0 0;width:100%}
  .side-me + .side-foot{margin-top:10px}
}
.me-head .av{box-shadow:0 10px 30px rgba(0,0,0,.20)}
.me-head{padding:4px 0 6px}

/* recorte em tela cheia, quadrado 1:1 (como no WhatsApp e no iOS) */
body.cr-open{overflow:hidden}
.cropper{position:fixed;inset:0;z-index:96;display:flex;flex-direction:column;background:#000;color:#fff;opacity:0;transition:opacity .22s ease;touch-action:none;-webkit-user-select:none;user-select:none}
.cropper.on{opacity:1}
.cr-top,.cr-bot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;position:relative;z-index:3}
.cr-top{padding-top:calc(env(safe-area-inset-top,0px) + 10px)}
.cr-bot{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);justify-content:center}
.cr-top b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.cr-btn{border:0;background:none;color:#fff;font:inherit;font-size:17px;padding:8px 6px;cursor:pointer;min-width:84px;text-align:left}
.cr-btn.cr-ok{color:#0A84FF;font-weight:600;text-align:right}
.cr-btn:disabled{opacity:.5}
.cr-ic{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;flex:none;transition:transform .2s var(--pop-ease),background-color .2s ease}
.cr-ic:active{transform:scale(.9);background:rgba(255,255,255,.24)}
.cr-hint{font-size:13px;color:rgba(255,255,255,.62);text-align:center;flex:1;max-width:240px}
.cr-area{position:relative;flex:1;min-height:0;overflow:hidden;cursor:grab}
.cr-area.moving{cursor:grabbing}
.cr-img{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;max-width:none;pointer-events:none;transition:none}
.cropper:not(.on) .cr-img{transform-origin:0 0}
.cr-frame{position:absolute;pointer-events:none;border:1.5px solid rgba(255,255,255,.95);box-shadow:0 0 0 200vmax rgba(0,0,0,.62);border-radius:2px}
.cr-frame i{position:absolute;background:rgba(255,255,255,.55);opacity:0;transition:opacity .2s ease}
.cr-frame i:nth-child(1){left:33.333%;top:0;bottom:0;width:1px}
.cr-frame i:nth-child(2){left:66.666%;top:0;bottom:0;width:1px}
.cr-frame i:nth-child(3){top:33.333%;left:0;right:0;height:1px}
.cr-frame i:nth-child(4){top:66.666%;left:0;right:0;height:1px}
.cr-area.moving .cr-frame i{opacity:1}
.cr-frame::before,.cr-frame::after{content:"";position:absolute;width:22px;height:22px;border-color:#fff;border-style:solid}
.cr-frame::before{left:-3px;top:-3px;border-width:3px 0 0 3px}
.cr-frame::after{right:-3px;bottom:-3px;border-width:0 3px 3px 0}

.side-nav.no-sel .side-sel{opacity:0}

/* olho do modo discreto: só no Lançar */
#eyeBtn[hidden]{display:none !important}
/* nome do custo fixo termina em reticências quando não cabe */
#bFixos .inl-left{text-overflow:ellipsis;min-width:0;flex:1}
#bFixos .unitwrap{flex:none}


/* =====================================================================
   IDENTIDADE: GRAFITE E VERDE DA LOGO, CORES COM SIGNIFICADO
   ===================================================================== */
:root{
  --bg:#F1F4F2; --tint:#1A9A48; --tint-2:#34C759; --tint-soft:rgba(52,199,89,.14);
  --amb-a:rgba(29,36,51,.07); --amb-b:rgba(47,216,137,.16); --amb-c:transparent;
  --glow:rgba(52,199,89,.10); --ic:#7C7C82;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A0D10; --card:#15191D; --card-2:#1B2025;
    --tint:#30D158; --tint-2:#5BE38A; --tint-soft:rgba(48,209,88,.20);
    --amb-a:rgba(29,36,51,.95); --amb-b:rgba(47,216,137,.18); --amb-c:transparent;
    --glow:rgba(48,209,88,.12); --ic:#8E8E93;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0D10; --card:#15191D; --card-2:#1B2025;
  --tint:#30D158; --tint-2:#5BE38A; --tint-soft:rgba(48,209,88,.20);
  --amb-a:rgba(29,36,51,.95); --amb-b:rgba(47,216,137,.18); --amb-c:transparent;
  --glow:rgba(48,209,88,.12); --ic:#8E8E93;
}
/* fundo parado, com o grafite e o brilho verde da logo (antes eram três manchas se movendo sem parar) */
.ambient i{display:none !important}
.ambient{background:radial-gradient(560px 380px at 90% -90px,var(--amb-b),transparent 70%),radial-gradient(660px 440px at -12% -70px,var(--amb-a),transparent 72%)}
/* ícones neutros; cor só quando tem significado (entrada, alerta, excluir, selecionado) */
.sq:not(.sem){--c:var(--ic) !important}
.type[aria-pressed="true"] .sq{--c:var(--tint) !important}
.cr-btn.cr-ok{color:#30D158}
/* sem a marca no topo: o título sobe um pouco */
.brandrow{display:none !important}
@media (max-width:1023px){ .main{padding-top:calc(14px + env(safe-area-inset-top,0px))} }


/* =====================================================================
   PRECIZE: IDENTIDADE NOVA (grafite, vidro e cor só quando diz algo)
   ===================================================================== */
:root{
  --pos:#179447; --neg:#D93025; --warn:#B86E00; --info:#1F6FD1;
  --green-t:var(--pos); --red-t:var(--neg);
  --gl1:rgba(255,255,255,.94); --gl2:rgba(255,255,255,.80); --gline:rgba(15,25,20,.07);
  --gshadow:0 1px 0 rgba(255,255,255,.9) inset,0 10px 28px rgba(16,28,22,.07);
  --ic-bg:rgba(20,28,24,.06); --ib:rgba(255,255,255,.82); --inset-bg:rgba(20,28,24,.05); --trk:rgba(20,28,24,.08);
  --tab-bg:rgba(255,255,255,.74);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --pos:#34D96B; --neg:#FF6B61; --warn:#FFB224; --info:#4DA3FF;
    --gl1:rgba(255,255,255,.075); --gl2:rgba(255,255,255,.045); --gline:rgba(255,255,255,.09);
    --gshadow:inset 0 1px 0 rgba(255,255,255,.07),0 10px 30px rgba(0,0,0,.25);
    --ic-bg:rgba(255,255,255,.08); --ib:rgba(255,255,255,.07); --inset-bg:rgba(0,0,0,.26); --trk:rgba(255,255,255,.08);
    --tab-bg:rgba(26,30,34,.66);
  }
}
:root[data-theme="dark"]{
  --pos:#34D96B; --neg:#FF6B61; --warn:#FFB224; --info:#4DA3FF;
  --gl1:rgba(255,255,255,.075); --gl2:rgba(255,255,255,.045); --gline:rgba(255,255,255,.09);
  --gshadow:inset 0 1px 0 rgba(255,255,255,.07),0 10px 30px rgba(0,0,0,.25);
  --ic-bg:rgba(255,255,255,.08); --ib:rgba(255,255,255,.07); --inset-bg:rgba(0,0,0,.26); --trk:rgba(255,255,255,.08);
  --tab-bg:rgba(26,30,34,.66);
}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
/* cabeçalho */
.large-title{font-size:33px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.head-sub{font-size:15px;color:var(--label-2)}
.hbtn{width:40px;height:40px;background:var(--ib) !important;box-shadow:inset 0 0 0 .5px var(--gline) !important;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
/* superfícies de vidro */
.card,.group,.strip,.stats{background:linear-gradient(180deg,var(--gl1),var(--gl2)) !important;border-radius:26px !important;box-shadow:var(--gshadow),0 0 0 .5px var(--gline) inset !important}
.composer.glass{border-radius:26px !important;padding:14px !important}
.card{padding:16px}
.sec-h{font-size:20px !important;font-weight:800 !important;letter-spacing:-.02em;color:var(--label) !important;text-transform:none !important;margin:24px 4px 10px !important;padding:0 !important}
.sec-f{font-size:13px;color:var(--label-2)}
.sech{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:24px 4px 10px}
.sech b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.sech-a{border:0;background:none;color:var(--tint);font:inherit;font-size:15px;font-weight:600;cursor:pointer;padding:4px 0;white-space:nowrap}
.sech-n{font-size:14px;color:var(--label-2);font-weight:500}
/* ícones: círculos neutros nas listas; traço simples nos ajustes */
.sq{border-radius:50% !important;background:var(--ic-bg) !important;color:color-mix(in srgb,var(--label) 86%,transparent) !important}
.sq::after{display:none !important}
.sq.lg{width:40px;height:40px}
.sq.sem{background:color-mix(in srgb,var(--c) 16%,transparent) !important;color:var(--c) !important}
.icon-row .sq{background:transparent !important;width:26px;height:26px;color:color-mix(in srgb,var(--label) 78%,transparent) !important}
.icon-row .sq.sem{background:transparent !important;color:var(--c) !important}
/* listas de lançamentos */
.group .cell{min-height:56px}
.dlist{padding:4px 0}
.dlist .day-h{margin:0;padding:12px 16px 4px;font-size:13px;font-weight:600;color:var(--label-2)}
.day-h .pos{color:var(--pos)} .day-h .neg{color:var(--neg)}
.dlist .sw-row .cell{padding-top:9px;padding-bottom:9px}
.amt{font-size:16px;font-weight:700}
.amt.in{color:var(--pos)} .amt.out{color:var(--neg)}
.amt small{color:var(--warn) !important;font-weight:600}
/* formulário do Lançar */
.tseg{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;border-radius:14px;background:var(--inset-bg)}
.tseg button{border:0;background:transparent;padding:10px;border-radius:11px;font:inherit;font-size:15px;font-weight:600;color:var(--label-2);cursor:pointer;transition:background-color .25s ease,color .25s ease,box-shadow .25s ease}
.tseg[data-t="out"] [data-v="out"]{background:color-mix(in srgb,var(--neg) 18%,transparent);color:var(--neg);box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--neg) 38%,transparent)}
.tseg[data-t="in"] [data-v="in"]{background:color-mix(in srgb,var(--pos) 18%,transparent);color:var(--pos);box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--pos) 38%,transparent)}
.composer .amount{margin:18px 0 12px !important}
.composer .amount input{font-size:60px !important;font-weight:800 !important;letter-spacing:-.04em !important}
.composer .amount span{font-size:26px !important;font-weight:700 !important;color:var(--label-3) !important}
.composer .desc{background:var(--inset-bg) !important;border:0 !important;border-radius:14px !important;padding:13px 14px !important;font-size:16px !important;box-shadow:none !important}
.chips{display:flex;gap:8px;margin:12px -14px 14px;padding:0 14px;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 18px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;flex:none;white-space:nowrap;padding:8px 12px;border-radius:100px;border:0;background:var(--ib);box-shadow:inset 0 0 0 .5px var(--gline);font:inherit;font-size:14px;font-weight:600;color:var(--label);cursor:pointer;transition:background-color .2s ease,transform .3s var(--pop-ease)}
.chip svg{color:var(--label-2);flex:none}
.chip .dd{opacity:.7}
.chip .chip-l{font-size:13px;font-weight:800;color:var(--label-2)}
.chip:active{transform:scale(.95)}
.chip[aria-expanded="true"]{background:color-mix(in srgb,var(--label) 14%,transparent)}
.chip.warn{color:var(--warn);box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--warn) 45%,transparent)}
.chip.warn svg{color:var(--warn)}
.btn.cta{height:52px;border-radius:17px;font-size:17px;font-weight:700;color:#fff;border:0}
.btn.cta[data-t="out"]{background:linear-gradient(180deg,#FF6B61,#E8453B);box-shadow:0 8px 22px rgba(232,69,59,.34),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.cta[data-t="in"]{background:linear-gradient(180deg,#3FE27B,#1FA855);box-shadow:0 8px 22px rgba(31,168,85,.34),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.cta svg{margin-right:6px}
.sugs .sug{background:var(--ib);box-shadow:inset 0 0 0 .5px var(--gline)}
/* Resumo */
.filters{display:flex;gap:8px;align-items:center;margin:0 0 14px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.mpill{background:var(--ib) !important;box-shadow:inset 0 0 0 .5px var(--gline) !important;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);flex:none}
.mpill .lb{font-weight:700}
.fchips{display:flex;gap:4px;flex:none}
.fchips button{border:0;background:transparent;padding:8px 13px;border-radius:100px;font:inherit;font-size:14px;font-weight:600;color:var(--label-2);cursor:pointer;transition:background-color .2s ease,color .2s ease}
.fchips button[aria-pressed="true"]{background:color-mix(in srgb,var(--label) 12%,transparent);color:var(--label)}
.hero{padding:16px 16px 12px !important;margin-bottom:0}
.cap-t{font-size:13px;color:var(--label-2);font-weight:500}
.hero-num{font-family:var(--display) !important;font-size:40px !important;font-weight:800 !important;letter-spacing:-.035em !important;margin:2px 0 8px !important}
.hero-num.neg{color:var(--neg) !important}
.pill{font-size:12.5px;font-weight:700;padding:5px 10px 5px 8px}
.pill.up{background:color-mix(in srgb,var(--pos) 15%,transparent) !important;color:var(--pos) !important}
.pill.down{background:color-mix(in srgb,var(--neg) 15%,transparent) !important;color:var(--neg) !important}
.bchart{margin:14px -2px 0}
.bc-plot{position:relative;height:112px}
.bc-svg{display:block;width:100%;height:100%;overflow:visible}
.bc-zero{stroke:color-mix(in srgb,var(--label) 26%,transparent);stroke-width:1;stroke-dasharray:2 4}
.bc-now{stroke:color-mix(in srgb,var(--label) 20%,transparent);stroke-width:1;stroke-dasharray:2 3}
.bc-dot{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 2.4px var(--c);transform:translate(-50%,-50%)}
.bc-x{position:relative;height:16px;margin-top:4px;font-size:10.5px;color:var(--label-3)}
.bc-x span{position:absolute;top:0;transform:translateX(-50%)}
.bc-x span:first-child{transform:none} .bc-x span:last-child{transform:translateX(-100%)}
.bc-x.wk{display:flex;justify-content:space-between} .bc-x.wk span{position:static;transform:none}
.bc-leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--label-2);margin-top:6px}
.bc-leg span{display:inline-flex;align-items:center;gap:6px}
.bc-leg .lg{width:14px;height:2.5px;border-radius:2px;background:var(--c)}
.bc-leg .lg.dsh{background:repeating-linear-gradient(90deg,var(--c) 0 3px,transparent 3px 7px);opacity:.8}
.duo{display:grid !important;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tile{background:linear-gradient(180deg,var(--gl1),var(--gl2));border-radius:26px;box-shadow:var(--gshadow),0 0 0 .5px var(--gline) inset;padding:14px 16px;min-width:0}
.tile small{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--label-2)}
.tile b{display:block;font-size:24px;font-weight:800;letter-spacing:-.03em;margin:6px 0 2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile em{font-style:normal;font-size:12.5px;color:var(--label-2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.pos{background:var(--pos)} .dot.neg{background:var(--neg)}
.where{padding:6px 16px 10px !important}
.wrow{display:block;width:100%;border:0;background:none;text-align:left;color:inherit;font:inherit;padding:10px 0 8px;border-bottom:.5px solid var(--sep);cursor:pointer}
.wrow:last-child{border-bottom:0}
.wt{display:flex;justify-content:space-between;gap:10px;font-size:15px;font-weight:600;margin-bottom:7px}
.wt span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt b{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.wrow small{display:block;margin-top:5px;font-size:12px;color:var(--label-2)}
.wb{height:7px;border-radius:7px;background:var(--trk);overflow:hidden}
.wb i{display:block;height:100%;border-radius:7px;background:color-mix(in srgb,var(--label) 30%,transparent);transition:width .6s var(--ease-out)}
.wb.neg i{background:linear-gradient(90deg,#E8453B,#FF6B61)}
.wb.pos i{background:linear-gradient(90deg,#1FA855,#34D96B)}
.wb.warn i{background:linear-gradient(90deg,#F59E0B,#FFB224)}
.wb.info i{background:linear-gradient(90deg,#2F86F0,#4DA3FF)}
.wb.nt i{background:color-mix(in srgb,var(--label) 78%,transparent)}
.health{padding:6px 16px 14px !important}
.health .h{padding:10px 0 6px}
.ht{display:flex;justify-content:space-between;gap:10px;font-size:15px;font-weight:600;margin-bottom:8px}
.ht em{font-style:normal;color:var(--label-2);font-weight:500}
.segs{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px}
.segs i{height:7px;border-radius:4px;background:var(--trk)}
.segs i.f{background:var(--info)}
.strip span{font-weight:600}
.strip b{font-family:var(--display) !important;font-weight:800 !important}
.strip b.pos{color:var(--pos) !important} .strip b.neg{color:var(--neg) !important}
.caps .cap{background:transparent;color:var(--label-2);font-weight:600;font-size:14px;padding:8px 13px}
.caps .cap[aria-pressed="true"]{background:color-mix(in srgb,var(--label) 12%,transparent) !important;color:var(--label) !important}
#rCaps{margin-top:12px}
/* Planejar */
.seg{border-radius:100px !important;background:var(--ib) !important;box-shadow:inset 0 0 0 .5px var(--gline) !important;padding:4px !important}
.seg .thumb{border-radius:100px !important;background:color-mix(in srgb,var(--label) 13%,transparent) !important;box-shadow:none !important}
.seg button{font-weight:600 !important}
.sum{padding:16px !important}
.sum small,.sum>small{font-size:13px;color:var(--label-2);font-weight:500}
.hnum{font-family:var(--display);font-size:40px;font-weight:800;letter-spacing:-.035em;margin:2px 0 8px;font-variant-numeric:tabular-nums}
.sumr{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--label-2)}
.sumr b{color:var(--label);margin-left:4px} .sumr b.neg{color:var(--neg)} .sumr b.pos{color:var(--pos)}
button.lim{display:block;width:100%;text-align:left;color:inherit;font:inherit;padding:14px 16px !important;margin:0 0 10px;border:0;cursor:pointer;transition:transform .3s var(--pop-ease)}
button.lim:active{transform:scale(.985)}
.lt{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.lt b{flex:1;font-size:17px;font-weight:700;min-width:0}
.lt em{font-style:normal;font-size:14px;color:var(--label-2);font-weight:600;white-space:nowrap}
.lt .sq,.lim-row .sq{width:34px !important;height:34px !important}
.ls{display:flex;justify-content:space-between;font-size:13px;color:var(--label-2);margin-top:8px;font-weight:500}
.capbtn{border:0;color:var(--tint) !important;background:color-mix(in srgb,var(--tint) 15%,transparent) !important;padding:7px 12px !important;border-radius:100px !important;font-weight:700 !important;font-size:14px !important;white-space:nowrap}
/* Meu perfil */
.prof{display:flex !important;gap:14px;align-items:center;padding:16px !important}
.prof .av{flex:none}
.pf-t{min-width:0}
.pf-t .me-name{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.pf-t .me-mail{display:block;font-size:14px;color:var(--label-2);margin-top:1px;overflow:hidden;text-overflow:ellipsis}
.pf-t .me-ok{display:inline-flex;align-items:center;gap:4px;margin-top:7px;font-size:12px;font-weight:700;color:var(--pos);background:color-mix(in srgb,var(--pos) 14%,transparent);padding:5px 10px;border-radius:100px}
.pf-t .me-warn{margin-top:7px}
.pf-t .me-add{border:0;background:none;padding:0;font:inherit;font-size:18px;font-weight:700;color:var(--tint);cursor:pointer}
.out-acts{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:26px}
.out-btn{border:0;background:none;color:var(--neg);font:inherit;font-size:16px;font-weight:600;padding:8px 16px;cursor:pointer}
.del-btn{border:0;background:none;color:var(--label-3);font:inherit;font-size:14px;padding:6px 16px;cursor:pointer}
.me-foot{text-align:center;font-size:12px;color:var(--label-3);margin-top:18px;line-height:1.5}
/* barra de abas flutuante de vidro */
.tabbar{grid-template-columns:repeat(3,1fr) !important;height:66px;border-radius:40px;max-width:420px;background:var(--tab-bg) !important;box-shadow:0 14px 40px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 0 .5px var(--gline) !important;-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%)}
.tabbar .lens{width:calc((100% - 8px)/3) !important;border-radius:32px !important;background:color-mix(in srgb,var(--label) 8%,transparent) !important}
.tabbar button{font-size:10.5px;font-weight:600;color:var(--label-2)}
.tabbar button[aria-current="page"]{color:var(--tint)}
/* computador: duas colunas no Resumo e no Lançar */
@media (min-width:1024px){
  .rgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
  .rgrid .rcol>.sech:first-child{margin-top:0}
  .rgrid+.rgrid .rcol>.sech:first-child{margin-top:24px}
  .lanc{display:grid;grid-template-columns:minmax(360px,440px) 1fr;gap:28px;align-items:start}
  .lanc .composer{position:sticky;top:24px}
  .lanc-list>.sech:first-child{margin-top:0}
}
/* barra lateral: seleção discreta, no mesmo estilo da barra de abas */
.side-nav .side-sel{background:color-mix(in srgb,var(--label) 9%,transparent) !important;box-shadow:inset 0 0 0 .5px var(--gline) !important}
.side-nav button[aria-current="page"]{color:var(--tint) !important}
.side-nav button[aria-current="page"] svg{color:var(--tint) !important}
/* modo discreto também nos componentes novos */
body.private .tile b,body.private .tile em,body.private .wt b,body.private .hnum,body.private .sumr b,body.private .lt em,body.private .ls,
body.private .ht b,body.private .bc-plot,body.private .bc-x,body.private .cap-t{filter:blur(7px);-webkit-user-select:none;user-select:none}
body.private .wb,body.private .segs{opacity:.35}

.search{background:var(--ib) !important;box-shadow:inset 0 0 0 .5px var(--gline) !important;border-radius:14px !important}

/* contas: calendário neutro, sem o topo vermelho de iOS antigo */
.cal{width:42px !important;height:42px !important;border-radius:12px !important;background:var(--ic-bg) !important;box-shadow:inset 0 0 0 .5px var(--gline) !important;justify-content:center}
.cal i{background:none !important;color:var(--tint) !important;font-size:9.5px !important;font-weight:800 !important;letter-spacing:.05em;line-height:12px !important}
.cal b{font-family:var(--display) !important;font-size:17px !important;font-weight:800 !important;line-height:19px !important}
/* metas: cartões com barra reta, como os limites */
.meta{padding:14px 16px !important;margin:0 0 10px}
.meta .sq{width:34px !important;height:34px !important}
.mt-acts{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.mt-del{width:32px;height:32px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--ic-bg);color:var(--label-2);cursor:pointer}
/* seletor de tipo nas folhas: vermelho para saída, verde para entrada */
#eType:has([data-v="out"][aria-pressed="true"]) .thumb,#xType:has([data-v="out"][aria-pressed="true"]) .thumb{background:color-mix(in srgb,var(--neg) 20%,transparent) !important}
#eType:has([data-v="in"][aria-pressed="true"]) .thumb,#xType:has([data-v="in"][aria-pressed="true"]) .thumb{background:color-mix(in srgb,var(--pos) 20%,transparent) !important}
#eType [data-v="out"][aria-pressed="true"],#xType [data-v="out"][aria-pressed="true"]{color:var(--neg) !important}
#eType [data-v="in"][aria-pressed="true"],#xType [data-v="in"][aria-pressed="true"]{color:var(--pos) !important}
/* nas folhas, textos longos quebram a linha em vez de cortar */
#sheet .cell .t.grow{white-space:normal;line-height:1.25}


/* =====================================================================
   HISTÓRICO (EXTRATO) E RESUMO NOVO
   ===================================================================== */
.tabbar{grid-template-columns:repeat(4,1fr) !important;max-width:460px}
.tabbar .lens{width:calc((100% - 8px)/4) !important}
/* busca do extrato */
.hsearch{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px 0 14px;margin:0 0 6px}
.hsearch input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--label);outline:none}
.hsearch input::-webkit-search-cancel-button{display:none}
.hq-x{width:24px;height:24px;border-radius:50%;border:0;display:grid;place-items:center;background:color-mix(in srgb,var(--label) 22%,transparent);color:var(--bg);cursor:pointer;flex:none}
.hhint{font-size:12.5px;color:var(--label-3);margin:0 4px 12px;line-height:1.35}
.filters.dim{opacity:.4;pointer-events:none}
.mpill.off .ch{visibility:hidden}
.cap-dd{display:inline-flex;align-items:center;gap:5px}
.cap-dd .dd{opacity:.7}
.cap.on,.cap-dd.on{background:color-mix(in srgb,var(--tint) 16%,transparent) !important;color:var(--tint) !important}
.cap-clear{color:var(--tint) !important}
#hCaps{margin-top:2px}
.hcount{font-size:13px;color:var(--label-2);margin:10px 4px 0}
.hmonth{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 10px}
.hmonth b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.hmonth span{font-size:15px;font-weight:700}
#hList .dlist{margin-top:12px}
.hmonth+.dlist{margin-top:0 !important}
.hfoot{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:16px}
.h-csv{display:inline-flex;align-items:center;gap:6px}
.hpick{display:flex;flex-wrap:wrap;gap:8px;padding:4px 2px}
.hpick .cap{background:var(--ib);box-shadow:inset 0 0 0 .5px var(--gline)}
.btn.soft{background:var(--ib) !important;color:var(--label) !important;box-shadow:inset 0 0 0 .5px var(--gline) !important;height:48px;border-radius:16px;font-weight:600}
.r-all{margin-top:18px}
/* resumo: veredito, previsão e atenção */
.vd{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.vd i{width:10px;height:10px;border-radius:50%;flex:none;background:var(--label-3)}
.vd.pos i{background:var(--pos);box-shadow:0 0 0 4px color-mix(in srgb,var(--pos) 20%,transparent)}
.vd.warn i{background:var(--warn);box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 20%,transparent)}
.vd.neg i{background:var(--neg);box-shadow:0 0 0 4px color-mix(in srgb,var(--neg) 20%,transparent)}
.vd-f{font-size:14px;color:var(--label-2);margin:6px 0 14px 19px;line-height:1.35}
.hero .cap-t{display:block}
.prev-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;color:var(--label-2);padding:10px 0 2px;border-top:.5px solid var(--sep);margin-top:2px}
.prev-row b{font-size:17px;font-weight:800;color:var(--label);font-variant-numeric:tabular-nums}
.prev-row b.pos{color:var(--pos)} .prev-row b.neg{color:var(--neg)}
.okline{display:flex;gap:12px;align-items:flex-start;margin-top:12px;padding:14px 16px;border-radius:22px;background:color-mix(in srgb,var(--pos) 11%,transparent);box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--pos) 30%,transparent);color:var(--pos)}
.okline svg{flex:none;margin-top:1px}
.okline b{display:block;font-size:15px;font-weight:800}
.okline span{display:block;font-size:13px;color:var(--label-2);margin-top:2px;line-height:1.35}
.att .arow{min-height:60px}
.abtn{border:0;background:transparent;text-align:left;padding:0;color:inherit;font:inherit;cursor:pointer;min-width:0}
.abtn .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .s.neg{color:var(--neg)} .arow .s.warn{color:var(--warn)}
button.tile{display:block;width:100%;text-align:left;border:0;font:inherit;color:inherit;cursor:pointer;transition:transform .3s var(--pop-ease)}
button.tile:active{transform:scale(.97)}
body.private .prev-row b,body.private .arow .amt,body.private .vd-f,body.private .hmonth span,body.private #hStrip b{filter:blur(7px)}


/* =====================================================================
   PERFIL PERSONALIZADO: BOAS-VINDAS, DICAS E TEXTO GRANDE
   ===================================================================== */
/* boas-vindas em tela cheia */
body.ob-open{overflow:hidden}
.ob{position:fixed;inset:0;z-index:97;overflow-y:auto;background:var(--bg);opacity:0;transition:opacity .25s ease;
  background-image:radial-gradient(560px 380px at 90% -90px,var(--amb-b),transparent 70%),radial-gradient(660px 440px at -12% -70px,var(--amb-a),transparent 72%)}
.ob.on{opacity:1}
.ob-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 8px;max-width:520px;margin:0 auto}
.ob-back,.ob-skip{border:0;background:none;font:inherit;font-size:16px;color:var(--tint);cursor:pointer;padding:8px 4px;display:inline-flex;align-items:center;gap:2px}
.ob-back{justify-self:start} .ob-skip{justify-self:end;color:var(--label-2)}
.ob-dots{display:flex;gap:6px}.ob-dots i{width:22px;height:5px;border-radius:5px;background:var(--trk);transition:background-color .3s ease}.ob-dots i.on{background:var(--tint)}
.ob-body{max-width:520px;margin:0 auto;padding:18px 20px calc(env(safe-area-inset-bottom,0px) + 32px);animation:obIn .35s var(--ease-out)}
@keyframes obIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ob-body[data-step="0"],.ob-body[data-step="4"]{text-align:center;padding-top:8vh}
.ob-logo svg{width:92px;height:92px;border-radius:22px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.ob-body h2{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin:18px 0 8px}
.ob-p{font-size:16px;color:var(--label-2);line-height:1.45;margin:0 0 22px}
.ob-p.small{font-size:14px;margin-top:14px}
.ob-go{height:54px !important;border-radius:18px !important;font-size:17px !important;font-weight:700 !important;margin-top:8px}
.ob-skip2{border:0;background:none;font:inherit;font-size:16px;color:var(--label-2);padding:14px;cursor:pointer;display:block;margin:4px auto 0}
.ob-priv{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--label-3);margin-top:18px}
.ob-opts{display:flex;flex-direction:column;gap:10px}
.ob-opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;cursor:pointer;font:inherit;color:var(--label);padding:17px 18px;border-radius:20px;
  background:linear-gradient(180deg,var(--gl1),var(--gl2));box-shadow:var(--gshadow),0 0 0 .5px var(--gline) inset;transition:transform .25s var(--pop-ease),box-shadow .2s ease}
.ob-opt:active{transform:scale(.98)}
.ob-opt i{width:24px;height:24px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--label) 30%,transparent);transition:box-shadow .2s ease,background-color .2s ease}
.ob-opt.on{box-shadow:inset 0 0 0 2px var(--tint),var(--gshadow)}
.ob-opt.on i{background:var(--tint);box-shadow:inset 0 0 0 6px color-mix(in srgb,var(--bg) 70%,var(--tint))}
.ob-opt b{display:block;font-size:18px;font-weight:700}
.ob-opt small{display:block;font-size:14px;color:var(--label-2);margin-top:3px;line-height:1.35}
.ob-ok{color:var(--pos);display:flex;justify-content:center}
.ob-sum{text-align:left;margin-top:4px}
/* dicas curtas no topo das telas */
.dica-box:empty{display:none}
.dica{display:flex;align-items:flex-start;gap:12px;padding:14px 14px 14px 16px;margin:0 0 14px;border-radius:22px;background:color-mix(in srgb,var(--tint) 10%,transparent);box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--tint) 30%,transparent);animation:obIn .35s var(--ease-out);transition:opacity .2s ease,transform .2s ease}
.dica.saindo{opacity:0;transform:scale(.97)}
.dc-ic{color:var(--tint);flex:none;margin-top:2px}
.dc-t{flex:1;min-width:0}
.dc-t b{display:block;font-size:15px;font-weight:800}
.dc-t span{display:block;font-size:14px;color:var(--label-2);margin-top:3px;line-height:1.4}
.dc-ok{border:0;background:none;font:inherit;font-size:15px;font-weight:700;color:var(--tint);cursor:pointer;padding:2px 2px 2px 6px;flex:none}
.dica.convite{flex-direction:column;align-items:stretch;gap:12px}
.dc-a{display:flex;align-items:center;gap:14px}
.dc-x{border:0;background:none;font:inherit;font-size:15px;color:var(--label-2);cursor:pointer}
/* escolhas em Meu perfil */
.esc-row{text-align:left}
.esc-row .s{white-space:normal}
.esc-ck{color:var(--tint);flex:none}
/* números do mês (para quem quer tudo detalhado) */
.nums{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nums em{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
/* texto grande: letras e botões maiores em todo o app */
html.t-grande .main{zoom:1.12}
html.t-grande .tabbar button{font-size:12px}
html.t-grande .sheet .sh-body,html.t-grande .fmenu,html.t-grande .pop{zoom:1.08}
html.t-grande .ob-body{zoom:1.06}
.ob-logo{display:flex;justify-content:center}
.ob-priv{display:block !important;text-align:center;line-height:1.45}
.ob-priv svg{display:inline-block;vertical-align:-2px;margin-right:5px}

/* boas-vindas centralizada: títulos, textos e opções no meio da tela */
.ob-body{text-align:center !important;min-height:calc(100dvh - 64px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;justify-content:center;padding-top:8px !important}
.ob-body[data-step="0"],.ob-body[data-step="4"]{padding-top:8px !important}
.ob-body h2{margin-top:10px}
.ob-opt{justify-content:center;text-align:center;position:relative;padding:17px 48px !important}
.ob-opt span{flex:none}
.ob-opt i{position:absolute;right:16px;top:50%;width:26px !important;height:26px !important;margin-top:-13px;display:grid;place-items:center;color:#fff;background:var(--tint) !important;box-shadow:none !important;opacity:0;transform:scale(.6);transition:opacity .2s ease,transform .3s var(--pop-ease)}
.ob-opt.on i{opacity:1;transform:scale(1)}
.ob-sum .cell{text-align:left}


/* =====================================================================
   RESUMO COMPLETO: ATALHOS, FIXO, PAGAMENTOS, CALENDÁRIO, MAIORES, MÊS A MÊS
   ===================================================================== */
.rjump{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:-4px -16px 12px;padding:0 16px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 18px),transparent)}
.rjump::-webkit-scrollbar{display:none}
.rjump:empty{display:none}
.rjump .cap{flex:none;background:var(--ib) !important;box-shadow:inset 0 0 0 .5px var(--gline);color:var(--label) !important;font-size:13.5px;padding:7px 12px}
.blk{padding:16px !important}
.sbar{display:flex;height:12px;border-radius:12px;overflow:hidden;gap:2px;margin-bottom:12px;background:var(--trk)}
.sbar i{display:block;min-width:4px}
.lg-row{display:flex;align-items:center;gap:10px;width:100%;padding:8px 0;border:0;background:none;font:inherit;color:inherit;text-align:left;border-bottom:.5px solid var(--sep)}
button.lg-row{cursor:pointer}
.lg-row:last-of-type{border-bottom:0}
.lg-row i{width:10px;height:10px;border-radius:3px;flex:none}
.lg-row span{flex:1;min-width:0;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-row b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.lg-row em{font-style:normal;font-size:13px;color:var(--label-2);width:40px;text-align:right}
.blk-f{font-size:13px;color:var(--label-2);margin-top:10px;line-height:1.4}
.blk-f.warn{color:var(--warn)}
.blk-f .sech-a{font-size:13px;padding:0 0 0 4px}
/* calendário de gastos */
.cal-wd,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-wd{margin-bottom:6px}
.cal-wd span{text-align:center;font-size:11px;font-weight:700;color:var(--label-3)}
.cal-v{display:block}
.cal-c{position:relative;aspect-ratio:1;border:0;border-radius:10px;cursor:pointer;font:inherit;color:var(--label);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:var(--trk);transition:transform .25s var(--pop-ease)}
.cal-c.tem{background:color-mix(in srgb,var(--neg) var(--o),var(--trk))}
.cal-c b{font-size:12.5px;font-weight:700}
.cal-c small{font-size:10px;color:var(--label-2);font-weight:600}
.cal-c.tem b{color:#fff}
.cal-c.fut{opacity:.4}
.cal-c.hoje{box-shadow:0 0 0 2px var(--tint)}
.cal-c:active{transform:scale(.92)}
.cal-g.wk .cal-c{aspect-ratio:auto;padding:10px 0}
.cal-lg{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-top:12px;font-size:11.5px;color:var(--label-2)}
.cal-lg i{width:14px;height:14px;border-radius:4px;background:color-mix(in srgb,var(--neg) var(--o),var(--trk))}
.cal-lg em{font-style:normal;margin-left:auto;color:var(--label-3)}
/* maiores gastos */
.trow{text-align:left}
.trow .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* mês a mês */
.mm{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end}
.mm.n12{grid-template-columns:repeat(12,1fr);gap:3px}
.mm-c{border:0;background:none;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:12px;transition:background-color .2s ease}
.mm-c.on{background:color-mix(in srgb,var(--label) 8%,transparent)}
.mm-b{height:110px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.mm-b i{display:block;width:34%;max-width:14px;border-radius:5px 5px 2px 2px}
.mm.n12 .mm-b i{width:40%;max-width:9px}
.mm-b i.in{background:linear-gradient(180deg,#34D96B,#1FA855)}
.mm-b i.out{background:linear-gradient(180deg,#FF6B61,#E8453B)}
.mm-c span{font-size:12px;font-weight:700;color:var(--label-2)}
.mm-c.on span{color:var(--label)}
.mm-c small{font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.mm.n12 .mm-c small{font-size:9px}
.mm-lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--label-2)}
.mm-lg span{display:inline-flex;align-items:center;gap:5px}
.mm-lg i{width:10px;height:10px;border-radius:3px}
.mm-lg i.in{background:#34D96B} .mm-lg i.out{background:#FF6B61}
.mm-s{color:var(--label-3)}
body.private .lg-row b,body.private .cal-c small,body.private .mm-c small,body.private .blk-f{filter:blur(6px)}
@media (min-width:1024px){ .rjump{margin:-4px 0 14px;padding:0;-webkit-mask-image:none} }
.ob-opt span{flex:0 1 auto !important;min-width:0}
.ob-opt small{white-space:normal}
.cal-c.tem b{color:var(--label) !important}
.cal-c.forte b{color:#fff !important}
.cal-c.forte small{color:rgba(255,255,255,.85)}

/* =====================================================================
   FUNDO NO ESTILO DO ÍCONE: PRETO AZULADO COM BRILHO CLARO, SEM VERDE
   ===================================================================== */
:root{
  --bg:#F1F3F6;
  --app-bg:radial-gradient(120% 70% at 16% 0%,rgba(255,255,255,.95),rgba(255,255,255,0) 60%),linear-gradient(160deg,#FAFBFC 0%,#F0F2F5 55%,#E7EAEE 100%);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#080A0E;
    --app-bg:radial-gradient(120% 70% at 16% 0%,rgba(255,255,255,.075),rgba(255,255,255,0) 58%),linear-gradient(160deg,#1A1F29 0%,#0D1016 45%,#05070A 100%);
  }
}
:root[data-theme="dark"]{
  --bg:#080A0E;
  --app-bg:radial-gradient(120% 70% at 16% 0%,rgba(255,255,255,.075),rgba(255,255,255,0) 58%),linear-gradient(160deg,#1A1F29 0%,#0D1016 45%,#05070A 100%);
}
html,body{background-color:var(--bg) !important}
.ambient{background:var(--app-bg) !important}
.login{background:var(--app-bg),var(--bg) !important}
.ob{background:var(--app-bg),var(--bg) !important;background-attachment:fixed !important}
.ambient{position:fixed !important;top:0 !important;left:0 !important;right:0 !important;bottom:0 !important;height:auto !important}

/* fundo: verde escuro, branco apagado e preto neutro (sem azul) */
:root{
  --bg:#EEF1EF;
  --app-bg:radial-gradient(110% 60% at 94% 0%,rgba(30,150,90,.16),rgba(30,150,90,0) 62%),radial-gradient(110% 65% at 6% 0%,rgba(255,255,255,.95),rgba(255,255,255,0) 58%),linear-gradient(180deg,#F6F7F6 0%,#EEF1EF 55%,#E6E9E7 100%);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#060707;
    --app-bg:radial-gradient(110% 62% at 94% 0%,rgba(22,128,76,.34),rgba(22,128,76,0) 62%),radial-gradient(110% 62% at 6% 0%,rgba(214,219,216,.10),rgba(214,219,216,0) 58%),linear-gradient(180deg,#0E100F 0%,#080909 48%,#040505 100%);
  }
}
:root[data-theme="dark"]{
  --bg:#060707;
  --app-bg:radial-gradient(110% 62% at 94% 0%,rgba(22,128,76,.34),rgba(22,128,76,0) 62%),radial-gradient(110% 62% at 6% 0%,rgba(214,219,216,.10),rgba(214,219,216,0) 58%),linear-gradient(180deg,#0E100F 0%,#080909 48%,#040505 100%);
}

/* boas-vindas: nome e foto */
.ob-in{width:100%;height:56px;border-radius:18px;border:0;padding:0 18px;font:inherit;font-size:19px;font-weight:600;text-align:center;color:var(--label);
  background:linear-gradient(180deg,var(--gl1),var(--gl2));box-shadow:var(--gshadow),0 0 0 .5px var(--gline) inset;outline:none;margin-top:4px}
.ob-in:focus{box-shadow:inset 0 0 0 2px var(--tint),var(--gshadow)}
.ob-err{min-height:20px;font-size:13.5px;color:var(--neg);margin:8px 0 4px}
.ob-av{display:flex;justify-content:center;margin:6px 0 26px}
.ob-av .av{box-shadow:0 18px 40px rgba(0,0,0,.3)}
.ob-body[data-step="fim"]{padding-top:8px !important}
/* o recorte da foto abre por cima da boas-vindas */
.cropper{z-index:99 !important}

/* confirmar e-mail */
.vf-dica .s{white-space:normal;line-height:1.4;margin-top:3px}
.vf-dica b{color:var(--label)}
.vf-msg{min-height:20px;text-align:center;font-size:13.5px;margin:12px 0 0;color:var(--label-2)}
.vf-msg.ok{color:var(--pos)} .vf-msg.err{color:var(--neg)}
.ob-mail{display:flex;gap:10px;align-items:flex-start;text-align:left;margin-top:14px;padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.4;color:var(--label-2);background:color-mix(in srgb,var(--tint) 10%,transparent);box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--tint) 28%,transparent)}
.ob-mail svg{color:var(--tint);flex:none;margin-top:2px}
.ob-mail b{color:var(--label)}
.vf-acts{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:14px}
.vf-acts .btn{width:100%}

/* =====================================================================
   IMPORTAR EXTRATO
   ===================================================================== */
.imp-btn{margin:0 0 6px;gap:8px}
.imp-btn .imp-ic{display:inline-flex;color:var(--tint)}
body.imp-open{overflow:hidden}
.imp{position:fixed;inset:0;z-index:96;display:flex;flex-direction:column;background:var(--bg);background-image:var(--app-bg);opacity:0;transition:opacity .22s ease}
.imp.on{opacity:1}
.imp-top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 10px;color:var(--label)}
.imp-top b{font-size:17px;font-weight:700}
.imp-top .cr-btn{color:var(--label);min-width:76px}
.imp-top .cr-btn.cr-ok{color:var(--tint);text-align:right}
.imp-sum{flex:none;padding:4px 20px 14px}
.imp-sum b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.imp-sum span{display:block;font-size:13.5px;color:var(--label-2);margin-top:4px;line-height:1.4}
.imp-lista{flex:1;min-height:0;overflow-y:auto;padding:0 14px 16px;-webkit-overflow-scrolling:touch}
.imp-dia{font-size:13px;font-weight:600;color:var(--label-2);margin:14px 4px 6px}
.imp-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:18px;margin-bottom:6px;
  background:linear-gradient(180deg,var(--gl1),var(--gl2));box-shadow:0 0 0 .5px var(--gline) inset;opacity:.55;transition:opacity .2s ease}
.imp-row.on{opacity:1}
.imp-ck{width:26px;height:26px;border-radius:9px;flex:none;border:0;display:grid;place-items:center;cursor:pointer;
  background:transparent;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--label) 28%,transparent);color:transparent;transition:background-color .2s ease,color .2s ease,box-shadow .2s ease}
.imp-row.on .imp-ck{background:var(--tint);box-shadow:none;color:#fff}
.imp-row .t{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imp-row .s{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.imp-cat{border:0;background:var(--ib);box-shadow:inset 0 0 0 .5px var(--gline);color:var(--label-2);font:inherit;font-size:12.5px;font-weight:600;padding:3px 8px;border-radius:100px;cursor:pointer;display:inline-flex;align-items:center;gap:3px}
.imp-tag{font-size:11.5px;font-weight:700;color:var(--label-3);background:color-mix(in srgb,var(--label) 10%,transparent);padding:3px 8px;border-radius:100px}
.imp-tag.tr{color:var(--info);background:color-mix(in srgb,var(--info) 14%,transparent)}
.imp-row .amt{font-size:15px}
.imp-bar{flex:none;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:linear-gradient(180deg,transparent,var(--bg) 40%)}
body.private .imp-row .amt{filter:blur(7px)}
/* o menu de categoria precisa abrir por cima da tela de importação */
body.imp-open .fm-scrim{z-index:97}
body.imp-open .fmenu{z-index:98}
.imp-row .grow{min-width:0}
.imp-row .amt{flex:none}


/* tira do mês no Lançar */
.sech.l-mes{margin-top:22px}
.strip.l-strip{display:flex;width:100%;border:0;font:inherit;color:inherit;cursor:pointer;text-align:center;transition:transform .3s var(--pop-ease)}
.strip.l-strip:active{transform:scale(.985)}
/* total de cada dia: discreto, para não competir com os valores */
.day-h span:last-child,.day-h .pos,.day-h .neg{color:var(--label-2) !important;font-weight:600}
/* metas: arrastar e editar */
.meta{transition:transform .18s var(--ease-out),box-shadow .2s ease}
.meta.arrastando{transition:none;z-index:5;position:relative;box-shadow:0 18px 40px rgba(0,0,0,.35),0 0 0 .5px var(--gline) inset;transform-origin:center}
body.mt-drag{cursor:grabbing;-webkit-user-select:none;user-select:none}
.mt-grip{width:32px;height:32px;margin-left:-6px;border:0;background:none;color:var(--label-3);display:grid;place-items:center;cursor:grab;flex:none;touch-action:none}
.mt-grip:active{cursor:grabbing;color:var(--label-2)}
.mt-nome{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;font:inherit;color:inherit;text-align:left;padding:0;cursor:pointer}
.mt-nome b{flex:1;min-width:0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt-nome em{font-style:normal;font-size:14px;color:var(--label-2);font-weight:600;white-space:nowrap}
.btn.danger{background:color-mix(in srgb,var(--neg) 14%,transparent) !important;color:var(--neg) !important;box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--neg) 32%,transparent) !important;height:48px;border-radius:16px;font-weight:600}


/* tira do mês: mesma grade de três colunas da tira do histórico */
.strip.l-strip{display:grid !important;grid-template-columns:repeat(3,1fr)}
/* total de cada dia: verde ou vermelho, num tom bem claro */
:root{ --pos-l:#5FBE84; --neg-l:#E98A80; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --pos-l:#9BEBBC; --neg-l:#FFB3AC; } }
:root[data-theme="dark"]{ --pos-l:#9BEBBC; --neg-l:#FFB3AC; }
.day-h span:last-child{color:var(--label-2) !important}
.day-h span:last-child.pos{color:var(--pos-l) !important;font-weight:600}
.day-h span:last-child.neg{color:var(--neg-l) !important;font-weight:600}
/* alça das metas: alvo grande e visível no celular */
.mt-grip{width:42px !important;height:42px !important;margin-left:-8px;border-radius:14px;background:var(--ic-bg);color:var(--label-2)}
.mt-grip:active{background:color-mix(in srgb,var(--tint) 18%,transparent);color:var(--tint);transform:scale(.94)}
.mt-dica{font-size:12.5px;color:var(--label-3);margin:-4px 6px 10px}
.meta.arrastando{transform-origin:center;box-shadow:0 20px 44px rgba(0,0,0,.4),0 0 0 2px color-mix(in srgb,var(--tint) 55%,transparent) inset}

/* botão de importar: secundário do principal, com o mesmo brilho suave */
.composer .imp-btn{margin:10px 0 0 !important;height:46px !important;border-radius:15px !important;font-size:15.5px !important;font-weight:600 !important;
  gap:8px;letter-spacing:-.01em;background:var(--ib) !important;color:var(--label) !important;
  box-shadow:inset 0 0 0 .5px var(--gline),inset 0 1px 0 rgba(255,255,255,.06),0 6px 18px color-mix(in srgb,var(--tint) 20%,transparent) !important;
  transition:transform .3s var(--pop-ease),box-shadow .25s ease}
.composer .imp-btn svg{width:16px;height:16px;color:var(--tint);flex:none}
.composer .imp-btn:active{transform:scale(.975);box-shadow:inset 0 0 0 .5px var(--gline),0 3px 10px color-mix(in srgb,var(--tint) 16%,transparent) !important}
@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]) .composer .imp-btn{box-shadow:inset 0 0 0 .5px var(--gline),0 6px 16px color-mix(in srgb,var(--tint) 14%,transparent) !important} }


/* alça das metas: no computador ela nasce ao passar o mouse, empurrando o título de leve */
@media (hover:hover) and (pointer:fine){
  .meta .mt-grip{width:0 !important;min-width:0;padding:0;margin-left:0;margin-right:-10px;opacity:0;transform:translateX(-8px);
    background:transparent;overflow:hidden;pointer-events:none;
    transition:width .3s var(--ease-out),margin-right .3s var(--ease-out),opacity .22s ease,transform .3s var(--ease-out),background-color .2s ease}
  .meta:hover .mt-grip,.meta:focus-within .mt-grip{width:38px !important;margin-right:0;opacity:1;transform:none;background:var(--ic-bg);pointer-events:auto}
  .meta.arrastando .mt-grip{width:38px !important;margin-right:0;opacity:1;transform:none;background:color-mix(in srgb,var(--tint) 18%,transparent);color:var(--tint)}
  .meta .mt-nome{transition:transform .3s var(--ease-out)}
}
/* padrão do app: botões de ação com brilho e reação ao toque e ao mouse */
.capbtn{transition:transform .3s var(--pop-ease),box-shadow .25s ease,background-color .2s ease;
  box-shadow:0 4px 12px color-mix(in srgb,var(--tint) 14%,transparent)}
.capbtn:active{transform:scale(.94);box-shadow:0 2px 6px color-mix(in srgb,var(--tint) 12%,transparent)}
@media (hover:hover) and (pointer:fine){
  .capbtn:hover{transform:translateY(-1px);background:color-mix(in srgb,var(--tint) 22%,transparent) !important;box-shadow:0 8px 20px color-mix(in srgb,var(--tint) 28%,transparent)}
  .btn.cta:hover{transform:translateY(-1px);filter:brightness(1.05)}
  .composer .imp-btn:hover{transform:translateY(-1px);box-shadow:inset 0 0 0 .5px var(--gline),inset 0 1px 0 rgba(255,255,255,.06),0 10px 24px color-mix(in srgb,var(--tint) 28%,transparent) !important}
  .btn.soft:hover,.sech-a:hover{filter:brightness(1.06)}
  .mt-del:hover{background:color-mix(in srgb,var(--neg) 16%,transparent);color:var(--neg)}
}
.btn.cta{transition:transform .3s var(--pop-ease),filter .2s ease,box-shadow .25s ease}
.mt-del{transition:transform .3s var(--pop-ease),background-color .2s ease,color .2s ease}
.mt-del:active{transform:scale(.9)}

/* botão de importar: brilho branco, texto leve e menor que o do principal */
.composer .imp-btn{font-size:15px !important;font-weight:500 !important;letter-spacing:-.005em;
  box-shadow:inset 0 0 0 .5px var(--gline),inset 0 1px 0 rgba(255,255,255,.06),0 6px 18px rgba(255,255,255,.10) !important}
.composer .imp-btn:active{transform:scale(.975);box-shadow:inset 0 0 0 .5px var(--gline),0 3px 10px rgba(255,255,255,.08) !important}
@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]) .composer .imp-btn{box-shadow:inset 0 0 0 .5px var(--gline),0 6px 16px rgba(15,25,20,.10) !important} }
:root[data-theme="light"] .composer .imp-btn{box-shadow:inset 0 0 0 .5px var(--gline),0 6px 16px rgba(15,25,20,.10) !important}
@media (hover:hover) and (pointer:fine){
  .composer .imp-btn:hover{transform:translateY(-1px);box-shadow:inset 0 0 0 .5px var(--gline),inset 0 1px 0 rgba(255,255,255,.08),0 10px 26px rgba(255,255,255,.16) !important}
  :root[data-theme="light"] .composer .imp-btn:hover,html:not([data-theme="dark"]) .composer .imp-btn:hover{box-shadow:inset 0 0 0 .5px var(--gline),0 10px 22px rgba(15,25,20,.14) !important}
}
/* metas: organizar segurando o cartão */
.mt-dica{display:flex;align-items:center;gap:6px}
.mt-dica svg{color:var(--label-3);flex:none}
.meta{cursor:grab}
.meta.arrastando{cursor:grabbing}


/* =====================================================================
   CARTÕES
   ===================================================================== */
.cc-sq{background:color-mix(in srgb,var(--cc) 20%,transparent) !important;color:var(--cc) !important}
.mchip.mchip-cc svg{color:var(--cc)}
.mchip.mchip-cc.sel{box-shadow:inset 0 0 0 2px var(--cc)}
.cc-h{margin-top:20px}
.card.cc{padding:16px !important}
.cc-top{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;font:inherit;color:inherit;text-align:left;padding:0;cursor:pointer}
.cc-top b{flex:1;min-width:0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-top .chev{color:var(--label-3);display:flex}
.cc-dot{width:12px;height:12px;border-radius:4px;background:var(--cc);flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--cc) 18%,transparent)}
.cc-val{margin:12px 0 10px}
.cc-val small{font-size:12.5px;color:var(--label-2)}
.cc-num{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.card.cc .wb i{background:var(--cc)}
.card.cc .wb.warn i{background:var(--warn)} .card.cc .wb.neg i{background:var(--neg)}
.cc-datas{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:13px;color:var(--label-2)}
.cc-datas span{display:inline-flex;align-items:center;gap:6px}
.cc-datas svg{color:var(--label-3);flex:none}
.cc-ver{margin-top:14px}
.cc-cores{display:flex;flex-wrap:wrap;gap:10px;padding:4px 2px 2px}
.cc-cor{width:38px;height:38px;border-radius:13px;border:0;cursor:pointer;background:var(--cc);color:#fff;display:grid;place-items:center;
  box-shadow:0 4px 12px color-mix(in srgb,var(--cc) 30%,transparent);transition:transform .3s var(--pop-ease),box-shadow .2s ease}
.cc-cor svg{opacity:0;transform:scale(.6);transition:opacity .18s ease,transform .3s var(--pop-ease)}
.cc-cor.on{box-shadow:0 0 0 3px color-mix(in srgb,var(--cc) 45%,transparent),0 6px 16px color-mix(in srgb,var(--cc) 34%,transparent)}
.cc-cor.on svg{opacity:1;transform:none}
.cc-cor:active{transform:scale(.92)}
body.private .cc-num,body.private .card.cc .ls{filter:blur(7px)}


/* compras parceladas */
.px-hint{display:none;align-items:baseline;gap:8px;margin:2px 2px 10px;font-size:13.5px;color:var(--label-2)}
.px-hint.on{display:flex}
.px-hint b{font-size:15px;font-weight:700;color:var(--label)}
.chip.on{background:color-mix(in srgb,var(--tint) 16%,transparent);color:var(--tint);box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--tint) 34%,transparent)}
.px-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:2px}
.px-op{border:0;height:46px;border-radius:14px;background:var(--ib);box-shadow:inset 0 0 0 .5px var(--gline);color:var(--label);font:inherit;font-size:15px;font-weight:600;cursor:pointer;
  transition:transform .3s var(--pop-ease),background-color .2s ease,box-shadow .2s ease}
.px-op.on{background:color-mix(in srgb,var(--tint) 18%,transparent);color:var(--tint);box-shadow:inset 0 0 0 2px var(--tint)}
.px-op:active{transform:scale(.94)}
.px-tag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:100px;font-size:11.5px;font-weight:700;color:var(--label-2);background:color-mix(in srgb,var(--label) 10%,transparent)}
.px-info{display:flex;align-items:center;gap:8px;margin:0 0 14px;padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.35;color:var(--label-2);
  background:color-mix(in srgb,var(--info) 12%,transparent);box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--info) 28%,transparent)}
.px-info svg{color:var(--info);flex:none}
.cc-fut{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:13px;color:var(--label-2)}
.cc-fut svg{color:var(--label-3);flex:none}
.cc-fut b{color:var(--label);font-weight:700}
body.private .cc-fut b,body.private .px-hint b{filter:blur(6px)}

/* cartão: fatura fechada e próxima */
.cc-val small.warn{color:var(--warn)} .cc-val small.neg{color:var(--neg)}
.cc-prox{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:-2px 0 10px;font-size:13px;color:var(--label-2)}
.cc-prox b{font-size:15px;font-weight:700;color:var(--label);font-variant-numeric:tabular-nums}
.cc-prox em{font-style:normal;color:var(--label-3)}
body.private .cc-prox b{filter:blur(6px)}
/* alvos de toque mínimos */
.sech-a{min-height:34px;display:inline-flex;align-items:center;padding:0 2px}
.me-add{min-height:34px}
.arow .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .amt{flex:none}

/* fatura paga */
.cc-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.cc-pagar{display:inline-flex;align-items:center;gap:6px}
.cc-paga{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--pos)}
.cc-paga svg{flex:none}
.cc-desmarcar{border:0;background:none;font:inherit;font-size:13px;color:var(--label-2);cursor:pointer;padding:4px 2px;text-decoration:underline;text-underline-offset:2px}

/* saldo em conta */
.saldo-card{display:block;width:100%;text-align:left;border:0;font:inherit;color:inherit;cursor:pointer;padding:16px !important;margin-top:12px;transition:transform .3s var(--pop-ease)}
.saldo-card:active{transform:scale(.985)}
.sl-top{display:flex;align-items:center;justify-content:space-between}
.sl-lab{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--label-2)}
.sl-lab svg{color:var(--label-3)}
.sl-top .chev{color:var(--label-3);display:flex}
.sl-num{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:6px}
.sl-num.neg{color:var(--neg)}
.sl-sub{font-size:12.5px;color:var(--label-3);margin-top:3px}
.sl-dif{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:16px;font-size:13.5px;line-height:1.4}
.sl-dif.ok{background:color-mix(in srgb,var(--pos) 12%,transparent);color:var(--pos)}
.sl-dif.dif{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.sl-dif b{color:var(--label)}
body.private .sl-num{filter:blur(7px)}
.sl-prev{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:8px;padding-top:8px;border-top:.5px solid var(--sep);font-size:13px;color:var(--label-2)}
.sl-prev b{font-size:15px;font-weight:700;color:var(--label);font-variant-numeric:tabular-nums}
.sl-prev b.neg{color:var(--neg)}
body.private .sl-prev b{filter:blur(6px)}


/* =====================================================================
   TRAVA DO APP
   ===================================================================== */
body.lock-open{overflow:hidden}
body.lock-open .main,body.lock-open .tabbar,body.lock-open .side{filter:blur(22px)}
.lock{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;background:var(--bg);background-image:var(--app-bg);opacity:0;transition:opacity .22s ease}
.lock.on{opacity:1} .lock.saindo{opacity:0}
.lk-in{width:100%;max-width:340px;padding:0 20px calc(env(safe-area-inset-bottom,0px) + 18px);text-align:center}
.lk-logo svg{width:66px;height:66px;border-radius:17px;box-shadow:0 14px 30px rgba(0,0,0,.32)}
.lk-in h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:16px 0 6px}
.lk-p{font-size:14.5px;color:var(--label-2);margin:0 0 22px;min-height:20px}
.lk-p.erro{color:var(--neg)}
.lk-dots{display:flex;justify-content:center;gap:16px;margin-bottom:26px}
.lk-dots.meio{margin:18px 0 10px}
.lk-dots i{width:14px;height:14px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--label) 34%,transparent);transition:background-color .18s ease,transform .3s var(--pop-ease)}
.lk-dots i.on{background:var(--tint);box-shadow:none;transform:scale(1.06)}
.lk-dots.erro{animation:lkShake .42s var(--ease-out)}
@keyframes lkShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}45%{transform:translateX(9px)}70%{transform:translateX(-5px)}}
.lk-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;justify-items:center}
.lk-k{width:74px;height:74px;border-radius:50%;border:0;cursor:pointer;font:inherit;font-size:28px;font-weight:500;color:var(--label);
  background:linear-gradient(180deg,var(--gl1),var(--gl2));box-shadow:inset 0 0 0 .5px var(--gline);transition:transform .22s var(--pop-ease),background-color .15s ease}
.lk-k:active{transform:scale(.92);background:color-mix(in srgb,var(--tint) 22%,transparent)}
.lk-k.lk-ic{background:none;box-shadow:none;color:var(--label-2)}
.lk-k.lk-ic:active{background:color-mix(in srgb,var(--label) 10%,transparent)}
.lk-esq{margin-top:26px;border:0;background:none;font:inherit;font-size:15px;color:var(--tint);cursor:pointer;padding:10px}
.lk-inp{position:absolute;opacity:0;pointer-events:none;height:1px;width:1px}
.lk-erro{min-height:20px;font-size:13.5px;color:var(--neg);text-align:center;margin:6px 0 0}
/* listas de escolha: texto na ordem certa, alinhado à direita */
.cell select.inl{direction:ltr !important;text-align:right;text-align-last:right}
/* linhas de ajuste: o nome tem prioridade, o valor encolhe */
.cell .t.grow{min-width:0;flex:1 1 auto}
.cell .v{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:389px){
  .cell.icon-row{padding-right:12px}
  .cell.icon-row .v{font-size:16px}
}
/* aviso de onde o e-mail de confirmação chega */
.sec-f.aviso-mail{display:flex;gap:9px;align-items:flex-start;line-height:1.45}
.sec-f.aviso-mail svg{color:var(--warn);flex:none;margin-top:2px}
.sec-f.aviso-mail b{color:var(--label);font-weight:600}

/* teclado ao criar o código, dentro da folha */
.lk-pad.set{max-width:280px;margin:6px auto 4px;gap:12px}
.lk-pad.set .lk-k{width:66px;height:66px;font-size:26px}

/* conta fixa de valor variável */
.fx-varia{font-size:13.5px;font-weight:600;color:var(--label-2)}
.fx-ap{display:block;font-size:11.5px;font-weight:600;color:var(--label-3);margin-top:-2px}
.fv-ant{text-align:center;font-size:14px;color:var(--label-2);margin:-4px 0 6px}
.fv-usar{border:0;background:color-mix(in srgb,var(--tint) 16%,transparent);color:var(--tint);font:inherit;font-weight:700;padding:6px 12px;border-radius:100px;margin-left:6px;cursor:pointer;
  transition:transform .3s var(--pop-ease)}
.fv-usar:active{transform:scale(.94)}

/* aviso forte antes de apagar */
.av-box{display:flex;gap:10px;align-items:flex-start;margin:0 0 14px;padding:14px 16px;border-radius:16px;font-size:14px;line-height:1.4;
  background:color-mix(in srgb,var(--neg) 12%,transparent);color:var(--label);box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--neg) 30%,transparent)}
.av-box svg{color:var(--neg);flex:none;margin-top:1px}
.av-box b{display:block;color:var(--neg);font-size:15px;margin-bottom:2px}
.conf-cell{margin-top:4px}
.btn.full.danger:disabled{opacity:.45;pointer-events:none}

/* conferência da importação: separa o que é novo do que já existe */
.imp-sec{position:sticky;top:0;z-index:2;display:flex;align-items:baseline;gap:8px;padding:14px 4px 8px;margin-top:6px;
  font-size:13px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--label-2);background:var(--bg)}
.imp-sec small{font-size:11.5px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--label-3)}
.imp-row.ja{opacity:.62}
/* destaque ao chegar nas opções de recomeçar */
.group.piscar{animation:piscaGrupo 1.8s ease}
@keyframes piscaGrupo{0%,100%{box-shadow:none}20%,60%{box-shadow:0 0 0 3px color-mix(in srgb,var(--neg) 45%,transparent)}}
