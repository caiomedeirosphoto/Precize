.imp-tag.qs{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
/* apagar histórico: mesmo formato do baixar extrato, em vermelho */
.h-limpar{display:inline-flex;align-items:center;gap:6px;color:var(--neg) !important}
.h-limpar svg{color:var(--neg)}


/* =====================================================================
   FECHAMENTO DO MÊS
   ===================================================================== */
.fe-hero{text-align:center;padding:6px 4px 18px}
.fe-tit{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.fe-hero.pos .fe-tit{color:var(--pos)} .fe-hero.neg .fe-tit{color:var(--neg)}
.fe-num{font-size:40px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05}
.fe-num.pos{color:var(--pos)} .fe-num.neg{color:var(--neg)}
.fe-sub{font-size:14.5px;color:var(--label-2);margin-top:8px;line-height:1.4;max-width:300px;margin-left:auto;margin-right:auto}
.fe-io{display:flex;justify-content:center;gap:22px;margin-top:14px;font-size:13.5px;color:var(--label-2)}
.fe-io b{font-weight:700;margin-left:5px;font-variant-numeric:tabular-nums}
.fe-linha{display:flex;align-items:flex-start;gap:9px;margin:10px 2px;padding:12px 14px;border-radius:15px;font-size:14px;line-height:1.4;
  color:var(--label-2);background:var(--ib);box-shadow:inset 0 0 0 .5px var(--gline)}
.fe-linha b{color:var(--label);font-weight:700}
.fe-linha svg{color:var(--label-3);flex:none;margin-top:1px}
.fe-linha.ok{background:color-mix(in srgb,var(--pos) 12%,transparent)}
.fe-linha.ok svg{color:var(--pos)}
.fe-btn{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px}
.fe-btn svg{color:var(--pos)}
body.private .fe-num,body.private .fe-io b,body.private .fe-linha b{filter:blur(7px)}
.fe-linha.comp{justify-content:center;text-align:center}
.fe-linha.comp.ok b{color:var(--pos)} .fe-linha.comp.alerta b{color:var(--warn)}

function short(c){
  const v = Math.abs(Number(c||0))/100, s = c < 0 ? '-' : '';

  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');   // 5.000 é cinco mil, não cinco

  return isFinite(n) ? Math.round(n*100) : null;

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function hash(s){ let h = 0; for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; } return h; }
function debounce(fn, ms){ let t; return function(){ const a = arguments; clearTimeout(t); t = setTimeout(function(){ fn.apply(null, a); }, ms); }; }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function fmtDay(iso){
  const t = todayISO();

const FILL = {

const inflight = {};
function push(path, body){
  if(!DB) return Promise.resolve();
  body = JSON.parse(JSON.stringify(body));

  chain[path] = (chain[path] || Promise.resolve()).then(function(){
    return DB.doc(path).set(body).then(function(){ seen[path] = body.updatedAt; inflight[path]--; saveErr = false; idleStatus(); }, function(err){ inflight[path]--; throw err; })
      .catch(function(err){ saveErr = true; idleStatus(); island('A nuvem não confirmou. Seus dados seguem neste aparelho.', null, true); });
  });
  return chain[path];
}

let popClose = null, popFocus = null;
function openPop(o){
  popFocus = document.activeElement;
  const old = $('#pop'), pp = old.cloneNode(false);
  pp.innerHTML = '<div class="pop-h"><h3 id="popTitle">'+esc(o.title)+'</h3><button type="button" class="gbtn icon press sm-press" data-pclose aria-label="Fechar">'+ic('x',17,2.4)+'</button></div>'+(o.top ? '<div class="pop-top">'+o.top+'</div>' : '')+'<div class="pop-b">'+o.html+'</div>';
  old.parentNode.replaceChild(pp, old);
  $('#popWrap').classList.add('on');
  popClose = o.onClose || null;
  return pp;
}
function closePop(){
  $('#popWrap').classList.remove('on');
  if(popClose){ const f = popClose; popClose = null; f(); }
  if(popFocus && popFocus.focus) try{ popFocus.focus({preventScroll:true}); }catch(e){}
}
$('#popWrap').addEventListener('click', function(ev){ if(ev.target.closest('[data-pclose]')) closePop(); });

/* ================= menus que abrem a partir do botão (estilo iOS) =================
   Antes as gavetas cresciam dentro do quadro de vidro e o iPhone recalculava a página e o desfoque a cada quadro.
   Agora o menu flutua sobre a página: só movimento e transparência, que a placa de vídeo faz sozinha. */
const FM = { el:null, scrim:null, d:null, trig:null, ym:null, closeT:0, sat:null };
function fmSafeTop(){
  if(FM.sat === null){ const p = document.createElement('div'); p.style.cssText = 'position:fixed;top:0;left:0;height:0;padding-top:env(safe-area-inset-top,0px);visibility:hidden'; document.body.appendChild(p); FM.sat = parseFloat(getComputedStyle(p).paddingTop) || 0; p.remove(); }
  return FM.sat;
}
function fmEnsure(){
  if(FM.el) return;
  FM.scrim = document.createElement('div'); FM.scrim.className = 'fm-scrim';
  FM.el = document.createElement('div'); FM.el.className = 'fmenu'; FM.el.setAttribute('role', 'dialog');
  document.body.appendChild(FM.scrim); document.body.appendChild(FM.el);
  FM.scrim.addEventListener('pointerdown', function(e){ e.preventDefault(); menuClose(); });
  FM.scrim.addEventListener('wheel', function(){ menuClose(); }, { passive:true });
  const re = function(){ if(FM.d) fmPlace(); };
  window.addEventListener('resize', re); if(window.visualViewport) window.visualViewport.addEventListener('resize', re);
  FM.el.addEventListener('click', function(ev){
    const d = FM.d; if(!d) return;
    const pk = ev.target.closest('[data-pick]');
    if(pk){ const v = pk.getAttribute('data-v'); haptic(6); menuClose(); d.set(v); return; }
    const dm = ev.target.closest('[data-dm]');
    if(dm){ FM.ym = ymAdd(FM.ym || ymOf(d.get()), +dm.getAttribute('data-dm')); FM.el.innerHTML = fmHTML(); fmPlace(); return; }
    const ec = ev.target.closest('[data-edit-cats]');
    if(ec){ const t = ec.getAttribute('data-edit-cats'); menuClose(); if($('#sheetWrap').classList.contains('on')) closeSheet(); go('ajustes'); setTimeout(function(){ openList(t === 'out' ? 'cat-out' : 'cat-in'); }, 150); }
  });
  FM.el.addEventListener('input', function(ev){
    if(!ev.target.matches || !ev.target.matches('[data-dq]')) return;
    const q = ev.target.value.trim().toLowerCase(); let n = 0;
    $$('.pk', FM.el).forEach(function(r){ const ok = !q || r.getAttribute('data-k').indexOf(q) > -1; r.hidden = !ok; if(ok) n++; });
    $('[data-dnone]', FM.el).hidden = n > 0;
  });
  FM.el.addEventListener('keydown', function(ev){
    if(ev.key === 'Enter' && ev.target.matches && ev.target.matches('[data-dq]')){ ev.preventDefault(); const f = $$('.pk', FM.el).filter(function(r){ return !r.hidden; })[0]; if(f) f.click(); }
  });
  document.addEventListener('keydown', function(ev){ if(ev.key === 'Escape' && FM.d){ ev.stopPropagation(); menuClose(); } }, true);
}
function fmHTML(){
  const d = FM.d;
  const inner = d.kind === 'cat' ? catDrawer(d.type ? d.type() : 'out', d.get()) : (d.kind === 'day' ? dayDrawer(d.get(), FM.ym) : metDrawer(d.get()));
  return '<div class="dr-box fm-'+d.kind+'">'+inner+'</div>';
}
function fmPlace(){
  const el = FM.el, r = FM.trig.getBoundingClientRect(), vv = window.visualViewport;
  const vh = vv ? vv.height : window.innerHeight, vw = document.documentElement.clientWidth, m = 12, top0 = fmSafeTop() + m;
  const w = Math.min(Math.max(r.width, FM.d && FM.d.kind === 'day' ? 340 : 300), 420, vw - m*2);
  let left = r.left; if(left + w > vw - m) left = vw - m - w; if(left < m) left = m;
  el.style.width = w+'px'; el.style.maxHeight = 'none';
  const nat = el.scrollHeight;
  const below = vh - r.bottom - m - 8, above = r.top - top0 - 8;
  const down = below >= Math.min(nat, 320) || below >= above;
  const maxH = Math.max(180, Math.min(nat, down ? below : above, 480));
  el.style.maxHeight = maxH+'px';
  const h = Math.min(nat, maxH);
  el.style.left = left+'px'; el.style.top = (down ? r.bottom + 8 : r.top - 8 - h)+'px';
  const ox = Math.min(Math.max(r.left + r.width/2 - left, 24), w - 24);
  el.style.transformOrigin = ox+'px '+(down ? '0px' : '100%');
}
function menuOpen(d, trig){
  fmEnsure(); clearTimeout(FM.closeT);
  if(FM.trig && FM.trig !== trig) FM.trig.setAttribute('aria-expanded', 'false');
  FM.d = d; FM.trig = trig; FM.ym = d.kind === 'day' ? ymOf(d.get()) : null;
  FM.el.classList.remove('on');
  FM.el.innerHTML = fmHTML();
  fmPlace();
  const list = $('.dr-list', FM.el), sel = list && ($('.sel', list) || $$('.dayrow', list).filter(function(r){ return r.getAttribute('data-v') === todayISO(); })[0]);
  if(sel && list) list.scrollTop = sel.offsetTop - list.clientHeight/2 + sel.offsetHeight/2;
  trig.setAttribute('aria-expanded', 'true');
  FM.scrim.classList.add('on');
  void FM.el.offsetWidth;   // garante o estado inicial antes da animação
  FM.el.classList.add('on');
  if(d.kind === 'cat' && !TOUCH) setTimeout(function(){ const q = $('[data-dq]', FM.el); if(q) q.focus({ preventScroll:true }); }, 80);
  haptic(5);
}
function menuClose(){
  if(!FM.el || !FM.d) return;
  FM.el.classList.remove('on'); FM.scrim.classList.remove('on');
  if(FM.trig) FM.trig.setAttribute('aria-expanded', 'false');
  FM.d = null;
  clearTimeout(FM.closeT); FM.closeT = setTimeout(function(){ if(!FM.d) FM.el.innerHTML = ''; }, 260);
}
/* defs: [{ trigger, drawer, kind, get, set, type }] (drawer ficou só por compatibilidade) */
function pickers(root, defs){
  root.addEventListener('click', function(ev){
    for(let i=0;i<defs.length;i++){
      const d = defs[i], t = ev.target.closest(d.trigger);
      if(t && root.contains(t)){
        if(FM.d && FM.trig === t) menuClose(); else menuOpen(d, t);
        return;
      }
    }
  });
  return { closeAll: menuClose };
}

/* ================= cartões: fatura aberta, fechamento e vencimento ================= */
function ccDiaDoMes(ano, mes, dia){            // mes 1-12; encaixa o dia 31 em meses curtos
  const ult = new Date(ano, mes, 0).getDate();
  return ano + '-' + pad(mes) + '-' + pad(Math.min(dia, ult));
}
function ccJanela(c, fim){                     // período que termina num fechamento
  const a = +fim.slice(0,4), m = +fim.slice(5,7), fech = Math.min(31, Math.max(1, +c.fech || 1)), venc = Math.min(31, Math.max(1, +c.venc || 1));
  let pa = a, pm = m - 1; if(pm < 1){ pm = 12; pa--; }
  const ini = shiftDay(ccDiaDoMes(pa, pm, fech), 1);
  let va = a, vm = m; if(venc <= fech){ vm++; if(vm > 12){ vm = 1; va++; } }
  const vence = ccDiaDoMes(va, vm, venc);
  const itens = live(all()).filter(function(e){ const cd = cartaoDe(e); return e.t === 'out' && cd && cd.id === c.id && e.d >= ini && e.d <= fim; });
  return { ini:ini, fim:fim, vence:vence, total:sum(itens,'out'), itens:itens.length, faltaFechar:diasAte(fim), faltaVencer:diasAte(vence) };
}
function ccFaturas(c, ref){
  const hoje = ref || todayISO(), a = +hoje.slice(0,4), m = +hoje.slice(5,7), dia = +hoje.slice(8,10);
  const fech = Math.min(31, Math.max(1, +c.fech || 1));
  let fa = a, fm = m;                                       // mês em que a fatura aberta fecha
  if(dia > Math.min(fech, new Date(a, m, 0).getDate())){ fm++; if(fm > 12){ fm = 1; fa++; } }
  const aberta = ccJanela(c, ccDiaDoMes(fa, fm, fech));
  let pa = fa, pm = fm - 1; if(pm < 1){ pm = 12; pa--; }
  const fechada = ccJanela(c, ccDiaDoMes(pa, pm, fech));
  const futuras = live(all()).filter(function(e){ const cd = cartaoDe(e); return e.t === 'out' && cd && cd.id === c.id && e.d > aberta.fim; }).reduce(function(s,e){ return s + e.v; }, 0);
  fechada.paga = !!(c.pagas && c.pagas[fechada.fim]);
  fechada.pagaEm = fechada.paga ? c.pagas[fechada.fim].em : '';
  const emAberto = aberta.total + futuras + ((fechada.total && !fechada.paga && fechada.faltaVencer >= 0) ? fechada.total : 0);
  return { aberta:aberta, fechada:fechada, futuras:futuras, comprometido:emAberto,
           usado: c.limite ? Math.min(100, Math.round(emAberto / c.limite * 100)) : 0 };
}
function ccFatura(c, ref){ return ccFaturas(c, ref).aberta; }
function diasAte(d){ return Math.round((new Date(d+'T12:00:00') - new Date(todayISO()+'T12:00:00')) / 864e5); }
function ccPrazo(n){ return n === 0 ? 'hoje' : (n === 1 ? 'amanhã' : 'em '+n+' dias'); }

/* ================= compras parceladas ================= */
function ehCredito(met){ return met === 'Crédito' || !!cartaoPorNome(met); }
function dividirParcelas(total, n){        // a primeira parcela fica com o centavo que sobra
  const base = Math.floor(total / n), resto = total - base * n, out = [];
  for(let i=0;i<n;i++) out.push(base + (i === 0 ? resto : 0));
  return out;
}
function dataParcela(d, k){                // mesmo dia nos meses seguintes, encaixando meses curtos
  const a = +d.slice(0,4), m = +d.slice(5,7), dia = +d.slice(8,10);
  let am = a, mm = m + k; while(mm > 12){ mm -= 12; am++; }
  return ccDiaDoMes(am, mm, dia);
}
function grupoParcelas(id){ return live(all()).filter(function(e){ return e.pg === id; }).sort(function(a,b){ return (a.pn||0) - (b.pn||0); }); }

/* ================= saldo em conta ================= */
function saldoConf(){ return S.config.saldo || null; }
function depoisDaConferencia(e, s){        // conta o que veio depois da conferência, inclusive no mesmo dia
  if(e.d > s.d) return true;
  if(e.d < s.d) return false;
  return !s.ts || (e.ts || '') > s.ts;
}
function saldoHoje(){                      // último saldo informado + o que entrou e saiu (já pago) depois dele
  const s = saldoConf(); if(!s) return null;
  const movi = live(all()).filter(function(e){ return depoisDaConferencia(e, s) && e.d <= todayISO() && e.st !== 'pend'; });
  return s.v + sum(movi,'in') - sum(movi,'out');
}
function saldoPrevisto(){                  // mesma conta, contando também o que ainda vai entrar e sair até o fim do mês
  const s = saldoConf(); if(!s) return null;
  const fim = fimMes(ymNow());
  const movi = live(all()).filter(function(e){ return depoisDaConferencia(e, s) && e.d <= fim; });
  return s.v + sum(movi,'in') - sum(movi,'out');
}
function fimMes(ym){ const a = +ym.slice(0,4), m = +ym.slice(5,7); return ccDiaDoMes(a, m, new Date(a, m, 0).getDate()); }

function countUp(el, alvo, fmt){
  fmt = fmt || money; if(!el) return;
  if(REDUCED || !alvo){ el.textContent = fmt(alvo); return; }
  const t0 = performance.now(), dur = 600;
  (function step(t){ const p = Math.min(1,(t-t0)/dur), k = 1 - Math.pow(1-p, 4); el.textContent = fmt(Math.round(alvo*k)); if(p < 1) requestAnimationFrame(step); })(t0);
}

}

/* sugestões: frequentes quando a descrição está vazia, autocompletar quando você digita */
function norm(s){ return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(); }
function sugData(){
  const q = norm($('#cDesc') ? $('#cDesc').value : ''), lim = shiftDay(todayISO(), -90), groups = {};
  live(all()).forEach(function(e){
    if(e.t !== CS.t || !e.desc) return;
    const k = norm(e.desc); if(!k) return;
    const g = groups[k] || (groups[k] = { k:k, n:0, recent:0, last:null });
    g.n++; if(e.d >= lim) g.recent++;
    if(!g.last || e.d > g.last.d || (e.d === g.last.d && (e.ts||'') > (g.last.ts||''))) g.last = e;
  });
  const arr = Object.keys(groups).map(function(k){ return groups[k]; });
  if(!q){
    return { kind:'freq', items: arr.filter(function(g){ return g.recent >= 2; }).sort(function(a,b){ return b.recent - a.recent || (a.last.d < b.last.d ? 1 : -1); }).slice(0,5).map(function(g){ return g.last; }) };
  }
  if(q.length < 2) return { kind:'none', items:[] };
  return { kind:'match', items: arr.filter(function(g){ return g.k !== q && g.k.indexOf(q) > -1; })
    .sort(function(a,b){ const sa = a.k.indexOf(q) === 0 ? 0 : 1, sb = b.k.indexOf(q) === 0 ? 0 : 1; return sa - sb || b.n - a.n; }).slice(0,4).map(function(g){ return g.last; }) };
}

}

function hCent(t){ t = String(t).replace(/\./g, '').replace(',', '.'); const n = parseFloat(t); return isNaN(n) ? null : Math.round(n * 100); }

function parseBusca(raw){
  const r = { words:[], vals:[], day:null, month:null, year:null, iso:null, has:false };
  let q = ' ' + norm(raw).replace(/r\$\s*/g, ' ') + ' ';
  if(!q.trim()) return r;

  q = q.replace(new RegExp('(>=|<=|>|<|acima de|mais de|maior que|a partir de|abaixo de|menos de|menor que|ate)\\s*'+NUM, 'g'), function(m, op, v){
    const c = hCent(v); if(c === null) return m;
    if(/>|acima|mais|maior|partir/.test(op)) r.vals.push({ min:c + (op === '>' ? 1 : 0), max:Infinity }); else r.vals.push({ min:-Infinity, max:c - (op === '<' ? 1 : 0) });
    return ' '; });
  q = q.replace(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/g, function(m, d, mo, y){ r.day = +d; r.month = +mo; if(y) r.year = y.length === 2 ? 2000 + (+y) : +y; return ' '; });

    if(H_MES[t]){ r.month = H_MES[t]; return; }
    if(/^(19|20)\d{2}$/.test(t)){ r.year = +t; return; }
    if(/^\d+([.,]\d{1,2})?$/.test(t) || /^\d{1,3}(\.\d{3})+(,\d{1,2})?$/.test(t)){
      if(/[,]\d{1,2}$/.test(t) || /\.\d{1,2}$/.test(t) && !/\.\d{3}/.test(t)) r.vals.push({ exact:hCent(t) }); else r.vals.push({ reais:Math.round(hCent(t)/100), txt:t });
      return; }

}

  for(let i=0;i<b.vals.length;i++){ const v = b.vals[i];
    if(v.exact != null){ if(e.v !== v.exact) return false; }
    else if(v.reais != null){ if(Math.floor(e.v/100) !== v.reais && txt.indexOf(v.txt) === -1) return false; }
    else if(e.v < v.min || e.v > v.max) return false; }

}

/* ---------- ler o arquivo, respeitando acento de qualquer banco ---------- */
function impTexto(buf){
  const u8 = new Uint8Array(buf);
  let t = new TextDecoder('utf-8').decode(u8);
  if(t.indexOf('\uFFFD') > -1) t = new TextDecoder('windows-1252').decode(u8);
  return t;
}
function impData(s){
  s = String(s || '').trim();
  let m = s.match(/^(\d{4})-?(\d{2})-?(\d{2})/);
  if(m) return m[1]+'-'+m[2]+'-'+m[3];
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
  if(m){ let a = m[3]; if(a.length === 2) a = '20'+a; return a+'-'+pad(+m[2])+'-'+pad(+m[1]); }
  m = s.match(/^(\d{1,2})\s*(?:de\s*)?([a-zç]{3,})\.?\s*(?:de\s*)?(\d{2,4})?/i);
  if(m){ const mes = H_MES[norm(m[2]).slice(0,3)]; if(mes){ const a = m[3] ? (m[3].length === 2 ? '20'+m[3] : m[3]) : ymNow().slice(0,4); return a+'-'+pad(mes)+'-'+pad(+m[1]); } }
  return '';
}
function impValor(s){
  s = String(s || '').replace(/\s|R\$|\u00a0/gi, '');
  if(!s) return null;
  const neg = /^-|-$|^\(.*\)$/.test(s);
  s = s.replace(/[()]/g, '').replace(/^-|-$/g, '');
  if(s.indexOf(',') > -1 && s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
  else s = s.replace(/,/g, '');
  const n = parseFloat(s);
  if(isNaN(n)) return null;
  return { v: Math.round(Math.abs(n) * 100), neg: neg || n < 0 };
}
/* ---------- OFX ---------- */
function impOFX(txt){
  const out = [];
  txt.split(/<STMTTRN>/i).slice(1).forEach(function(b){
    const g = function(tag){ const m = b.match(new RegExp('<'+tag+'>([^<\r\n]*)', 'i')); return m ? m[1].trim() : ''; };
    const dt = g('DTPOSTED').replace(/\D/g, '').slice(0, 8);
    const val = impValor(g('TRNAMT'));
    if(dt.length !== 8 || !val || !val.v) return;
    const desc = (g('MEMO') || g('NAME') || 'Lançamento').replace(/\s+/g, ' ').trim();
    out.push({ d: dt.slice(0,4)+'-'+dt.slice(4,6)+'-'+dt.slice(6,8), v: val.v, t: val.neg ? 'out' : 'in', desc: desc, id: g('FITID'), tipo: g('TRNTYPE') });
  });
  return out;
}
/* ---------- CSV, com colunas de nomes variados ---------- */
function impCelulas(linha, sep){
  const out = []; let cur = '', aspas = false;
  for(let i=0;i<linha.length;i++){ const c = linha[i];
    if(c === '"'){ if(aspas && linha[i+1] === '"'){ cur += '"'; i++; } else aspas = !aspas; }
    else if(c === sep && !aspas){ out.push(cur); cur = ''; }
    else cur += c; }
  out.push(cur);
  return out.map(function(x){ return x.trim().replace(/^"|"$/g, ''); });
}
const IMP_COLS = {
  data:['data','date','dt','datalancamento','datamovimento','dataoperacao','datacompra'],
  desc:['descricao','historico','hist','lancamento','titulo','title','estabelecimento','memo','detalhe','descrição','operacao','description','movimento'],
  valor:['valor','amount','value','quantia','montante','valorbrl','valorrs'],
  credito:['credito','entrada','receita','crédito'],
  debito:['debito','saida','despesa','débito'],
  tipo:['tipo','type','natureza','dc','debitocredito']
};
/* o separador é o que mais se repete de forma constante nas linhas, não o da primeira linha */
function impSeparador(linhas){
  const cands = [';', ',', '\t', '|'];
  let melhor = ';', nota = -1;
  cands.forEach(function(c){
    const contas = linhas.slice(0, 40).map(function(l){ return impCelulas(l, c).length - 1; }).filter(function(n){ return n > 0; });
    if(contas.length < 2) return;
    const freq = {}; contas.forEach(function(n){ freq[n] = (freq[n] || 0) + 1; });
    let comum = 0, vezes = 0;
    Object.keys(freq).forEach(function(n){ if(freq[n] > vezes || (freq[n] === vezes && +n > comum)){ vezes = freq[n]; comum = +n; } });
    const n = vezes * 10 + comum;                       // muitas linhas com o mesmo número de colunas
    if(n > nota){ nota = n; melhor = c; }
  });
  return melhor;
}
function impCSV(txt){
  const linhas = txt.split(/\r?\n/).filter(function(l){ return l.trim(); });
  if(!linhas.length) return [];
  const sep = impSeparador(linhas);
  let hdr = -1, col = {};
  for(let i=0;i<Math.min(20, linhas.length);i++){
    const cs = impCelulas(linhas[i], sep).map(function(c){ return norm(c).replace(/[^a-z]/g, ''); });
    const achou = {};
    // a ordem da lista manda: "Descrição" ganha de "Histórico" quando o extrato traz as duas
    Object.keys(IMP_COLS).forEach(function(k){
      for(let n=0;n<IMP_COLS[k].length && achou[k] == null;n++){
        const nome = norm(IMP_COLS[k][n]).replace(/[^a-z]/g, '');
        cs.forEach(function(c, j){ if(achou[k] == null && Object.keys(achou).every(function(x){ return achou[x] !== j; }) && (c === nome || (c.length > 3 && c.indexOf(nome) === 0))) achou[k] = j; });
      }
    });
    if(achou.data != null && (achou.valor != null || achou.credito != null || achou.debito != null)){ hdr = i; col = achou; break; }
  }
  const colHist = (function(){ const cs = hdr >= 0 ? impCelulas(linhas[hdr], sep).map(function(c){ return norm(c).replace(/[^a-z]/g,''); }) : [];
    for(let j=0;j<cs.length;j++) if(j !== col.desc && /^(historico|hist|operacao|movimento|tipo|natureza)/.test(cs[j])) return j;
    return null; })();
  const out = [];
  const corpo = hdr >= 0 ? linhas.slice(hdr + 1) : linhas;
  corpo.forEach(function(l){
    const cs = impCelulas(l, sep);
    let d = '', val = null, desc = '', tipo = '', explicito = false;
    if(hdr >= 0){
      d = impData(cs[col.data]);
      if(col.valor != null){ val = impValor(cs[col.valor]); explicito = !!(val && val.neg); }
      if(col.credito != null && impValor(cs[col.credito]) && impValor(cs[col.credito]).v){ val = impValor(cs[col.credito]); val.neg = false; explicito = true; }
      if(col.debito != null && impValor(cs[col.debito]) && impValor(cs[col.debito]).v){ val = impValor(cs[col.debito]); val.neg = true; explicito = true; }
      desc = col.desc != null ? cs[col.desc] : '';
      tipo = col.tipo != null ? cs[col.tipo] : '';
      if(colHist != null){ const h = cs[colHist] || ''; tipo = (tipo ? tipo+' ' : '') + h; if(!desc) desc = h; }
    } else {
      cs.forEach(function(c){ if(!d) d = impData(c); });
      const cands = cs.map(impValor).filter(Boolean);
      val = cands.length ? cands[cands.length - 1] : null;
      explicito = !!(val && val.neg);
      desc = cs.slice().sort(function(a,b){ return b.replace(/[\d\/.,-]/g,'').length - a.replace(/[\d\/.,-]/g,'').length; })[0] || '';
    }
    if(!d || !val || !val.v) return;
    // o sinal do valor manda. Sem sinal, valem as palavras do histórico e da descrição
    let t = null;
    if(explicito) t = val.neg ? 'out' : 'in';
    else {
      const tn = norm(tipo + ' ' + desc);
      if(/(^|\s)d($|\s)/.test(norm(tipo)) || /\bdebito\b|\bsaida\b|\bdespesa\b|\bcompra\b|\benviad|\bsaque\b|\bpagto\b|\bpagamento de (fatura|boleto|conta)\b/.test(tn)) t = 'out';
      else if(/(^|\s)c($|\s)/.test(norm(tipo)) || /\bcredito\b|\bentrada\b|\breceita\b|\brecebid|\bdeposito\b|\bsalario\b|\brendimento\b/.test(tn)) t = 'in';
    }
    out.push({ d:d, v:val.v, t:t, desc:(desc || 'Lançamento').replace(/\s+/g, ' ').trim(), id:'', tipo:tipo, explicito:explicito });
  });
  // extrato sem sinal nenhum e sem coluna de débito e crédito: o normal é serem gastos
  const comSinal = out.some(function(x){ return x.explicito; });
  out.forEach(function(x){ if(!x.t) x.t = comSinal ? 'in' : 'out'; delete x.explicito; });
  return out;
}

}

function importarExtrato(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.ofx,.csv,.txt,.pdf,text/csv,text/plain,application/pdf,application/x-ofx,application/vnd.intu.qfx'; inp.multiple = true;

    for(const f of fs){
      try{
        const buf = await f.arrayBuffer();
        const ehPdf = /\.pdf$/i.test(f.name) || impEhPDF(buf);
        let lidos;
        if(ehPdf){
          const linhas = await pdfLinhas(buf);
          lidos = impExtratoTexto(linhas);

          const txt = impTexto(buf);

function impEhPDF(buf){ const b = new Uint8Array(buf.slice(0, 5)); return b[0] === 0x25 && b[1] === 0x50 && b[2] === 0x44 && b[3] === 0x46; }
async function inflarCom(bytes, modo){
  const ds = new DecompressionStream(modo);
  const w = ds.writable.getWriter();
  w.write(bytes); w.close();
  const leitor = ds.readable.getReader(), partes = [];
  let total = 0;
  for(;;){
    const { done, value } = await leitor.read();
    if(done) break;
    partes.push(value); total += value.length;
  }
  const out = new Uint8Array(total); let i = 0;
  partes.forEach(function(pt){ out.set(pt, i); i += pt.length; });
  return out;
}
async function inflar(bytes){
  try{ return await inflarCom(bytes, 'deflate'); }
  catch(e){
    try{ return await inflarCom(bytes, 'deflate-raw'); }    // alguns arquivos vêm sem o cabeçalho zlib
    catch(e2){ return null; }
  }
}
const LAT = new TextDecoder('latin1');
async function pdfLinhas(buf){
  const bytes = new Uint8Array(buf), raw = LAT.decode(bytes);
  const objs = {};                                          // número do objeto -> { corpo, ini, fim }
  const re = /(\d+)\s+\d+\s+obj\b/g; let m;
  while((m = re.exec(raw))){
    const fim = raw.indexOf('endobj', m.index);
    objs[+m[1]] = { corpo:raw.slice(m.index, fim < 0 ? raw.length : fim), pos:m.index };
  }
  const streamDe = async function(num){
    const o = objs[num]; if(!o) return null;
    let i = o.corpo.indexOf('stream'); if(i < 0) return null;
    let j = i + 6;
    while(o.corpo[j] === '\r' || o.corpo[j] === '\n') j++;
    let k = o.corpo.indexOf('endstream', j); if(k < 0) return null;
    while(k > j && (o.corpo[k-1] === '\n' || o.corpo[k-1] === '\r')) k--;   // tira a quebra antes de endstream
    const len = o.corpo.slice(0, i).match(/\/Length\s+(\d+)(?!\s+\d+\s+R)/);
    const ini = o.pos + j;
    let fim = o.pos + k;
    if(len && +len[1] > 0 && ini + (+len[1]) <= o.pos + k + 2) fim = ini + (+len[1]);   // tamanho declarado manda
    if(!/\/FlateDecode/.test(o.corpo)) return bytes.slice(ini, fim);
    const inf = await inflar(bytes.slice(ini, fim));
    if(inf) return inf;
    return await inflar(bytes.slice(ini, o.pos + k));
  };
  const cmapDe = async function(num){
    const st = await streamDe(num); if(!st) return {};
    const t = LAT.decode(st), mapa = {};
    (t.match(/beginbfchar[\s\S]*?endbfchar/g) || []).forEach(function(bl){
      const r2 = /<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/g; let x;
      while((x = r2.exec(bl))){
        let s2 = ''; for(let i=0;i<x[2].length;i+=4) s2 += String.fromCharCode(parseInt(x[2].substr(i,4), 16));
        mapa[parseInt(x[1], 16)] = s2;
      }
    });
    (t.match(/beginbfrange[\s\S]*?endbfrange/g) || []).forEach(function(bl){
      const r3 = /<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/g; let x;
      while((x = r3.exec(bl))){
        const a = parseInt(x[1],16), b = parseInt(x[2],16), c = parseInt(x[3],16);
        for(let k2 = a; k2 <= b && k2 - a < 6000; k2++) mapa[k2] = String.fromCharCode(c + k2 - a);
      }
    });
    return mapa;
  };
  const linhas = [];
  const paginas = Object.keys(objs).filter(function(n){ const c = objs[n].corpo; return /\/Type\s*\/Page[^s]/.test(c) && /\/Contents/.test(c); });
  for(const n of paginas){
    const corpo = objs[n].corpo, fontes = {};
    const fm = corpo.match(/\/Font\s*<<([\s\S]*?)>>/);
    if(fm){
      const rf = /\/(\w+)\s+(\d+)\s+\d+\s+R/g; let x;
      while((x = rf.exec(fm[1]))){
        const fo = objs[+x[2]]; if(!fo){ fontes[x[1]] = {}; continue; }
        const tu = fo.corpo.match(/\/ToUnicode\s+(\d+)\s+\d+\s+R/);
        fontes[x[1]] = tu ? await cmapDe(+tu[1]) : {};
      }
    }
    const refs = [];
    const cm = corpo.match(/\/Contents\s*(\[[^\]]*\]|\d+\s+\d+\s+R)/);
    if(cm){ const rr = /(\d+)\s+\d+\s+R/g; let x; while((x = rr.exec(cm[1]))) refs.push(+x[1]); }
    for(const ref of refs){
      const st = await streamDe(ref); if(!st) continue;
      const t = LAT.decode(st);
      let atual = {}, y = null, buf2 = '';
      const pat = /\/(\w+)\s+[\d.]+\s+Tf|(?:[-\d.]+\s+){4}([-\d.]+)\s+([-\d.]+)\s+Tm|([-\d.]+)\s+([-\d.]+)\s+(?:Td|TD)|T\*|<([0-9A-Fa-f\s]+)>\s*Tj|\(((?:[^()\\]|\\.)*)\)\s*Tj/g;
      let g;
      while((g = pat.exec(t))){
        if(g[1] != null){ atual = fontes[g[1]] || {}; continue; }
        if(g[3] != null){                                    // Tm: posição nova na página
          const ny = parseFloat(g[3]);
          if(y === null || Math.abs(ny - y) > 1.5){ if(buf2.trim()) linhas.push(buf2.trim()); buf2 = ''; y = ny; }
          continue;
        }
        if(g[5] != null){ if(Math.abs(parseFloat(g[5])) > 1.5 && buf2.trim()){ linhas.push(buf2.trim()); buf2 = ''; } continue; }
        if(g[6] != null){
          const h = g[6].replace(/\s/g, '');
          for(let i=0;i<h.length;i+=4){ const c = atual[parseInt(h.substr(i,4), 16)]; buf2 += (c == null ? '' : c); }
          continue;
        }
        if(g[7] != null){ buf2 += g[7].replace(/\\([()\\])/g, '$1'); continue; }
        if(g[0] === 'T*'){ if(buf2.trim()){ linhas.push(buf2.trim()); buf2 = ''; } }
      }
      if(buf2.trim()) linhas.push(buf2.trim());
    }
  }
  return linhas;
}
/* ---------- extrato em texto: linhas com data e valores ---------- */
const IMP_MESES = { janeiro:1, fevereiro:2, marco:3, abril:4, maio:5, junho:6, julho:7, agosto:8, setembro:9, outubro:10, novembro:11, dezembro:12 };
const IMP_PULAR = /^(saldo|valor|solicitado em|per[ií]odo|extrato|fale com a gente|sac:|ouvidoria|defici|cpf\/cnpj|ag[êe]ncia|conta:|total|dispon[ií]vel|bloquead)/i;
function impValorPT(t){                                     // "-R$ 1.234,56" -> { v:123456, neg:true }
  const m = String(t).match(/(-)?\s*R?\$?\s*(\d{1,3}(?:\.\d{3})*|\d+),(\d{2})/);
  if(!m) return null;
  return { v: (+(m[2].replace(/\./g, '')) * 100) + (+m[3]), neg: !!m[1] };
}
function impLigaturas(t){
  return String(t).replace(/\uFB00/g,'ff').replace(/\uFB01/g,'fi').replace(/\uFB02/g,'fl')
    .replace(/\uFB03/g,'ffi').replace(/\uFB04/g,'ffl').replace(/\uFB05|\uFB06/g,'st')
    .replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/\u00A0/g,' ');
}
function impExtratoTexto(linhas){
  const out = []; let dataAtual = '';
  linhas.forEach(function(l0){
    const l = impLigaturas(l0).replace(/\s+/g, ' ').trim();
    if(!l) return;
    const cab = l.match(/^(\d{1,2})\s+de\s+([A-Za-zçÇéÉ]+)\s+de\s+(\d{4})/);
    if(cab){
      const mes = IMP_MESES[norm(cab[2])];
      if(mes){ dataAtual = cab[3] + '-' + pad(mes) + '-' + pad(+cab[1]); return; }
    }
    const dm = l.match(/(\d{2})\/(\d{2})\/(\d{4})/);          // extratos que trazem a data na própria linha
    let data = dataAtual;
    if(dm && !/^(solicitado|per[ií]odo)/i.test(l)) data = dm[3] + '-' + dm[2] + '-' + dm[1];
    if(!data) return;
    if(IMP_PULAR.test(l)) return;
    const vals = [];
    const rv = /(-)?\s*R\$\s*(\d{1,3}(?:\.\d{3})*|\d+),(\d{2})/g; let x;
    while((x = rv.exec(l))) vals.push({ v:(+(x[2].replace(/\./g,'')) * 100) + (+x[3]), neg:!!x[1], i:x.index });
    if(!vals.length) return;
    const primeiro = vals[0];
    if(!primeiro.v) return;
    let desc = l.slice(0, primeiro.i).trim();
    let tipo = '';
    const dp = desc.match(/^([^:]{2,40}):\s*(.*)$/);
    if(dp){ tipo = dp[1].trim(); desc = dp[2].trim(); }
    desc = desc.replace(/^"|"$/g, '').replace(/^Cp\s*:\s*\d+\s*-\s*/i, '').replace(/^No estabelecimento\s+/i, '').trim();
    if(!desc) desc = tipo || 'Lançamento';
    const ent = /recebido|credito|crédito|deposito|depósito|entrada|estorno|devolu/i.test(tipo + ' ' + l) && !primeiro.neg;
    out.push({ d:data, v:primeiro.v, t:(primeiro.neg ? 'out' : (ent ? 'in' : 'out')), desc:desc.slice(0, 70), tipo:tipo, id:'' });
  });
  return out;
}

    $('#lkMsg', ov).classList.add('erro');

const LEMB_KEY = LS + ':lembretes';
function lembCfg(){ try{ return JSON.parse(localStorage.getItem(LEMB_KEY) || 'null') || { on:false, hora:'20:00', antes:2, ultimo:'' }; }catch(e){ return { on:false, hora:'20:00', antes:2, ultimo:'' }; } }
function lembSalvar(c){ try{ localStorage.setItem(LEMB_KEY, JSON.stringify(c)); }catch(e){} }
function lembPodeAvisar(){ return typeof Notification !== 'undefined' && Notification.permission === 'granted'; }
/* o que merece um aviso hoje */
function lembPendencias(){
  const hoje = todayISO(), lista = [];
  live(all()).forEach(function(e){
    if(e.st !== 'pend') return;
    const dd = diasAte(e.d);
    if(dd < 0) lista.push({ t:'atraso', txt:esc(e.desc)+' está atrasada desde '+fmtCurto(e.d), v:e.v });
    else if(dd <= (lembCfg().antes || 2)) lista.push({ t:'vence', txt:esc(e.desc)+(dd === 0 ? ' vence hoje' : (dd === 1 ? ' vence amanhã' : ' vence em '+dd+' dias')), v:e.v });
  });
  cartoes().forEach(function(c){
    const F = ccFaturas(c), fch = F.fechada;
    if(!fch.total || fch.paga) return;
    const dd = fch.faltaVencer;
    if(dd < 0) lista.push({ t:'atraso', txt:'A fatura do '+c.nome+' venceu em '+fmtCurto(fch.vence), v:fch.total });
    else if(dd <= (lembCfg().antes || 2)) lista.push({ t:'vence', txt:'A fatura do '+c.nome+(dd === 0 ? ' vence hoje' : (dd === 1 ? ' vence amanhã' : ' vence em '+dd+' dias')), v:fch.total });
  });
  return lista;
}
function lembTexto(l){
  if(!l.length) return null;
  if(l.length === 1) return { titulo:'Precize', corpo:l[0].txt.replace(/<[^>]+>/g, '')+' · '+money(l[0].v) };
  return { titulo:'Precize', corpo:l.length+' contas pedindo atenção. Toque para ver.' };
}
async function lembLigar(){
  if(typeof Notification === 'undefined'){ island('Este aparelho não aceita avisos', null, true); return false; }
  let p = Notification.permission;
  if(p === 'default'){ try{ p = await Notification.requestPermission(); }catch(e){ p = 'denied'; } }
  if(p !== 'granted'){ island('Você precisa permitir os avisos', null, true); return false; }
  const c = lembCfg(); c.on = true; lembSalvar(c);
  return true;
}
function lembAvisar(forcar){
  const c = lembCfg();
  if(!c.on || !lembPodeAvisar()) return;
  const hoje = todayISO();
  if(!forcar && c.ultimo === hoje) return;                       // um aviso por dia
  const agora = new Date(), hm = pad(agora.getHours())+':'+pad(agora.getMinutes());
  if(!forcar && hm < (c.hora || '20:00')) return;                 // ainda não deu a hora
  const t = lembTexto(lembPendencias());
  if(!t) return;
  c.ultimo = hoje; lembSalvar(c);
  try{ new Notification(t.titulo, { body:t.corpo, icon:'icons/icon-192.png', badge:'icons/icon-192.png', tag:'precize-lembrete' }); }catch(e){}
}

/* ================= fechamento do mês ================= */
const FECH_KEY = 'fechados';
function fechados(){ return S.config[FECH_KEY] || (S.config[FECH_KEY] = {}); }
/* o mês que acabou e ainda não foi visto */
function fechamentoPendente(){
  const passado = ymAdd(ymNow(), -1);
  if(fechados()[passado]) return '';
  if(!live(mList(passado)).length) return '';
  return passado;
}
function fechDados(ym){
  const ant = ymAdd(ym, -1);
  const mes = live(mList(ym)), mesAnt = live(mList(ant));
  const inc = sum(mes, 'in'), out = sum(mes, 'out'), sobra = inc - out;
  const sobraAnt = sum(mesAnt, 'in') - sum(mesAnt, 'out');
  // para onde foi
  const porCat = {}, porCatAnt = {};
  mes.forEach(function(e){ if(e.t === 'out') porCat[e.cat] = (porCat[e.cat] || 0) + e.v; });
  mesAnt.forEach(function(e){ if(e.t === 'out') porCatAnt[e.cat] = (porCatAnt[e.cat] || 0) + e.v; });
  const cats = Object.keys(porCat).sort(function(a, b){ return porCat[b] - porCat[a]; }).slice(0, 3)
    .map(function(c){ return { cat:c, v:porCat[c], dif:porCat[c] - (porCatAnt[c] || 0), tinha:porCatAnt[c] != null }; });
  // limites do mês
  const limites = Object.keys(S.config.budgets || {}).map(function(c){
    return { cat:c, lim:S.config.budgets[c], gasto:porCat[c] || 0 };
  }).sort(function(a, b){ return (b.gasto / b.lim) - (a.gasto / a.lim); });
  const estourou = limites.filter(function(l){ return l.gasto > l.lim; });
  const dentro = limites.filter(function(l){ return l.gasto <= l.lim; });
  // contas que ficaram para trás
  const pendentes = mes.filter(function(e){ return e.st === 'pend' && e.t === 'out'; });
  // metas
  const guardado = (S.config.metas || []).reduce(function(s, m){
    return s + (m.hist || []).filter(function(h){ return (h.d || '').slice(0, 7) === ym; }).reduce(function(a, h){ return a + h.v; }, 0);
  }, 0);
  // maior gasto do mês
  const maior = mes.filter(function(e){ return e.t === 'out'; }).sort(function(a, b){ return b.v - a.v; })[0] || null;
  const dias = new Set(mes.map(function(e){ return e.d; })).size;
  return { ym:ym, inc:inc, out:out, sobra:sobra, sobraAnt:sobraAnt, temAnt:!!mesAnt.length,
           cats:cats, estourou:estourou, dentro:dentro, pendentes:pendentes, guardado:guardado, maior:maior, dias:dias, n:mes.length };
}
function fechVerdito(d){
  const m = cap(MES[+d.ym.slice(5, 7) - 1]);
  if(d.sobra > 0 && d.temAnt && d.sobra > d.sobraAnt) return { t:'pos', tit:m+' fechou bem', sub:'Você terminou com '+money(d.sobra)+' sobrando, mais que no mês anterior.' };
  if(d.sobra > 0) return { t:'pos', tit:m+' fechou no azul', sub:'Você terminou com '+money(d.sobra)+' sobrando.' };
  if(d.sobra === 0) return { t:'', tit:m+' fechou no zero a zero', sub:'O que entrou deu exatamente para o que saiu.' };
  return { t:'neg', tit:m+' fechou no vermelho', sub:'Saiu '+money(-d.sobra)+' a mais do que entrou.' };
}

        '<div class="amt out">'+money(e.v)+'</div></div>';
    }).join('')+'</div>'+
    '<div class="sec-f">Elas continuam no histórico de '+mes+'. Marque como pagas quando quitar, ou apague se não valem mais.</div>';
  }
  if(d.guardado) h += '<div class="fe-linha ok">'+glyph('target', 16)+'<span>Você guardou <b>'+money(d.guardado)+'</b> nas suas metas</span></div>';
  if(d.maior) h += '<div class="fe-linha">'+glyph('spark', 16)+'<span>O maior gasto foi <b>'+esc(d.maior.desc)+'</b>, de '+money(d.maior.v)+'</span></div>';
  h += '<div class="sec-h">Agora</div>'+
    '<button type="button" class="btn full" data-fe-lim>Ajustar os limites de '+mesNovo+'</button>'+

  const sh = openSheet({ title:'Fechamento de '+mes, html:h, cancel:auto ? 'Fechar' : 'Voltar', onClose:function(){
    fechados()[ym] = 1; saveConfig();
  }});
  sh.addEventListener('click', function(ev){

      return;

    if(ev.target.closest('[data-fe-ver]')){

      setTimeout(function(){ V.ym = ym; V.rMode = 'mes'; go('resumo'); renderResumo(); }, 280);
      return;
    }
  });

/* mostra sozinho quando o mês vira, sem atrapalhar quem está entrando */
function talvezFechamento(){
  if(document.body.classList.contains('lg-aberto') || document.body.classList.contains('ob-open') || document.body.classList.contains('lock-open')) return;

async function offerFile(name, text){
  const dl = await useCap('downloads');
  if(dl){ try{ await dl.save({ filename:name, data:text }); return true; }catch(e){ if(!(e && e.code === 'declined')) island('Não deu para baixar aqui', null, true); return false; } }
  if(STANDALONE && TOUCH && navigator.canShare){
    try{ const file = new File([text], name, { type: name.endsWith('.csv') ? 'text/csv' : 'application/json' });
      if(navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:name }); return true; } }
    catch(e){ if(e && e.name === 'AbortError') return false; }
  }
  try{ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text],{type:'application/octet-stream'})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500); return true; }
  catch(e){ island('Não deu para baixar aqui', null, true); return false; }
}

  } else if(a === 'csv'){
    const y = V.ym.slice(0,4); let rows = [];
    Object.keys(S.months).forEach(function(k){ if(k.slice(0,4) === y) rows = rows.concat(live(mList(k))); });
    if(!rows.length){ island('Nada lançado em '+y, null, true); return; }
    rows.sort(function(x,z){ return x.d < z.d ? -1 : 1; });
    let csv = 'Data;Tipo;Descricao;Categoria;Forma;Situacao;Valor\n';
    rows.forEach(function(e){ csv += [fmtFull(e.d), e.t==='in'?'Entrada':'Saida', String(e.desc).replace(/;/g,','), e.cat, e.met||'', e.st==='pago'?'Pago':'Pendente', (e.t==='out'?'-':'')+(e.v/100).toFixed(2).replace('.',',')].join(';')+'\n'; });

/* ================= nuvem ================= */
async function syncCloud(){
  const db = await useCap('db');
  if(!db){ mode = 'local'; idleStatus(); return; }
  DB = db;
  let cfg, ms;
  try{ cfg = await db.doc('config/main').get(); ms = await db.collection('months').get(); }catch(e){ DB = null; mode = 'local'; idleStatus(); return; }
  const localHas = all().length > 0 || S.config.quotes.length || S.config.fixos.length || S.config.metas.length;
  const pushes = [];
  /* meses: fica a versão mais nova de cada um */
  const remoteIds = {};
  (ms.docs||[]).forEach(function(d){
    const b = clone(d.data()) || {}, p = 'months/'+d.id, loc = S.stamps[p];
    remoteIds[d.id] = 1;
    if(localHas && loc && b.updatedAt && loc > b.updatedAt){ pushes.push(p); }
    else { S.months[d.id] = b.items || []; S.stamps[p] = b.updatedAt || ''; }
    seen[p] = b.updatedAt;
  });
  Object.keys(S.months).forEach(function(k){ if(!remoteIds[k] && mList(k).length){ if(!S.stamps['months/'+k]) S.stamps['months/'+k] = nowISO(); pushes.push('months/'+k); } });
  /* ajustes */
  if(cfg.exists){
    const rc = clone(cfg.data()), loc = S.stamps['config/main'] || S.config.updatedAt;
    if(localHas && loc && rc.updatedAt && loc > rc.updatedAt) pushes.push('config/main');
    else { S.config = mergeConfig(rc); S.stamps['config/main'] = rc.updatedAt || ''; }
    seen['config/main'] = rc.updatedAt;
  } else if(localHas) pushes.push('config/main');
  mode = 'cloud'; saveLocal(); idleStatus(); render();
  for(let i=0;i<pushes.length;i++){
    const p = pushes[i];
    if(p === 'config/main') await push(p, S.config);
    else { const ym = p.slice(7); await push(p, { items: mList(ym), updatedAt: S.stamps[p] }); }
  }
  /* mudanças vindas de outro aparelho: só entram se forem mais novas e se não houver gravação local pendente */
  UNSUBS.push(db.doc('config/main').onSnapshot(function(s){
    if(!s.exists || s.metadata.hasPendingWrites) return;
    const b = clone(s.data()), p = 'config/main';
    if(!b.updatedAt || busy(p) || b.updatedAt <= (S.stamps[p] || '')) return;
    S.stamps[p] = b.updatedAt; seen[p] = b.updatedAt; S.config = mergeConfig(b); saveLocal();
    if(V.tab !== 'precificar' && V.tab !== 'ajustes' && !$('#sheetWrap').classList.contains('on') && !$('#popWrap').classList.contains('on')) render();
  }, function(){}));
  UNSUBS.push(db.collection('months').onSnapshot(function(s){
    if(s.metadata.hasPendingWrites) return; let ch = false;
    (s.docs||[]).forEach(function(d){
      const b = clone(d.data()) || {}, p = 'months/'+d.id;
      if(!b.updatedAt || busy(p) || b.updatedAt <= (S.stamps[p] || '')) return;
      S.stamps[p] = b.updatedAt; seen[p] = b.updatedAt; S.months[d.id] = b.items || []; ch = true;
    });
    if(ch){ saveLocal(); if(!$('#sheetWrap').classList.contains('on') && !$('#popWrap').classList.contains('on')) render(); }
  }, function(){}));
}

function verifUltimo(){ try{ return +(localStorage.getItem(VERIF_KEY) || 0); }catch(e){ return 0; } }

function remetente(){ const c = window.FIREBASE_CONFIG || {}; return c.authDomain ? 'noreply@' + c.authDomain : 'noreply do Firebase'; }
function enviarVerificacao(){ abrirVerificacao(); }
function abrirVerificacao(){
  const p = perfil(); let timer = null;
  const sh = openSheet({ title:'Confirmar e-mail', small:true, onClose:function(){ clearInterval(timer); if(V.tab === 'conta') renderConta(); }, html:
    '<div class="sh-ic">'+sq('var(--warn)','mail','xl sem',26)+'</div>'+
    '<p class="sh-p" style="text-align:center">Enviamos um link para <b>'+esc(p.email)+'</b>. Abra o e-mail e toque no link para confirmar a sua conta.</p>'+
    '<div class="group vf-dica"><div class="cell"><div class="grow"><div class="t">Não chegou?</div><div class="s">Procure no <b>spam</b>, no <b>lixo eletrônico</b> ou em <b>promoções</b>. O e-mail vem de '+esc(remetente())+' e pode levar alguns minutos.</div></div></div></div>'+
    '<div class="vf-acts"><button type="button" class="btn full" id="vfEnviar">Reenviar link</button>'+
    '<button type="button" class="btn full soft" id="vfJa">Já confirmei</button></div>'+
    '<p class="vf-msg" id="vfMsg"></p>' });
  const bE = $('#vfEnviar', sh), msg = $('#vfMsg', sh);
  const tick = function(){ const falta = Math.ceil((60000 - (Date.now() - verifUltimo())) / 1000);
    if(falta > 0){ bE.disabled = true; bE.textContent = 'Reenviar em '+falta+' s'; } else { bE.disabled = false; bE.textContent = 'Reenviar link'; } };
  const enviar = async function(){
    bE.disabled = true; bE.textContent = 'Enviando'; msg.className = 'vf-msg'; msg.textContent = '';
    try{ await enviarLinkVerificacao(); msg.className = 'vf-msg ok'; msg.textContent = 'Link enviado para '+p.email+'.'; }
    catch(e){ msg.className = 'vf-msg err'; msg.textContent = (e && e.code === 'auth/too-many-requests') ? 'Muitos envios seguidos. Espere alguns minutos e tente de novo.' : contaErro(e); try{ localStorage.removeItem(VERIF_KEY); }catch(x){} }
    tick();
  };
  bE.addEventListener('click', enviar);
  $('#vfJa', sh).addEventListener('click', async function(){
    const b = this; b.disabled = true; b.textContent = 'Conferindo';
    try{ const u = await window.__FB.reload();
      if(u && u.emailVerified){ closeSheet(); renderMe(); haptic(10); island('E-mail confirmado'); return; }
      msg.className = 'vf-msg err'; msg.textContent = 'Ainda não aparece como confirmado. Toque no link do e-mail e volte aqui.'; }
    catch(e){ msg.className = 'vf-msg err'; msg.textContent = contaErro(e); }
    b.disabled = false; b.textContent = 'Já confirmei';
  });
  timer = setInterval(tick, 1000);
  if(Date.now() - verifUltimo() > 60000) enviar(); else { tick(); msg.className = 'vf-msg ok'; msg.textContent = 'O link já foi enviado há pouco.'; }
}

/* recorte em tela cheia, quadrado 1:1: arrastar, aproximar com dois dedos (ou roda do mouse), girar e escolher */
const ROT_ICON = '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 11.5a7.5 7.5 0 1 1 2.2 5.3"/><path d="M4.2 6.5v5h5"/></svg>';
function abrirRecorte(file){
  const url = URL.createObjectURL(file), img = new Image();
  img.onerror = function(){ URL.revokeObjectURL(url); island('Não consegui abrir essa imagem'); };
  img.onload = function(){
    const lim = 2400, k0 = Math.min(1, lim / Math.max(img.naturalWidth, img.naturalHeight));
    let src = document.createElement('canvas'); src.width = Math.round(img.naturalWidth * k0); src.height = Math.round(img.naturalHeight * k0);
    src.getContext('2d').drawImage(img, 0, 0, src.width, src.height); URL.revokeObjectURL(url);
    const ov = document.createElement('div'); ov.className = 'cropper'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-label', 'Ajustar foto');
    ov.innerHTML = '<div class="cr-top"><button type="button" class="cr-btn" data-cr="cancel">Cancelar</button><b>Mover e ajustar</b><button type="button" class="cr-btn cr-ok" data-cr="ok">Escolher</button></div>'+
      '<div class="cr-area"><div class="cr-frame"><i></i><i></i><i></i><i></i></div></div>'+
      '<div class="cr-bot"><button type="button" class="cr-ic" data-cr="rot" aria-label="Girar a foto">'+ROT_ICON+'</button><span class="cr-hint">Arraste para posicionar. Use dois dedos para aproximar.</span></div>';
    document.body.appendChild(ov); document.body.classList.add('cr-open'); menuClose();
    const area = $('.cr-area', ov), frame = $('.cr-frame', ov);
    let F = 0, fx = 0, fy = 0, W = 0, H = 0, base = 1, z = 1, x = 0, y = 0;
    const put = function(){ src.className = 'cr-img'; area.insertBefore(src, frame); };
    const layout = function(){
      const r = area.getBoundingClientRect();
      F = Math.max(120, Math.min(r.width - 32, r.height - 32, 520)); fx = (r.width - F) / 2; fy = (r.height - F) / 2;
      frame.style.left = fx+'px'; frame.style.top = fy+'px'; frame.style.width = F+'px'; frame.style.height = F+'px';
      W = src.width; H = src.height; base = Math.max(F / W, F / H);
    };
    const clamp = function(){ const k = base * z; x = Math.min(fx, Math.max(fx + F - W * k, x)); y = Math.min(fy, Math.max(fy + F - H * k, y)); };
    const draw = function(){ src.style.transform = 'translate3d('+x+'px,'+y+'px,0) scale('+(base * z)+')'; };
    const center = function(){ const k = base * z; x = fx + (F - W * k) / 2; y = fy + (F - H * k) / 2; clamp(); draw(); };
    const zoomAt = function(nz, px, py){ const k0 = base * z, cx = (px - x) / k0, cy = (py - y) / k0; z = Math.min(5, Math.max(1, nz)); const k = base * z; x = px - cx * k; y = py - cy * k; clamp(); draw(); };
    put(); layout(); center();
    requestAnimationFrame(function(){ ov.classList.add('on'); });
    const pts = new Map(); let last = null, pinch = null, tapT = 0;
    const local = function(e){ const r = area.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; };
    area.addEventListener('pointerdown', function(e){
      area.setPointerCapture(e.pointerId); pts.set(e.pointerId, local(e)); area.classList.add('moving');
      const a = Array.from(pts.values());
      if(pts.size === 2){ pinch = { d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y), z: z }; last = null; }
      else { last = a[0]; const now = Date.now(); if(now - tapT < 280){ const p = a[0]; zoomAt(z > 1.4 ? 1 : 2.2, p.x, p.y); } tapT = now; }
    });
    area.addEventListener('pointermove', function(e){
      if(!pts.has(e.pointerId)) return; pts.set(e.pointerId, local(e));
      const a = Array.from(pts.values());
      if(pts.size >= 2 && pinch){ const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); zoomAt(pinch.z * d / pinch.d, (a[0].x + a[1].x) / 2, (a[0].y + a[1].y) / 2); return; }
      if(last){ const p = a[0]; x += p.x - last.x; y += p.y - last.y; last = p; clamp(); draw(); }
    });
    const up = function(e){ pts.delete(e.pointerId); if(pts.size < 2) pinch = null; const r = Array.from(pts.values())[0]; last = r || null; if(!pts.size) area.classList.remove('moving'); };
    area.addEventListener('pointerup', up); area.addEventListener('pointercancel', up);
    area.addEventListener('wheel', function(e){ e.preventDefault(); const p = local(e); zoomAt(z * (1 - e.deltaY * .0015), p.x, p.y); }, { passive:false });
    const onResize = function(){ layout(); center(); };
    window.addEventListener('resize', onResize);
    const fechar = function(){
      window.removeEventListener('resize', onResize); document.removeEventListener('keydown', onKey, true);
      ov.classList.remove('on'); document.body.classList.remove('cr-open');
      setTimeout(function(){ ov.remove(); }, 240);
    };
    const onKey = function(e){ if(e.key === 'Escape'){ e.stopPropagation(); fechar(); } };
    document.addEventListener('keydown', onKey, true);
    ov.addEventListener('click', async function(e){
      const b = e.target.closest('[data-cr]'); if(!b) return;
      const act = b.getAttribute('data-cr');
      if(act === 'cancel'){ fechar(); return; }
      if(act === 'rot'){
        const c = document.createElement('canvas'); c.width = src.height; c.height = src.width;
        const g = c.getContext('2d'); g.translate(c.width, 0); g.rotate(Math.PI / 2); g.drawImage(src, 0, 0);
        src.remove(); src = c; z = 1; put(); layout(); center(); haptic(6); return;
      }
      if(act === 'ok'){
        const k = base * z, lado = F / k, out = Math.max(64, Math.min(1080, Math.round(lado)));
        const c = document.createElement('canvas'); c.width = out; c.height = out;
        const g = c.getContext('2d'); g.imageSmoothingQuality = 'high';
        g.drawImage(src, (fx - x) / k, (fy - y) / k, lado, lado, 0, 0, out, out);
        let q = .88, data = c.toDataURL('image/jpeg', q);
        while(data.length > 700000 && q > .5){ q -= .1; data = c.toDataURL('image/jpeg', q); }
        b.disabled = true; b.textContent = 'Salvando';
        try{ await fotoGravar(data); }
        catch(err){ b.disabled = false; b.textContent = 'Escolher'; island(err && err.message === 'espaço' ? 'Sem espaço no aparelho para a foto' : 'Não deu para salvar a foto agora'); return; }
        fechar(); haptic(10); island('Foto atualizada');
      }
    });
  };
  img.src = url;
}

/* atalhos do ícone do app: ?novo=out, ?novo=in, ?ir=resumo */
function atalhoDeEntrada(){
  let p; try{ p = new URLSearchParams(location.search); }catch(e){ return; }
  const novo = p.get('novo'), ir = p.get('ir');
  if(!novo && !ir) return;
  try{ history.replaceState(null, '', location.pathname); }catch(e){}
  setTimeout(function(){
    if(ir && ['lancar','historico','resumo','planejar'].indexOf(ir) > -1){ go(ir); return; }
    if(novo !== 'out' && novo !== 'in') return;
    go('lancar');
    const b = $('#cType button[data-v="'+novo+'"]');
    if(b && CS.t !== novo) b.click();
    const inp = $('#cVal');
    if(inp){ window.scrollTo({ top:0, behavior:'auto' }); inp.focus({ preventScroll:true }); }
  }, 700);
}

/* ---------- arrastar as metas para organizar ---------- */
let mtDrag = null;
let mtEspera = null;
function mtComecar(card, y, el, pid){
  const cards = $$('#plan .meta');
  mtDrag = { card:card, cards:cards, rects:cards.map(function(c){ return c.getBoundingClientRect(); }), y0:y, idx:cards.indexOf(card), alvo:cards.indexOf(card) };
  card.classList.add('arrastando'); document.body.classList.add('mt-drag');
  try{ if(el && pid != null) el.setPointerCapture(pid); }catch(e){}
  haptic(8);
}
$('#plan').addEventListener('pointerdown', function(ev){
  const card = ev.target.closest('.meta[data-mid]'); if(!card) return;
  if(ev.target.closest('button')) return;            // + Guardar, editar e excluir seguem normais
  const y = ev.clientY, pid = ev.pointerId;
  clearTimeout(mtEspera);
  mtEspera = setTimeout(function(){ if(!mtDrag) mtComecar(card, y, card, pid); }, 300);   // segurar o cartão e arrastar
});
$('#plan').addEventListener('pointermove', function(ev){ if(!mtDrag) clearTimeout(mtEspera); }, { passive:true });
window.addEventListener('pointermove', function(ev){
  if(!mtDrag) return;
  const dy = ev.clientY - mtDrag.y0, r = mtDrag.rects[mtDrag.idx], centro = r.top + r.height / 2 + dy;
  mtDrag.card.style.transform = 'translateY('+dy+'px)';
  let novo = 0;
  mtDrag.rects.forEach(function(x, i){ if(centro > x.top + x.height / 2) novo = i; });
  if(novo !== mtDrag.alvo){
    mtDrag.alvo = novo; haptic(3);
    const h = r.height + 10;
    mtDrag.cards.forEach(function(el, i){
      if(i === mtDrag.idx) return;
      let t = 0;
      if(i > mtDrag.idx && i <= novo) t = -h; else if(i < mtDrag.idx && i >= novo) t = h;
      el.style.transform = t ? 'translateY('+t+'px)' : '';
    });
  }
});
function mtSoltar(){
  clearTimeout(mtEspera);
  if(!mtDrag) return;
  const { idx, alvo, cards, card } = mtDrag;
  cards.forEach(function(el){ el.style.transform = ''; });
  card.classList.remove('arrastando'); document.body.classList.remove('mt-drag');
  mtDrag = null;
  if(alvo !== idx && S.config.metas[idx]){
    const m = S.config.metas.splice(idx, 1)[0];
    S.config.metas.splice(alvo, 0, m);
    saveConfig(); haptic(8);
  }
  renderPlanejar();
}
window.addEventListener('pointerup', mtSoltar);
window.addEventListener('pointercancel', mtSoltar);
/* pergunta o valor de cada conta variável, uma depois da outra */
function confirmarValores(lista, i){
  if(i >= lista.length) return;
  const f = lista[i], id = 'fx-'+f.id+'-'+V.ym, e = mList(V.ym).filter(function(x){ return x.id === id; })[0];
  if(!e){ confirmarValores(lista, i + 1); return; }
  perguntarValorFixa({ e:e, ym:V.ym }, 'lancar', function(){ setTimeout(function(){ confirmarValores(lista, i + 1); }, 340); });
}
/* conta fixa de valor variável: lança e já confirma o valor do mês */
function lancarFixaVariavel(f){
  launchFixo(f); saveMonth(V.ym); saveConfig(); renderFixas();
  const id = 'fx-'+f.id+'-'+V.ym, e = mList(V.ym).filter(function(x){ return x.id === id; })[0];
  if(!e) return;
  setTimeout(function(){ perguntarValorFixa({ e:e, ym:V.ym }, 'lancar'); }, 240);
}
/* leva para os Ajustes e destaca as opções de recomeçar */
function irParaRecomecar(){
  go('conta');
  setTimeout(function(){
    const b = $('[data-go-ajustes]');
    if(b) b.click();
    setTimeout(function(){
      const alvo = $('#settings [data-dt="limpar"]');
      if(!alvo) return;
      alvo.scrollIntoView({ block:'center', behavior:'smooth' });
      const grupo = alvo.parentElement;
      grupo.classList.add('piscar');
      setTimeout(function(){ grupo.classList.remove('piscar'); }, 1800);
    }, 420);
  }, 260);
}
})();

<script type="module">

/* ponte com o Firebase: login por e-mail e banco por usuário */
if(!window.__FB_TEST){
  const VERSOES = ['12.19.0', '12.12.0'];
  const avisar = (tipo, user) => { window.__FB_LAST = { type:tipo, user:user || null }; const h = window.__appFB; if(h){ if(tipo === 'auth') h.auth(user || null); else if(h[tipo]) h[tipo](); } };
  const cfg = window.FIREBASE_CONFIG || {};
  if(!cfg.apiKey || String(cfg.apiKey).indexOf('COLE') === 0){ avisar('noConfig'); window.__FB_LAST.type = 'noconfig'; }
  else (async () => {
    let A, AU, F;
    for(const v of VERSOES){
      try{
        const base = 'https://www.gstatic.com/firebasejs/' + v + '/';
        [A, AU, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
        break;
      }catch(e){ A = null; }
    }
    if(!A){ avisar('fail'); return; }
    const app = A.initializeApp(cfg);
    const auth = AU.getAuth(app); auth.languageCode = 'pt-BR';
    let db;
    try{ db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
    catch(e){ db = F.getFirestore(app); }
    const embrulha = s => ({ id:s.id, exists:s.exists(), data:() => s.data(), metadata:{ hasPendingWrites:s.metadata.hasPendingWrites, fromCache:s.metadata.fromCache } });
    const vazio = id => ({ id, exists:false, data:() => undefined, metadata:{} });
    const lista = q => ({ docs:q.docs.map(embrulha), size:q.size, empty:q.empty, metadata:{ hasPendingWrites:q.metadata.hasPendingWrites } });
    const banco = uid => ({
      doc(p){
        const r = F.doc(db, 'users', uid, ...p.split('/'));
        return {
          get: async () => { try{ return embrulha(await F.getDoc(r)); }catch(e){ try{ return embrulha(await F.getDocFromCache(r)); }catch(e2){ return vazio(r.id); } } },
          set: body => F.setDoc(r, body),
          delete: () => F.deleteDoc(r),
          onSnapshot: (cb, err) => F.onSnapshot(r, s => cb(embrulha(s)), err)
        };
      },
      collection(p){
        const c = F.collection(db, 'users', uid, p);
        return {
          get: async () => { try{ return lista(await F.getDocs(c)); }catch(e){ try{ return lista(await F.getDocsFromCache(c)); }catch(e2){ return { docs:[], size:0, empty:true, metadata:{} }; } } },
          onSnapshot: (cb, err) => F.onSnapshot(c, q => cb(lista(q)), err)
        };
      }
    });
    window.__FB = {
      user: null,
      db(){ return this.user ? banco(this.user.uid) : null; },
      signIn: (e, p) => AU.signInWithEmailAndPassword(auth, e, p),
      signUp: (e, p) => AU.createUserWithEmailAndPassword(auth, e, p),
      reset: e => AU.sendPasswordResetEmail(auth, e),
      signOut: () => AU.signOut(auth),
      updateName: async (n) => { await AU.updateProfile(auth.currentUser, { displayName: n || null }); await auth.currentUser.reload(); window.__FB.user = auth.currentUser; },
      reauth: (senha) => AU.reauthenticateWithCredential(auth.currentUser, AU.EmailAuthProvider.credential(auth.currentUser.email, senha)),
      changeEmail: async (novo, senha) => { await AU.reauthenticateWithCredential(auth.currentUser, AU.EmailAuthProvider.credential(auth.currentUser.email, senha)); await AU.verifyBeforeUpdateEmail(auth.currentUser, novo); },
      sendReset: () => AU.sendPasswordResetEmail(auth, auth.currentUser.email),
      sendVerify: async () => { const u = auth.currentUser;
        try{ await AU.sendEmailVerification(u, { url: location.origin + location.pathname }); }
        catch(e){ if(/continue-uri|unauthorized-domain|invalid-continue/.test((e && e.code) || '')) await AU.sendEmailVerification(u); else throw e; } },
      reload: async () => { await auth.currentUser.reload(); window.__FB.user = auth.currentUser; return auth.currentUser; },
      deleteUser: () => AU.deleteUser(auth.currentUser)
    };
    AU.onAuthStateChanged(auth, user => { window.__FB.user = user; avisar('auth', user); });
  })();
}

</script>
